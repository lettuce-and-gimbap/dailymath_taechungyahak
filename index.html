/* --------------------------------------------------------------------
   공지/숙제 탭
   공지 등록과 숙제 관리
   -------------------------------------------------------------------- */

function NoticeTab(){
  const[noticeText,setNoticeText]=useState('');
  const[notices,setNotices]=useState([]);
  const[homeworks,setHomeworks]=useState([]);
  const[posting,setPosting]=useState(false);

  const loadAll=async()=>{
    try{
      const now=new Date();
      const nSnap=await db.collection('notices').orderBy('createdAt','desc').limit(30).get();
      const nArr=[];nSnap.forEach(d=>nArr.push({id:d.id,...d.data()}));
      setNotices(nArr);
      const hSnap=await db.collection('homework').orderBy('createdAt','desc').limit(20).get();
      const hArr=[];hSnap.forEach(d=>hArr.push({id:d.id,...d.data()}));
      setHomeworks(hArr);
    }catch(e){}
  };
  useEffect(()=>{loadAll();},[]);

  const postNotice=async()=>{
    if(!noticeText.trim())return;
    setPosting(true);
    try{
      const now=new Date();const exp=new Date(now);exp.setDate(exp.getDate()+3);
      await db.collection('notices').add({text:noticeText.trim(),createdAt:now,expiresAt:exp});
      setNoticeText('');loadAll();
    }catch(e){alert('등록 실패');}
    setPosting(false);
  };

  const deleteNotice=async(id)=>{
    if(!window.confirm('공지를 삭제할까요?'))return;
    try{await db.collection('notices').doc(id).delete();loadAll();}catch(e){}
  };

  const deleteHomework=async(id)=>{
    if(!window.confirm('숙제를 삭제(비활성화)할까요?'))return;
    try{await db.collection('homework').doc(id).set({active:false},{merge:true});loadAll();}catch(e){}
  };

  const fmt=ts=>{if(!ts)return'';const d=ts.toDate?ts.toDate():new Date(ts);return d.toLocaleDateString('ko-KR');};
  const isExpired=ts=>{if(!ts)return true;const d=ts.toDate?ts.toDate():new Date(ts);return d<new Date();};

  return(<div className="p-4 space-y-5 pb-36">
    {/* 전체공지 작성 */}
    <div className="bg-white rounded-2xl p-5 shadow-sm">
      <div className="text-sm font-black text-gray-600 mb-3">📢 전체 공지 작성</div>
      <div className="text-xs text-gray-400 mb-3">등록 후 3일간 모든 학생의 홈 화면에 표시됩니다.</div>
      <textarea value={noticeText} onChange={e=>setNoticeText(e.target.value)} placeholder="모든 학생에게 전달할 내용을 입력하세요" rows={4} className="w-full border-2 border-gray-200 rounded-xl px-3 py-2 text-sm resize-none outline-none focus:border-indigo-400 mb-3"/>
      <button onClick={postNotice} disabled={posting||!noticeText.trim()} className="w-full py-3 bg-indigo-600 text-white rounded-xl font-black text-sm disabled:opacity-40 active:scale-95 transition-all">
        {posting?'등록 중...':'전체 공지 등록 📢'}
      </button>
    </div>

    {/* 등록된 공지 목록 */}
    <div>
      <div className="text-sm font-black text-gray-500 mb-2 px-1">등록된 공지 ({notices.length})</div>
      {notices.length===0&&<div className="text-center text-gray-400 py-6 text-sm">등록된 공지가 없습니다</div>}
      <div className="space-y-3">
        {notices.map(n=>{
          const expired=isExpired(n.expiresAt);
          return(<div key={n.id} className={`bg-white rounded-2xl p-4 shadow-sm border-l-4 ${expired?'border-gray-300 opacity-60':'border-indigo-400'}`}>
            <div className="flex items-center gap-2 mb-2">
              {expired?<span className="text-xs bg-gray-200 text-gray-500 font-bold px-2 py-0.5 rounded-full">만료됨</span>
                      :<span className="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded-full">표시 중</span>}
              <span className="text-xs text-gray-400 ml-auto">만료: {fmt(n.expiresAt)}</span>
            </div>
            <p className="text-sm text-gray-700 font-medium leading-relaxed break-keep mb-3">{n.text}</p>
            <button onClick={()=>deleteNotice(n.id)} className="text-xs text-red-500 font-bold px-3 py-1.5 bg-red-50 rounded-lg active:scale-95">🗑️ 삭제</button>
          </div>);
        })}
      </div>
    </div>

    {/* 숙제 목록 */}
    <div>
      <div className="text-sm font-black text-gray-500 mb-2 px-1">📝 등록된 숙제 ({homeworks.length})</div>
      <div className="text-xs text-gray-400 mb-3 px-1">숙제는 학습지 탭 → 모의고사 생성 후 "숙제로 내기" 버튼으로 추가합니다.</div>
      {homeworks.length===0&&<div className="text-center text-gray-400 py-6 text-sm">등록된 숙제가 없습니다</div>}
      <div className="space-y-3">
        {homeworks.map(h=>{
          const expired=isExpired(h.expiresAt)||h.active===false;
          const done=(h.completedBy||[]).length;
          return(<div key={h.id} className={`bg-white rounded-2xl p-4 shadow-sm border-l-4 ${expired?'border-gray-300 opacity-60':'border-green-400'}`}>
            <div className="flex items-center gap-2 mb-2">
              {expired?<span className="text-xs bg-gray-200 text-gray-500 font-bold px-2 py-0.5 rounded-full">비활성</span>
                      :<span className="text-xs bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded-full">진행 중</span>}
              <span className="text-xs text-gray-400 ml-auto">완료: {done}명</span>
            </div>
            <div className="font-bold text-gray-800 text-sm mb-1">{h.title}</div>
            <div className="text-xs text-gray-500 mb-3">{h.level||''} · {h.questions?.length||0}문항 · 만료: {fmt(h.expiresAt)}</div>
            {!expired&&<button onClick={()=>deleteHomework(h.id)} className="text-xs text-red-500 font-bold px-3 py-1.5 bg-red-50 rounded-lg active:scale-95">🗑️ 삭제</button>}
          </div>);
        })}
      </div>
    </div>
  </div>);
}

/* --------------------------------------------------------------------

function StudentAnalysisTab(){
  const[students,setStudents]=useState([]);
  const[loading,setLoading]=useState(false);
  const[selected,setSelected]=useState(null);
  const[onlineMap,setOnlineMap]=useState({}); // {학생이름: lastSeen timestamp}
  const[sortBy,setSortBy]=useState('date'); // 'date' | 'name'
  const[sortAsc,setSortAsc]=useState(false);

  // 접속중 실시간 구독 (30초 이상 업데이트 없으면 오프라인 간주)
  useEffect(()=>{
    const unsub=db.collection('onlineStatus').onSnapshot(snap=>{
      const now=Date.now();
      const map={};
      snap.forEach(d=>{const ts=d.data().ts;if(ts&&now-ts<90000)map[d.id]=ts;});
      setOnlineMap(map);
    },()=>{});
    return()=>unsub();
  },[]);
  const[folders,setFolders]=useState(()=>{
    try{return JSON.parse(localStorage.getItem('teacherFolders')||'[{"id":"all","name":"폴더없음","ids":[]}]')}
    catch{return[{id:'all',name:'폴더없음',ids:[]}]}
  });
  const[activeFolder,setActiveFolder]=useState('all');
  const[editFolderId,setEditFolderId]=useState(null);
  const[pickerOpen,setPickerOpen]=useState(null);  // 열린 학생 id

  useEffect(()=>{
    db.collection('teacherSettings').doc('folders').get().then(snap=>{
      if(snap.exists&&snap.data().folders){
        var f=snap.data().folders;
        setFolders(f);
        try{localStorage.setItem('teacherFolders',JSON.stringify(f));}catch(e){}
      }
    }).catch(()=>{});
  },[]);

  const saveFolders=f=>{
    setFolders(f);
    try{localStorage.setItem('teacherFolders',JSON.stringify(f));}catch(e){}
    db.collection('teacherSettings').doc('folders').set({folders:f,updatedAt:Date.now()}).catch(()=>{});
  };
  const customFolders=folders.filter(f=>f.id!=='all');

  const addFolder=()=>{
    const id='f'+Date.now();
    saveFolders([...folders,{id,name:'새 폴더',ids:[]}]);
    setEditFolderId(id);
  };
  const renameFolder=(id,name)=>{saveFolders(folders.map(f=>f.id===id?{...f,name:name||f.name}:f));setEditFolderId(null);};

  const deleteFolder=(fid)=>{
    if(!confirm('이 폴더를 삭제할까요?\n안에 있던 학생들은 폴더없음으로 돌아갑니다.'))return;
    saveFolders(folders.filter(f=>f.id!==fid));
    if(activeFolder===fid)setActiveFolder('all');
  };

  // 단일 폴더 배정 (중복 없음) — fid=null 이면 폴더없음
  const assignFolder=(fid,sid)=>{
    saveFolders(folders.map(f=>{
      if(f.id==='all')return f;
      if(f.id===fid)return{...f,ids:f.ids.includes(sid)?f.ids.filter(x=>x!==sid):[...f.ids,sid]};
      return{...f,ids:f.ids.filter(x=>x!==sid)}; // 다른 폴더에서 제거
    }));
  };
  const clearFolder=(sid)=>{
    saveFolders(folders.map(f=>f.id==='all'?f:{...f,ids:f.ids.filter(x=>x!==sid)}));
  };

  const deleteStudent=async(s)=>{
    if(!confirm(`${s.name||s.id} 학생을 삭제할까요?
삭제하면 데이터가 모두 사라지고
새로 회원가입해야 합니다.`))return;
    try{
      await db.collection('users').doc(s.id).delete();
      clearFolder(s.id);

    }catch(e){alert('삭제 실패: '+e.message);}

    db.collection('math_logs').orderBy('date','desc').limit(10).get()

      .catch(()=>{});
  },[]);

function QuickFeedbackPanel({student}){
  const[open,setOpen]=useState(false);
  const[mode,setMode]=useState('general'); // 'general' | 'session'
  const[sessionIdx,setSessionIdx]=useState('');
  const[msg,setMsg]=useState('');
  const[sent,setSent]=useState(false);

  const selLog=mode==='session'&&sessionIdx!==''?student?.logs?.[Number(sessionIdx)]:null;

  const send=async()=>{
    if(!msg.trim())return;
    try{
      let logStr='';
      if(mode==='session'&&sessionIdx!==''&&student?.logs?.[Number(sessionIdx)]){
        const l=student.logs[Number(sessionIdx)];
        logStr=`${fmtDate(l.date)} ${l.time||''} | ${l.type||''} | 점수: ${l.score||''}`;
      }
      await db.collection('feedback').add({
        studentName:student.name,
        message:msg.trim(),
        relatedLog:logStr,
        read:false,
        createdAt:new Date()
      });
      setMsg('');setSent(true);
      setTimeout(()=>setSent(false),2000);
    }catch(e){alert('피드백 저장 실패: '+e.message);}
  };

  return(<div className="bg-indigo-50 border-2 border-indigo-200 rounded-2xl p-4 mb-4">
    <div className="flex items-center justify-between">
      <div className="text-sm font-black text-indigo-700">💌 피드백 주기</div>
      <button onClick={()=>setOpen(v=>!v)} className="text-xs px-2.5 py-1 bg-indigo-100 text-indigo-600 rounded-lg font-bold">
        {open?'접기 ▲':'펼치기 ▼'}
      </button>
    </div>
    {open&&<div className="mt-3 space-y-3">
      {/* 모드 선택 */}
      <div className="flex gap-2">
        <button onClick={()=>{setMode('general');setSessionIdx('');}}
          className={`flex-1 py-2 rounded-xl text-xs font-black transition-all ${mode==='general'?'bg-indigo-600 text-white shadow':'bg-white text-gray-600 border border-gray-200'}`}>
          💬 일반 피드백
        </button>
        <button onClick={()=>setMode('session')}
          className={`flex-1 py-2 rounded-xl text-xs font-black transition-all ${mode==='session'?'bg-indigo-600 text-white shadow':'bg-white text-gray-600 border border-gray-200'}`}>
          📋 특정 세션 지정
        </button>
      </div>
      {/* 세션 선택 드롭다운 */}
      {mode==='session'&&<select value={sessionIdx} onChange={e=>setSessionIdx(e.target.value)}
        className="w-full border-2 border-gray-200 rounded-xl p-2.5 text-xs font-bold focus:border-indigo-400 outline-none bg-white">
        <option value="">-- 세션을 선택하세요 --</option>
        {(student.logs||[]).slice(0,15).map((log,i)=>(
          <option key={i} value={i}>{fmtDate(log.date)} {log.time||''} | {log.type||''} | 점수: {log.score||'-'}</option>
        ))}
      </select>}
      {/* 선택 세션 정오표 미리보기 */}
      {selLog&&selLog.questions&&<div className="bg-white border border-indigo-100 rounded-xl p-3 max-h-36 overflow-y-auto">
        <div className="text-[10px] font-black text-indigo-600 mb-1.5">📊 세션 정오표</div>
        <div className="space-y-1">
          {selLog.questions.map((q,j)=>(
            <div key={j} className={`flex items-center gap-1.5 text-xs px-2 py-0.5 rounded-lg ${q.isOk?'bg-green-50':'bg-red-50'}`}>
              <span className={`font-black text-sm flex-shrink-0 ${q.isOk?'text-green-500':'text-red-500'}`}>{q.isOk?'O':'X'}</span>
              <span className="text-gray-700 break-keep leading-snug">{restoreQText(q)||''}</span>
            </div>
          ))}
        </div>
      </div>}
      {/* 메시지 입력 */}
      <textarea value={msg} onChange={e=>setMsg(e.target.value)} rows={3} lang="ko"
        placeholder={mode==='session'&&selLog?`[${fmtDate(selLog.date)} ${selLog.type||''}] 세션에 대한 피드백...`:'학생에게 전달할 피드백 메시지...'}
        className="w-full border-2 border-gray-200 rounded-xl p-3 text-sm font-bold resize-none focus:border-indigo-400 outline-none"/>
      <button onClick={send}
        className="w-full py-2.5 bg-indigo-600 text-white rounded-xl font-black text-sm active:scale-95 transition-transform">
        {sent?'✅ 전송완료!':'💌 피드백 전송'}
      </button>
    </div>}
  </div>);
}

/* --------------------------------------------------------------------
   학생 상세 분석 화면
   종합 · 행동패턴 · 영역성취 · 세션기록
   -------------------------------------------------------------------- */

function StudentDetail({student,onBack,folders,customFolders,onAssignFolder,onClearFolder,onDeleteStudent}){
  const[open,setOpen]=useState(null);
  const[tab,setTab]=useState('overview');
  const[qStats,setQStats]=useState({});
  const[qStatsLoading,setQStatsLoading]=useState(false);
  const[isExporting,setIsExporting]=useState(false);
  const[showAllSessions,setShowAllSessions]=useState(false);
  const[printLog,setPrintLog]=useState(null);
  const[correctionData,setCorrectionData]=useState({totalWrong:0,corrected:0,rate:0,loaded:false});
  const[wrongQOpen,setWrongQOpen]=useState(false);
  const[wrongQSel,setWrongQSel]=useState(new Set());
  const[wrongQShowAns,setWrongQShowAns]=useState(false);
  const logs=student.logs||[]; // ※ 분석 엔진은 전체 로그 사용 (필터 금지)
  const allWrongQs=useMemo(()=>logs.flatMap((l,li)=>(l.questions||[]).filter(q=>!q.isOk).map(q=>({...q,_logDate:l.date,_logType:l.type,_logIdx:li}))),[logs]);
  const a=analyzeStudent(student);
  const LIGHT_CLS={'light-red':'bg-red-50 text-red-700 border border-red-200','light-yel':'bg-yellow-50 text-yellow-700 border border-yellow-200','light-grn':'bg-green-50 text-green-700 border border-green-200'};
  const ORD=['①','②','③','④'];

  // ── 4축 분석 엔진 (객관 지표) ──
  const momentum=useMemo(()=>detectMomentum(logs),[logs]);
  const hesitation=useMemo(()=>buildHesitationProfile(logs),[logs]);
  const revision=useMemo(()=>buildRevisionProfile(logs),[logs]);
  const activeTime=useMemo(()=>buildActiveTimeSummary(logs),[logs]);
  const explore=useMemo(()=>buildExploreSummary(student),[student]);
  const relativeMastery=useMemo(()=>buildRelativeMastery(logs,qStats),[logs,qStats]);

  // 오답 수정 데이터 로드
  useEffect(()=>{
    if(!student.id||logs.length===0)return;
    const totalWrong=logs.flatMap(l=>l.questions||[]).filter(q=>!q.isOk).length;
    if(totalWrong===0){setCorrectionData({totalWrong:0,corrected:0,rate:0,loaded:true});return;}
    db.collection('sessionEdits')
      .orderBy(firebase.firestore.FieldPath.documentId())
      .startAt(student.id+'_')
      .endAt(student.id+'_')
      .get()
      .then(snap=>{
        let corrected=0;
        snap.forEach(doc=>{
          const data=doc.data()||{};
          Object.keys(data).forEach(k=>{if(k.startsWith('corrected_q')&&data[k]===true)corrected++;});
        });
        setCorrectionData({totalWrong,corrected,rate:Math.round(corrected/totalWrong*100),loaded:true});
      })
      .catch(()=>setCorrectionData({totalWrong,corrected:0,rate:0,loaded:true}));
  },[student.id]);

  // qStats 비동기 로드 (토픽-레벨 크로스-학생 난이도)
  useEffect(()=>{
    if(logs.length===0)return;

          <div>
            <div className="flex items-center gap-2 mb-2">
              <div className="text-xs font-black text-gray-700">🖱️ 망설임 패턴</div>
              <span className="text-[10px] bg-amber-100 text-amber-700 font-bold px-2 py-0.5 rounded-full">리스트형 (기하·모의고사)</span>
              <span className="text-[10px] text-gray-400 font-bold ml-auto">= 세션 내 참여 순서</span>

            <div className="text-[10px] text-amber-600 bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 mb-2 font-semibold">

            </div>
            {!hesitation.lst.hasData?(
              <div className="bg-gray-50 border border-gray-200 rounded-xl p-3 text-xs text-gray-400">
                리스트형 세션 기록이 없거나 firstClickMs 미수집
              </div>
            ):(
              <div className="space-y-1.5">
                {Object.entries(HESI_CFG).filter(([k])=>k!=='unknown'&&hesitation.lst.counts[k]>0).map(([k,cfg])=>{
                  const cnt=hesitation.lst.counts[k];
                  const pct=Math.round((cnt/hesitation.lst.total)*100);
                  return(
                    <div key={k} className={`p-2.5 rounded-xl border ${cfg.cls} text-xs opacity-80`}>
                      <div className="flex items-center gap-2 mb-1">
                        <span className="font-black">{cfg.lbl}</span>
                        <span className="ml-auto font-black">{cnt}문항 ({pct}%)</span>
                      </div>
                      <div className="w-full bg-white/60 rounded-full h-1.5">
                        <div className="h-1.5 rounded-full bg-current opacity-40" style={{width:`${pct}%`}}/>
                      </div>
                    </div>
                  );

            )}

          {/* ── 답안 수정 패턴 (리스트형 전용) ── */}
          <div>
            <div className="flex items-center gap-2 mb-1">

            </div>
            <div className="text-[10px] text-gray-400 mb-2">DailyPractice(자유입력)는 수정 횟수를 추적하지 않습니다.</div>
            {!revision.hasData?(
              <div className="bg-gray-50 border border-gray-200 rounded-xl p-3 text-xs text-gray-400">
                리스트형 세션 기록이 없거나 revisionCount 미수집 (새 세션부터 수집)
              </div>
            ):(
              <div className="space-y-1.5">
                {Object.entries(REV_CFG).filter(([k])=>k!=='unknown'&&revision.counts[k]>0)
                  .sort(([ka],[kb])=>['fixated','searching','uncertain_capable','reconsidered','confident'].indexOf(ka)-['fixated','searching','uncertain_capable','reconsidered','confident'].indexOf(kb))

                    const cnt=revision.counts[k];

                      <div key={k} className={`p-2.5 rounded-xl border ${cfg.cls} text-xs`}>

              <div key={i} className="bg-white border border-gray-100 rounded-2xl p-3 shadow-sm">

                  {hasRef&&<span className={`text-xs font-bold ${gapCls}`}>{m.gap>=0?'+':''}{m.gap}%p vs 전체</span>}

                  <div className={`h-2 rounded-full ${barCls}`} style={{width:`${m.myRate}%`}}/>

      )}

      {/* ── 탭 4: 세션 기록 ── */}
      {tab==='sessions'&&(
        <div className="text-base font-black text-gray-700 mb-2">세션 상세 기록</div>
      )}
    </div>

    {/* ── 오답 문제지 ── */}
    {allWrongQs.length>0&&<div className="bg-red-50 border-2 border-red-200 rounded-2xl p-4">
      <div className="flex items-center justify-between mb-2">
        <div className="text-sm font-black text-red-700">🔴 오답 문제지 ({allWrongQs.length}개 오답)</div>
        <button onClick={()=>setWrongQOpen(v=>!v)} className="text-xs px-2 py-1 bg-red-100 text-red-600 rounded-lg font-bold">{wrongQOpen?'접기 ▲':'펼치기 ▼'}</button>
      </div>
      {wrongQOpen&&React.createElement(WrongQCategoryPanel,{allWrongQs,wrongQSel,setWrongQSel,wrongQShowAns,setWrongQShowAns,studentName:student.name})}
    </div>}

    {/* 세션 기록 (탭 4 또는 항상 표시) — 5일 이내만 기본 표시, 더보기로 전체 */}
    {tab==='sessions'&&(()=>{
      const recentSessions=logs.filter(isRecentLog);
      const olderSessions=logs.length-recentSessions.length;
      const sessionLogs=showAllSessions?logs:recentSessions;
      return(<div className="space-y-3">
      <div className="flex items-center justify-between">
        <span className="text-xs font-bold text-gray-400">{showAllSessions?'전체 기록':'최근 5일 기록'}</span>
        {olderSessions>0&&<button onClick={()=>setShowAllSessions(!showAllSessions)} className="text-xs font-bold px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded-xl">{showAllSessions?'최근만 보기 ▲':`더보기 (지난 기록 ${olderSessions}개) ▼`}</button>}
      </div>
      {logs.length===0&&<div className="text-center text-gray-400 py-8 font-bold">학습 기록이 없어요.</div>}
      {logs.length>0&&sessionLogs.length===0&&<div className="text-center text-gray-400 py-6 text-sm font-bold">최근 5일간 기록이 없어요. ‘더보기’로 지난 기록을 확인하세요.</div>}
      {sessionLogs.map((log,i)=>{
        const isOpen=open===i;
        const feelIco=log.feeling==='easy'?'😊':log.feeling==='hard'?'😥':log.feeling==='normal'?'😐':'';
        const rawAcc=calcRawAccuracy(log.questions);
        const{activeSec,flagged}=estimateActiveTime(log.totalSec,log.questions?.length||10);
        return(
          <div key={i} className="bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
            <div className="flex items-center p-4 border-b border-gray-100">
              <div className="flex-1 min-w-0">
                <div className="font-bold text-gray-800 text-sm mb-1">{fmtDate(log.date)} {log.time} {feelIco}</div>
                <div className="flex items-center gap-2 flex-wrap">
                  <span className="text-xs text-gray-500">{log.type}</span>
                  <span className="font-black text-indigo-600 text-xs">{log.score}</span>
                  {rawAcc!==null&&<span className="text-[10px] font-bold bg-indigo-50 text-indigo-500 px-1.5 py-0.5 rounded-full">정답률 {rawAcc}%</span>}
                  {log.totalSec&&<span className="text-xs text-gray-400">⏱️{Math.floor(activeSec/60)}분{activeSec%60}초{flagged?'(⚠️유휴있음)':''}</span>}
                </div>
              </div>
              <button onClick={()=>setPrintLog(log)} className="text-xs text-emerald-700 font-bold px-3 py-2 bg-emerald-50 rounded-xl ml-2 flex-shrink-0">🖨️인쇄</button>
              <button onClick={()=>setOpen(isOpen?null:i)} className="text-xs text-indigo-600 font-bold px-3 py-2 bg-indigo-50 rounded-xl ml-2 flex-shrink-0">{isOpen?'닫기':'문항보기'}</button>
            </div>
            {isOpen&&log.questions&&(
              <div className="p-3 space-y-2 bg-gray-50">
                {log.questions.map((q,j)=>{
                  const hCls=q.firstClickMs!=null?HESI_CFG[classifyHesitation(q.firstClickMs,q.isOk)]?.cls:'';
                  const rCls=q.revisionCount!=null?REV_CFG[classifyRevision(q.revisionCount,q.isOk)]?.cls:'';
                  return(
                    <div key={j} className={`rounded-xl p-3 text-xs border ${q.isOk?'bg-white border-gray-200':'bg-red-50 border-red-200'}`}>
                      <div className="flex gap-2 mb-1">
                        <span className="font-black text-gray-500">Q{j+1}.</span>
                        <span className="font-bold text-gray-800 flex-1 leading-relaxed break-keep">{restoreQText(q)||''}</span>
                        <span className={`font-black text-sm flex-shrink-0 ${q.isOk?'text-green-500':'text-red-500'}`}>{q.isOk?'O':'X'}</span>
                      </div>
                      {q.examSource&&<div className="pl-6 mb-1 text-[10px] text-blue-500 font-bold">📌 {q.examSource}</div>}
                      {/* 행동 지표 뱃지 */}
                      <div className="flex items-center gap-1.5 pl-6 flex-wrap mt-1">
                        {q.meta&&<span className="text-[10px] text-indigo-400 font-bold bg-indigo-50 px-1.5 py-0.5 rounded-full">{q.meta.type}</span>}
                        {q.firstClickMs!=null&&(
                          <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full border ${hCls}`}>
                            🕐 {Math.round(q.firstClickMs/1000)}s
                          </span>
                        )}
                        {q.revisionCount!=null&&q.revisionCount>0&&(
                          <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded-full border ${rCls}`}>
                            ↩ {q.revisionCount}회 수정
                          </span>
                        )}
                        {q.timeSec!=null&&q.timeSec>0&&!q.firstClickMs&&(
                          <span className="text-[10px] text-gray-400 font-bold">⏱️{q.timeSec}초</span>
                        )}
                      </div>
                      {!q.isOk&&<div className="mt-1.5 pl-6 text-gray-500">내 답: {q.uAns} → <span className="text-red-600 font-bold">{q.cAns}</span></div>}
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
    </div>);
    })()}
    {printLog&&<SessionPrintModal log={printLog} studentName={student.name} studentId={student.id} onClose={()=>setPrintLog(null)}/>}
  </div>);
}

/* --------------------------------------------------------------------
   학습지 탭
   연산·약수·배수·문장제 문제지와 검정고시 모의고사 문제지 생성
   -------------------------------------------------------------------- */

function WorksheetTab(){
  const[wsType,setWsType]=useState('div');
  const[title,setTitle]=useState('');
  const[count,setCount]=useState(20);
  const[gcdMin,setGcdMin]=useState(12); const[gcdMax,setGcdMax]=useState(50);
  const[lcmMin,setLcmMin]=useState(2); const[lcmMax,setLcmMax]=useState(9);
  const[storyCounts,setStoryCounts]=useState({low:5, mid:3, high:2});
  const[opRatios,setOpRatios]=useState({add:25, sub:25, mul:25, div:25});
  const[wsList,setWsList]=useState([]);const[loading,setLoading]=useState(false);const[toast,setToast]=useState('');
  
  // 이름 수정 전용 상태
  const[editingWsId, setEditingWsId] = useState(null);
  const[editTitle, setEditTitle] = useState('');

  // 모의고사 문제지 전용 상태
  const[examSheet,setExamSheet]=useState(null); // 생성된 문제지 미리보기
  const[examMode,setExamMode]=useState('random'); // 'random' | 'weak'
  const[targetStudent,setTargetStudent]=useState(''); // 취약점 분석 대상 학생

  // 출제 영역 선택 (모의고사 전용)
  const[selectedDomains,setSelectedDomains]=useState([]);

  // 채점(Grading) 전용 상태
  const[gradeModal, setGradeModal] = useState(null);
  const[studentList, setStudentList] = useState([]);
  const[selStudent, setSelStudent] = useState('');
  const[grades, setGrades] = useState({});
  // 모의고사 문제지 저장 완료 여부
  const[examSaved,setExamSaved]=useState(false);
  // 숙제 대상 학생 (빈 배열 = 전체/지정 안 함, 비어있지 않으면 해당 학생들만)
  const[homeworkTargets,setHomeworkTargets]=useState([]);
  const[examPrintCols,setExamPrintCols]=useState(1);

  const TYPE_DESC={div:'세 자리 수 ÷ 두 자리 수 (가로셈, 나머지 있음)',gcd:'두 수의 약수, 공약수, 최대공약수 구하기',lcm:'두 수의 배수 7개씩, 공배수, 최소공배수 구하기',story:'초3~초4 맞춤형 스토리텔링 문장제 문제',mock_middle:'2023~2026 중졸 검정고시 최근 핵심 유형 변형 (10문항 사지선다)',mock_high:'2023~2026 고졸 검정고시 최근 핵심 유형 변형 (10문항 사지선다)',geo:'기하학 6파트 (무리/유리/이차함수·거리·원·대칭이동) 사지선다 문제'};

  // 영역별 정답률 계산 (학생 로그 기반)
  const HIGH_DOMAIN_GENS_T={'다항식 계산':genMockPoly,'방정식과 부등식':genMockEqInequal,'도형과 기하':genMockGeometry,'집합과 함수':genMockSetFunc,'확률과 통계':genMockProbStat};
  const DOMAIN_GENS_T=wsType==='mock_middle'?MID_DOMAIN_GENS:HIGH_DOMAIN_GENS_T;
  const DOMAINS_T=Object.keys(DOMAIN_GENS_T);
  const computeStatsT=(logs)=>{
    const s={};DOMAINS_T.forEach(d=>s[d]={c:0,t:0});
    (logs||[]).forEach(log=>{
      if(!log.questions)return;
      log.questions.forEach(q=>{
        const type=(q.meta?.type||log.type||'').toLowerCase();
        const cat=(q.meta?.category||'').toLowerCase();
        const exact=DOMAINS_T.find(d=>type.includes(d.toLowerCase()));
        if(exact){s[exact].t++;if(q.isOk)s[exact].c++;return;}
        if(wsType==='mock_middle')return;
        if(type.includes('다항식')||cat==='poly'||type.includes('항등식')||type.includes('인수분해')||type.includes('나머지'))
          {s['다항식 계산'].t++;if(q.isOk)s['다항식 계산'].c++;}
        else if(type.includes('방정식')||type.includes('부등식')||cat==='eq'||cat==='ineq')
          {s['방정식과 부등식'].t++;if(q.isOk)s['방정식과 부등식'].c++;}
        else if(type.includes('기하')||type.includes('도형')||cat==='geometry')
          {s['도형과 기하'].t++;if(q.isOk)s['도형과 기하'].c++;}
        else if(type.includes('함수')||type.includes('집합')||type.includes('명제')||cat==='set'||cat==='func')
          {s['집합과 함수'].t++;if(q.isOk)s['집합과 함수'].c++;}
        else if(type.includes('확률')||type.includes('순열')||type.includes('조합')||cat==='stat')
          {s['확률과 통계'].t++;if(q.isOk)s['확률과 통계'].c++;}
      });
    });
    return s;
  };

  // 모의고사 문제지 생성
  const createExamSheet=()=>{
    const safeGen=(gen)=>{try{const q=gen();return q||null;}catch(e){return null;}};
    const activeDomains=selectedDomains.length>0?DOMAINS_T.filter(d=>selectedDomains.includes(d)):DOMAINS_T;
    let pool=[];
    if(examMode==='weak'&&targetStudent){
      const stu=studentList.find(s=>s.name===targetStudent);
      const stats=stu?computeStatsT(stu.logs||[]):{};
      const weakDomains=activeDomains.filter(d=>!stats[d]||stats[d].t===0||(stats[d].c/stats[d].t)<0.7);
      const targets=weakDomains.length>0?weakDomains:activeDomains;
      // ── 취약점 모드 중복 방지: 토픽 + 문제 텍스트 기준 ──
      const seenQ=new Set();
      let safety=0;
      while(pool.length<10&&safety<60){
        safety++;
        const dom=targets[pool.length%targets.length];
        const q=safeGen(DOMAIN_GENS_T[dom]);
        if(q){
          const qKey=`${q.topic}::${q.q?.slice(0,30)||''}`;
          if(!seenQ.has(qKey)){seenQ.add(qKey);pool.push(q);}
        }
      }
    }else{
      // ── 랜덤 모드: 토픽 중복 방지 + 문제 텍스트 중복 방지 ──

      const usedQTexts=new Set();
      activeDomains.forEach(dom=>{
        let added=0,retries=0;
        while(added<2&&retries<15){
          const q=safeGen(DOMAIN_GENS_T[dom]);
          if(q){
            const qKey=`${q.topic}::${q.q?.slice(0,30)||''}`;
            const topicOk=!usedTopics.has(q.topic);
            const textOk=!usedQTexts.has(qKey);
            if(topicOk&&textOk){
              usedTopics.add(q.topic);usedQTexts.add(qKey);pool.push(q);added++;
            } else if(retries>=13&&textOk){
              // 토픽 중복은 허용하되 문제 텍스트 중복은 끝까지 방지
              usedQTexts.add(qKey);pool.push(q);added++;
            }
          }
          retries++;
        }
      });
      pool=shuffle(pool);
    }
    let safety=0;
    const usedTopicsAll=new Set(pool.map(q=>q.topic));
    const usedQAll=new Set(pool.map(q=>`${q.topic}::${q.q?.slice(0,30)||''}`));

        const qKey=`${q.topic}::${q.q?.slice(0,30)||''}`;
        if(!usedQAll.has(qKey)){usedTopicsAll.add(q.topic);usedQAll.add(qKey);pool.push(q);}

          });

/* --------------------------------------------------------------------
   만능 학습지 탭
   좌표 중심 + 고졸 검정고시 전 유형 학습지 작업대
   -------------------------------------------------------------------- */

/* =====================================================================
   만능 학습지 편집실 (선생님 탭) — 여러 장 보관(작업대) 방식
   - 좌표 중심 프리셋 + 고졸 검정고시 20문항 전 유형 선택
   - [학습지 만들기]를 누르면 새 학습지가 "추가"된다. 이전 학습지는 지워지지 않고 접힌 채 남는다.
   - 학습지마다 : 접기/펼치기 토글 · 저장(클라우드) · 반출(인쇄/PDF · 새 탭 · JSON) · 삭제
   - 유형별 [개념] → [예제] → [실전 n문항] 자동 생성, 문항별 조건 편집 / 새 숫자 / 추가 / 삭제
   - 글자 편집 모드(내용 덮어쓰기), 정답 보기, 사지선다·서술형 전환, 2단 인쇄, 글자 크기
   - localStorage 자동 임시저장(v1 단일 학습지 데이터는 자동으로 옮겨 온다)
   ===================================================================== */
var GED_LS_KEY='ged_sheet_builder_v2';

var GED_LS_KEY_V1='ged_sheet_builder_v1';

var GED_DEF_CFG={title:'고졸 검정고시 수학 · 좌표 완전정복 학습지',subtitle:'좌표 기초 · 대칭이동 · 평행이동 · 이차함수 · 원의 방정식 · 유리·무리함수 · 내분점 — 2024년 이후 출제 유형 중심',
  fs:24,cols2:false,showAns:false,format:'choice',includeConcept:true,includeExample:true,intro:true,count:3};

function gedNewRec(u,idx,params){return{key:`${u.id}-${idx}-${Date.now().toString(36)}${Math.random().toString(36).slice(2,6)}`,uid:u.id,idx,params,override:null,rev:0};}

function gedSafeBuild(u,p){try{const r=u.build(p);return r&&!r.err?r:null;}catch(e){return null;}}

function gedSheetId(){return 's'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* 유형 하나에 대해 예제 + 실전 n문항 생성 (문제 텍스트 중복 방지) */
function gedGenUnit(u,count,withEx){
  const out=[];
  if(withEx)out.push(gedNewRec(u,0,{...u.def}));
  const seen=new Set();
  for(let i=1;i<=count;i++){
    let params=null;
    for(let t=0;t<20;t++){const c=u.rand();const r=gedSafeBuild(u,c);if(!r)continue;
      const k=r.q+'|'+(r.answerTex||r.answerRaw||'');if(!seen.has(k)){seen.add(k);params=c;break;}}
    if(!params){for(let t=0;t<10&&!params;t++){const c=u.rand();if(gedSafeBuild(u,c))params=c;}}
    out.push(gedNewRec(u,i,params||{...u.def}));
  }
  return out;
}

/* 문항 목록 → 유형별 묶음 + 실전 문항 번호 매기기 */
function gedGroups(problems){
  const gs=[];let no=0;
  GED_UNITS.forEach(u=>{const recs=(problems||[]).filter(p=>p.uid===u.id);if(!recs.length)return;
    gs.push({unit:u,recs:recs.map(r=>({...r,no:r.idx===0?'예제':++no}))});});
  return gs;
}

function gedFmtTime(ts){if(!ts)return'';const d=ts&&ts.toDate?ts.toDate():new Date(ts);
  return`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}

function gedSafeName(s){return String(s||'학습지').replace(/[\\/:*?"<>|]/g,'_').slice(0,60);}

/* 새 학습지 한 장 만들기 */
function gedMakeSheet(cfg,problems,docId){
  return{id:gedSheetId(),cfg:{...cfg},problems,docId:docId||null,collapsed:false,edit:false,showCtrl:true,createdAt:Date.now()};
}

/* localStorage 복원 (v2 → 없으면 v1 단일 학습지를 한 장으로 옮겨 옴) */
function gedLoadInit(){
  const def={setupCfg:{...GED_DEF_CFG},selected:GED_PRESETS[0].ids,sheets:[]};
  try{
    const d=JSON.parse(localStorage.getItem(GED_LS_KEY)||'null');
    if(d&&Array.isArray(d.sheets))
      return{setupCfg:{...GED_DEF_CFG,...(d.setupCfg||{})},selected:(d.selected&&d.selected.length?d.selected:def.selected),
        sheets:d.sheets.map(s=>({...gedMakeSheet({...GED_DEF_CFG,...(s.cfg||{})},[],s.docId),...s,
          cfg:{...GED_DEF_CFG,...(s.cfg||{})},problems:(s.problems||[]).map(p=>({...p,rev:0}))}))};
    const v1=JSON.parse(localStorage.getItem(GED_LS_KEY_V1)||'null');
    if(v1&&v1.cfg&&Array.isArray(v1.problems)&&v1.problems.length){
      const sh=gedMakeSheet({...GED_DEF_CFG,...v1.cfg},v1.problems.map(p=>({...p,rev:0})),v1.docId);
      return{setupCfg:{...GED_DEF_CFG,...v1.cfg},selected:(v1.selected&&v1.selected.length?v1.selected:def.selected),sheets:[sh]};
    }
  }catch(e){}
  return def;
}

/* 숫자 조건 입력칸 — 포커스를 잃지 않도록 로컬 상태로 관리, 유효한 정수일 때만 부모에 반영 */
function GedNumField({label,value,min,max,onCommit}){
  const[v,setV]=useState(String(value));
  useEffect(()=>{setV(String(value));},[value]);
  const tRef=useRef(null);
  const change=e=>{const s=e.target.value;setV(s);clearTimeout(tRef.current);
    const n=parseInt(s,10);if(!isNaN(n)&&n!==value){tRef.current=setTimeout(()=>onCommit(n),350);}};
  return<label>{label}<input type="number" value={v} min={min} max={max} onChange={change} onBlur={()=>{const n=parseInt(v,10);if(!isNaN(n)&&n!==value){clearTimeout(tRef.current);onCommit(n);}}}/></label>;
}

/* 문제 카드 : 생성 HTML(또는 덮어쓴 HTML) + 조건 편집 패널 */
function GedProblemCard({rec,unit,no,edit,showCtrl,onParam,onRandom,onRemove,onRevert,onOverride,getOverride}){
  const ref=useRef();
  const paramsKey=JSON.stringify(rec.params);
  const html=useMemo(()=>getOverride(rec.key)||GS.probHTML(unit,rec.params,rec.idx,no),[paramsKey,rec.rev,rec.idx,no]);
  useEffect(()=>{GS.renderTex(ref.current);},[html]);
  const isEx=rec.idx===0;
  return<div className={`card${isEx?' ex':''}${rec.override?' overridden':''}`}>
    <div ref={ref} className="pslot" contentEditable={edit} suppressContentEditableWarning={true}
      onInput={e=>onOverride(rec.key,e.currentTarget.innerHTML)}
      dangerouslySetInnerHTML={{__html:html}}/>
    {showCtrl&&<div className="ctrl noprint">
      <span className="tag">{isEx?'예제':'실전'} 조건</span>
      {unit.fields.map(f=>f.sel
        ?<label key={f.k}>{f.label} <select value={rec.params[f.k]} onChange={e=>onParam(rec.key,f.k,e.target.value)}>{f.sel.map(o=><option key={o} value={o}>{o}</option>)}</select></label>
        :<GedNumField key={f.k} label={f.label} value={rec.params[f.k]} min={f.min} max={f.max} onCommit={n=>onParam(rec.key,f.k,n)}/>)}
      <button onClick={()=>onRandom(rec.key)}>🎲 새 숫자</button>
      {rec.override&&<button onClick={()=>onRevert(rec.key)}>↩ 생성 상태로</button>}
      <button className="danger" onClick={()=>onRemove(rec.key)}>✕ 삭제</button>
    </div>}
  </div>;
}

/* ─────────────────────────────────────────────────────────────
   학습지 한 장 : 머리글(항상 보임) + 도구막대 + 미리보기(펼쳤을 때만)

        <span className="flex-1 min-w-0">
          <span className="block text-sm font-black text-gray-800 truncate">{cfg.title||'제목 없는 학습지'}</span>
          <span className="block text-[11px] text-gray-500 font-bold truncate">
            {groups.length}유형 · 실전 {totalQ}문항 · {gedFmtTime(sheet.createdAt)}
            {docId?<span className="text-emerald-600"> · ☁ 저장됨</span>:<span className="text-amber-600"> · 저장 안 됨</span>}

        <button onClick={()=>ops.exportJSON(id)} className="py-2 px-2.5 bg-gray-100 text-gray-700 rounded-xl font-bold text-xs" style={{minHeight:'42px'}}>📤 JSON</button>

      <div ref={ref} className={cls+' mt-3'} style={{'--fs':cfg.fs+'px'}}>
        <h1>{cfg.title||'고졸 검정고시 수학 · 만능 학습지'}</h1>
        {cfg.subtitle&&<p className="sub">{cfg.subtitle}</p>}
        <div className="namebox"><span>이름 : ______________</span><span>날짜 : ______ 월 ______ 일</span></div>
        {cfg.intro&&<div className="card concept intro"><span className="cap">이 학습지를 쓰는 방법</span><ul>
          <li>유형마다 <b>[개념] → [예제] → [실전 문제]</b> 순서로 갑니다. 개념은 한 줄만 외우면 됩니다.</li>
          <li>좌표평면 문제는 <b>x축·y축의 눈금을 먼저 손가락으로 짚고</b>, 점의 자리를 읽는 것부터 시작합니다.</li>
          <li>대칭이동은 <b>종이접기</b>, 평행이동은 <b>밀기</b>. 이 두 마디만 기억해도 절반은 끝납니다.</li>
          <li>실전 문제는 시험지와 똑같은 모양입니다. 답을 고르고, 점선 상자에 풀이를 써 보세요.</li></ul></div>}
        {groups.map(g=>{const u=g.unit;const ex=g.recs.filter(r=>r.idx===0),qs=g.recs.filter(r=>r.idx!==0);
          const cardProps={edit,showCtrl,onParam:(k,f,v)=>ops.onParam(id,k,f,v),onRandom:k=>ops.onRandom(id,k),
            onRemove:k=>ops.onRemoveProb(id,k),onRevert:k=>ops.onRevert(id,k),onOverride:ops.onOverride,getOverride:ops.getOverride};
          return<div key={u.id}>
            <h2 id={'gs-'+id+'-'+u.id}>{u.tag}. {u.title}<small>{u.src}</small></h2>
            {showCtrl&&<div className="ctrl noprint"><span className="tag">유형</span>
              <button onClick={()=>ops.addProblem(id,u.id)}>＋ 실전 문항 추가</button>
              <button className="danger" onClick={()=>{if(confirm(`'${u.title}' 유형을 이 학습지에서 뺄까요?`))ops.removeUnit(id,u.id);}}>✕ 이 유형 빼기</button></div>}
            {cfg.includeConcept&&<div className="card concept" dangerouslySetInnerHTML={{__html:GS.conceptHTML(u)}}/>}
            {ex.length>0&&<h3>풀이 예시</h3>}
            {ex.map(r=><GedProblemCard key={r.key} rec={r} unit={u} no={r.no} {...cardProps}/>)}
            {qs.length>0&&<h3>실전 문제</h3>}
            {qs.length>0&&<div className="qgrid">{qs.map(r=><GedProblemCard key={r.key} rec={r} unit={u} no={r.no} {...cardProps}/>)}</div>}
          </div>;})}
        {problems.length===0&&<p className="sub">문항이 모두 빠졌습니다. 이 학습지는 삭제하거나, 설정에서 새로 만들어 주세요.</p>}
      </div>
    </div>}
  </div>;
}

/* ─────────────────────────────────────────────────────────────
   탭 본체
   ───────────────────────────────────────────────────────────── */
function GedWorksheetTab(){
  const UNITS=GED_UNITS;const byId=id=>UNITS.find(u=>u.id===id);
  const init=useMemo(gedLoadInit,[]);
  const[setupCfg,setSetupCfgRaw]=useState(init.setupCfg);
  const setSetupCfg=patch=>setSetupCfgRaw(c=>({...c,...patch}));
  const[selected,setSelected]=useState(init.selected);
  const[sheets,setSheets]=useState(init.sheets);
  const[showSetup,setShowSetup]=useState(init.sheets.length===0);
  const[showUnits,setShowUnits]=useState(false);
  const[cloudList,setCloudList]=useState([]);
  const[busy,setBusy]=useState(false);
  const[toast,setToast]=useState('');
  const[quotaWarn,setQuotaWarn]=useState(false);
  const ovRef=useRef({});
  const fileRef=useRef();
  useEffect(()=>{init.sheets.forEach(s=>(s.problems||[]).forEach(p=>{if(p.override)ovRef.current[p.key]=p.override;}));},[]);

  const showToast=m=>{setToast(m);clearTimeout(showToast._t);showToast._t=setTimeout(()=>setToast(''),2800);};
  const withOv=ps=>ps.map(p=>({...p,override:ovRef.current[p.key]||null}));
  const getSheet=id=>sheets.find(s=>s.id===id);

  /* ---------- 자동 임시저장 ---------- */
  const saveLocal=useCallback(()=>{
    try{
      localStorage.setItem(GED_LS_KEY,JSON.stringify({setupCfg,selected,
        sheets:sheets.map(s=>({...s,problems:withOv(s.problems)}))}));
      setQuotaWarn(false);
    }catch(e){setQuotaWarn(true);}
  },[setupCfg,selected,sheets]);
  useEffect(()=>{const t=setTimeout(saveLocal,700);return()=>clearTimeout(t);},[saveLocal]);
  const ovTimer=useRef(null);

  /* ---------- 학습지 단위 조작 ---------- */
  const patchSheet=(id,fn)=>setSheets(ss=>ss.map(s=>s.id===id?fn(s):s));
  const setCfg=(id,patch)=>patchSheet(id,s=>({...s,cfg:{...s.cfg,...patch}}));
  const setUI=(id,patch)=>patchSheet(id,s=>({...s,...patch}));
  const toggle=id=>patchSheet(id,s=>({...s,collapsed:!s.collapsed}));
  const collapseAll=v=>setSheets(ss=>ss.map(s=>({...s,collapsed:v})));
  const removeSheet=id=>{
    const s=getSheet(id);if(!s)return;
    if(!confirm(`'${s.cfg.title||'제목 없는 학습지'}' 를 작업대에서 지울까요?${s.docId?'\n(클라우드에 저장된 사본은 그대로 남습니다)':'\n(저장하지 않았다면 되살릴 수 없습니다)'}`))return;
    s.problems.forEach(p=>delete ovRef.current[p.key]);
    setSheets(ss=>ss.filter(x=>x.id!==id));showToast('🗑️ 작업대에서 지웠습니다.');
  };
  const clearAll=()=>{if(!sheets.length)return;
    if(!confirm(`작업대의 학습지 ${sheets.length}장을 모두 지울까요?\n(클라우드에 저장된 사본은 그대로 남습니다)`))return;
    ovRef.current={};setSheets([]);setShowSetup(true);showToast('🔁 작업대를 비웠습니다.');};

  /* ---------- 문항 조작 ---------- */
  const mapProbs=(id,fn)=>patchSheet(id,s=>({...s,problems:fn(s.problems)}));
  const onParam=(id,key,k,v)=>{delete ovRef.current[key];mapProbs(id,ps=>ps.map(p=>p.key===key?{...p,params:{...p.params,[k]:v},override:null,rev:p.rev+1}:p));};
  const onRandom=(id,key)=>{delete ovRef.current[key];mapProbs(id,ps=>ps.map(p=>p.key===key?{...p,params:byId(p.uid).rand(),override:null,rev:p.rev+1}:p));};
  const onRevert=(id,key)=>{delete ovRef.current[key];mapProbs(id,ps=>ps.map(p=>p.key===key?{...p,override:null,rev:p.rev+1}:p));};
  const onRemoveProb=(id,key)=>{delete ovRef.current[key];mapProbs(id,ps=>ps.filter(p=>p.key!==key));};
  const addProblem=(id,uid)=>{const u=byId(uid);mapProbs(id,ps=>{const mine=ps.filter(p=>p.uid===uid);const idx=Math.max(0,...mine.map(p=>p.idx))+1;
    const[rec]=gedGenUnit(u,1,false);rec.idx=idx;const last=ps.map(p=>p.uid).lastIndexOf(uid);const out=ps.slice();out.splice(last+1,0,rec);return out;});};
  const removeUnit=(id,uid)=>mapProbs(id,ps=>{ps.filter(p=>p.uid===uid).forEach(p=>delete ovRef.current[p.key]);return ps.filter(p=>p.uid!==uid);});
  const onOverride=(key,html)=>{ovRef.current[key]=html;
    setSheets(ss=>ss.map(s=>s.problems.some(p=>p.key===key&&!p.override)?{...s,problems:s.problems.map(p=>p.key===key?{...p,override:'1'}:p)}:s));
    clearTimeout(ovTimer.current);ovTimer.current=setTimeout(saveLocal,900);};
  const getOverride=key=>ovRef.current[key]||null;

  /* ---------- 생성 : 기존 학습지는 접어 두고 새 장을 맨 위에 추가 ---------- */
  const generate=()=>{
    if(!selected.length){showToast('유형을 하나 이상 골라 주세요.');return;}
    const list=[];UNITS.forEach(u=>{if(selected.includes(u.id))list.push(...gedGenUnit(u,setupCfg.count,setupCfg.includeExample));});
    const sh=gedMakeSheet(setupCfg,list,null);
    const before=sheets.length;
    setSheets(ss=>[sh,...ss.map(s=>({...s,collapsed:true}))]);
    setShowSetup(false);
    showToast(before?`✅ 새 학습지를 추가했습니다. (기존 ${before}장은 접어 두었습니다)`:'✅ 학습지를 만들었습니다.');
    setTimeout(()=>{const el=document.getElementById('ged-sheet-'+sh.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},60);
  };
  const applyPreset=pre=>{setSelected(pre.ids);
    if(pre.k==='coord'||pre.k==='warm')setSetupCfg({title:'고졸 검정고시 수학 · 좌표 완전정복 학습지',subtitle:GED_DEF_CFG.subtitle});
    else if(pre.k==='all20'||pre.k==='full')setSetupCfg({title:'고졸 검정고시 수학 · 유형별 만능 학습지',subtitle:'1번~20번 전 유형 — 2026년 출제 형식 기준'});
    else if(pre.k==='geo')setSetupCfg({title:'고졸 검정고시 수학 · 도형의 방정식 학습지',subtitle:'두 점 사이의 거리 · 내분점 · 점과 직선 · 원 · 대칭이동과 평행이동'});};
  const toggleUnit=id=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):UNITS.map(u=>u.id).filter(x=>x===id||s.includes(x)));
  const toggleArea=k=>{const ids=UNITS.filter(u=>u.area===k).map(u=>u.id);const all=ids.every(i=>selected.includes(i));
    setSelected(s=>all?s.filter(x=>!ids.includes(x)):UNITS.map(u=>u.id).filter(x=>ids.includes(x)||s.includes(x)));};

  /* ---------- 반출 : 인쇄 / PDF / 새 탭 ---------- */
  const openDoc=(id,autoPrint)=>{
    const s=getSheet(id);if(!s)return;
    if(!s.problems.length){showToast('문항이 없는 학습지입니다.');return;}
    const gs=gedGroups(s.problems).map(g=>({unit:g.unit,recs:g.recs.map(r=>({...r,override:ovRef.current[r.key]||null}))}));
    const w=window.open('','_blank');
    if(!w){showToast('팝업이 차단되었습니다. 브라우저에서 팝업을 허용해 주세요.');return;}
    w.document.open();w.document.write(GS.docHTML(s.cfg,gs,{autoPrint}));w.document.close();
    if(autoPrint)showToast('🖨️ 인쇄창에서 "PDF로 저장"을 고르면 PDF 파일이 됩니다.');
  };
  /* ---------- 반출 : JSON ---------- */
  const exportJSON=id=>{
    const s=getSheet(id);if(!s)return;
    const data={v:2,cfg:s.cfg,selected:[...new Set(s.problems.map(p=>p.uid))],problems:withOv(s.problems)};
    const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`${gedSafeName(s.cfg.title)}_${todayStr()}.json`;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);showToast('📤 JSON 파일을 내려받았습니다.');
  };
  const importJSON=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{try{
      const d=JSON.parse(rd.result);
      const list=Array.isArray(d.sheets)?d.sheets:(d.cfg&&Array.isArray(d.problems)?[d]:null);
      if(!list||!list.length)throw 0;
      const added=list.map(x=>{(x.problems||[]).forEach(p=>{if(p.override)ovRef.current[p.key]=p.override;});
        return gedMakeSheet({...GED_DEF_CFG,...(x.cfg||{})},(x.problems||[]).map(p=>({...p,rev:0})),null);});
      setSheets(ss=>[...added,...ss.map(s=>({...s,collapsed:true}))]);setShowSetup(false);
      showToast(`📥 학습지 ${added.length}장을 불러왔습니다.`);
    }catch(err){showToast('❌ 파일 형식을 확인해 주세요.');}};
    rd.readAsText(f);e.target.value='';};

  /* ---------- Firestore ---------- */
  const loadList=async()=>{try{const snap=await db.collection('gedSheets').orderBy('createdAt','desc').limit(40).get();
    const arr=[];snap.forEach(d=>{const x=d.data();arr.push({id:d.id,title:x.title,createdAt:x.createdAt,count:x.count,units:x.units});});setCloudList(arr);}catch(e){}};
  useEffect(()=>{loadList();},[]);
  const saveCloud=async(id)=>{
    const s=getSheet(id);if(!s)return;
    if(!s.problems.length){showToast('문항이 없는 학습지는 저장할 수 없습니다.');return;}
    setBusy(true);
    try{
      const gs=gedGroups(s.problems);
      const data={title:s.cfg.title,cfg:s.cfg,selected:[...new Set(s.problems.map(p=>p.uid))],problems:withOv(s.problems),
        count:s.problems.filter(p=>p.idx!==0).length,units:gs.map(g=>g.unit.tag+' '+g.unit.title),updatedAt:new Date()};
      if(s.docId){await db.collection('gedSheets').doc(s.docId).set(data,{merge:true});showToast('✅ 덮어쓰기 저장했습니다.');}
      else{const ref=await db.collection('gedSheets').add({...data,createdAt:new Date()});patchSheet(id,x=>({...x,docId:ref.id}));showToast('✅ 클라우드에 저장했습니다.');}
      loadList();
    }catch(e){showToast('❌ 저장 실패. 인터넷을 확인하세요.');}
    setBusy(false);
  };
  /* 클라우드 → 작업대에 "추가"로 연다 (이미 열려 있으면 그 장으로 이동) */
  const openCloud=async(cid)=>{
    const open=sheets.find(s=>s.docId===cid);
    if(open){patchSheet(open.id,s=>({...s,collapsed:false}));
      setTimeout(()=>{const el=document.getElementById('ged-sheet-'+open.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},60);
      showToast('이미 작업대에 열려 있습니다.');return;}
    setBusy(true);
    try{const d=await db.collection('gedSheets').doc(cid).get();
      if(!d.exists){showToast('문서를 찾을 수 없습니다.');setBusy(false);return;}
      const x=d.data();(x.problems||[]).forEach(p=>{if(p.override)ovRef.current[p.key]=p.override;});
      const sh=gedMakeSheet({...GED_DEF_CFG,...(x.cfg||{})},(x.problems||[]).map(p=>({...p,rev:0})),cid);
      setSheets(ss=>[sh,...ss.map(s=>({...s,collapsed:true}))]);setShowSetup(false);showToast('📂 작업대에 열었습니다.');
      setTimeout(()=>{const el=document.getElementById('ged-sheet-'+sh.id);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},60);
    }catch(e){showToast('❌ 불러오기 실패');}
    setBusy(false);
  };
  const deleteCloud=async(cid)=>{
    if(!confirm('클라우드에 저장된 이 학습지를 삭제할까요?\n(작업대에 열려 있는 장은 남지만 저장 연결이 끊깁니다)'))return;
    try{await db.collection('gedSheets').doc(cid).delete();
      setSheets(ss=>ss.map(s=>s.docId===cid?{...s,docId:null}:s));
      showToast('🗑️ 클라우드에서 삭제했습니다.');loadList();
    }catch(e){showToast('❌ 삭제 실패');}
  };

  const ops={setCfg,setUI,toggle,removeSheet,saveCloud,openDoc,exportJSON,onParam,onRandom,onRemoveProb,onRevert,addProblem,removeUnit,onOverride,getOverride};
  const Btn=({on,children,...rest})=><button {...rest} className={`px-3 py-2 rounded-xl font-bold text-xs whitespace-nowrap ${on?'bg-indigo-600 text-white':'bg-gray-100 text-gray-700'}`} style={{minHeight:'40px'}}>{children}</button>;

  return<div className="p-4 space-y-4 fade-in">
    <style>{GS.SHEET_CSS}</style>
    {toast&&<div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white px-5 py-3 rounded-2xl text-sm font-bold shadow-xl">{toast}</div>}

    {/* ── 설정 패널 ── */}
    <div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
      <div className="flex items-center gap-2">
        <div className="text-2xl">📐</div>
        <div className="flex-1"><div className="text-base font-black text-gray-800">만능 학습지 편집실</div>
          <div className="text-[11px] text-gray-500 font-medium">만들 때마다 새 학습지가 작업대에 쌓입니다. 이전 학습지는 지워지지 않아요.</div></div>
        <button onClick={()=>setShowSetup(s=>!s)} className="text-xs font-bold text-indigo-600 px-3 py-2 bg-indigo-50 rounded-xl" style={{minHeight:'36px'}}>{showSetup?'접기 ▲':'＋ 새로 만들기'}</button>
      </div>

      {showSetup&&<div className="mt-4 space-y-4">
        {/* 프리셋 */}
        <div>
          <div className="text-xs font-black text-gray-500 uppercase mb-2">1. 무엇을 담을까요? (프리셋)</div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            {GED_PRESETS.map(pre=>{const on=pre.ids.length===selected.length&&pre.ids.every(i=>selected.includes(i));
              return<button key={pre.k} onClick={()=>applyPreset(pre)} className={`text-left p-3 rounded-2xl border-2 transition-all ${on?'border-indigo-500 bg-indigo-50':'border-gray-100 bg-gray-50'}`} style={{minHeight:'54px'}}>
                <div className="text-sm font-black text-gray-800">{pre.icon} {pre.lbl} <span className="text-[10px] text-gray-400 font-bold">{pre.ids.length}유형</span></div>
                <div className="text-[11px] text-gray-500 font-medium">{pre.desc}</div></button>;})}
          </div>
          <button onClick={()=>setShowUnits(s=>!s)} className="mt-2 text-xs font-bold text-indigo-600" style={{minHeight:'32px'}}>{showUnits?'유형 목록 접기 ▲':`유형 하나하나 고르기 ▼ (현재 ${selected.length}개 선택)`}</button>
          {showUnits&&<div className="mt-2 space-y-2">
            {GED_AREAS.map(ar=>{const us=UNITS.filter(u=>u.area===ar.k);const all=us.every(u=>selected.includes(u.id));
              return<div key={ar.k} className="bg-gray-50 rounded-2xl p-3">
                <label className="flex items-center gap-2 cursor-pointer"><input type="checkbox" checked={all} onChange={()=>toggleArea(ar.k)} style={{width:18,height:18,minHeight:0}}/>
                  <span className="text-sm font-black text-gray-800">{ar.title}</span><span className="text-[11px] text-gray-400 font-bold">{ar.desc}</span></label>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-1 mt-2 pl-1">
                  {us.map(u=><label key={u.id} className="flex items-center gap-2 cursor-pointer text-xs font-bold text-gray-700 py-1">
                    <input type="checkbox" checked={selected.includes(u.id)} onChange={()=>toggleUnit(u.id)} style={{width:16,height:16,minHeight:0}}/>
                    <span>{u.tag}. {u.title}{u.coord&&<span className="text-amber-500"> ★</span>}</span></label>)}
                </div></div>;})}
            <div className="text-[11px] text-gray-400 font-medium">★ = 좌표평면 그림이 들어가는 좌표 중심 유형</div>
          </div>}
        </div>

        {/* 구성 */}
        <div>
          <div className="text-xs font-black text-gray-500 uppercase mb-2">2. 어떻게 구성할까요?</div>
          <div className="flex flex-wrap gap-2 items-center">
            <span className="text-xs font-bold text-gray-600">유형당 실전</span>
            {[1,2,3,4,5,6].map(n=><Btn key={n} on={setupCfg.count===n} onClick={()=>setSetupCfg({count:n})}>{n}문항</Btn>)}
          </div>
          <div className="flex flex-wrap gap-2 mt-2">
            <Btn on={setupCfg.includeConcept} onClick={()=>setSetupCfg({includeConcept:!setupCfg.includeConcept})}>📖 개념 카드</Btn>
            <Btn on={setupCfg.includeExample} onClick={()=>setSetupCfg({includeExample:!setupCfg.includeExample})}>💡 예제(풀이 공개)</Btn>
            <Btn on={setupCfg.intro} onClick={()=>setSetupCfg({intro:!setupCfg.intro})}>📌 사용법 안내 상자</Btn>
            <Btn on={setupCfg.format==='choice'} onClick={()=>setSetupCfg({format:'choice'})}>사지선다</Btn>
            <Btn on={setupCfg.format==='open'} onClick={()=>setSetupCfg({format:'open'})}>서술형(보기 없음)</Btn>
          </div>
          <div className="grid grid-cols-1 gap-2 mt-3">
            <input value={setupCfg.title} onChange={e=>setSetupCfg({title:e.target.value})} placeholder="학습지 제목" className="w-full border-2 border-gray-200 rounded-xl px-3 py-2 text-sm font-bold outline-none focus:border-indigo-400" style={{minHeight:'44px'}}/>
            <input value={setupCfg.subtitle} onChange={e=>setSetupCfg({subtitle:e.target.value})} placeholder="부제(선택)" className="w-full border-2 border-gray-200 rounded-xl px-3 py-2 text-xs font-medium outline-none focus:border-indigo-400" style={{minHeight:'40px'}}/>
          </div>
        </div>

        <button onClick={generate} className="w-full py-4 bg-indigo-600 text-white text-base font-black rounded-2xl active:scale-95 transition-transform shadow-md" style={{minHeight:'56px'}}>
          🎲 새 학습지 추가 → {selected.length}유형 × {setupCfg.count}문항{setupCfg.includeExample?' + 예제':''}
        </button>
        <div className="flex gap-2">
          <button onClick={()=>fileRef.current.click()} className="flex-1 py-2 bg-gray-100 text-gray-700 rounded-xl font-bold text-xs" style={{minHeight:'40px'}}>📥 JSON 파일에서 불러오기</button>
          <input ref={fileRef} type="file" accept=".json" onChange={importJSON} style={{display:'none'}}/>
        </div>
      </div>}
    </div>

    {quotaWarn&&<div className="text-[11px] text-red-600 bg-red-50 rounded-2xl px-3 py-2 font-bold">⚠️ 임시저장 용량이 가득 찼습니다. 오래된 학습지를 삭제하거나, 클라우드/JSON으로 저장한 뒤 작업대에서 지워 주세요.</div>}

    {/* ── 작업대 : 만든 학습지들 ── */}
    {sheets.length>0&&<div className="flex flex-wrap items-center gap-2">
      <span className="text-sm font-black text-gray-700">🗂 작업대 · 학습지 {sheets.length}장</span>
      <button onClick={()=>collapseAll(true)} className="text-[11px] px-3 py-2 bg-gray-100 text-gray-700 rounded-xl font-bold" style={{minHeight:'36px'}}>모두 접기</button>
      <button onClick={()=>collapseAll(false)} className="text-[11px] px-3 py-2 bg-gray-100 text-gray-700 rounded-xl font-bold" style={{minHeight:'36px'}}>모두 펼치기</button>
      <button onClick={clearAll} className="text-[11px] px-3 py-2 bg-red-50 text-red-500 rounded-xl font-bold ml-auto" style={{minHeight:'36px'}}>작업대 비우기</button>
    </div>}
    {sheets.map((s,i)=><GedSheetView key={s.id} sheet={s} seq={i+1} busy={busy} ops={ops}/>)}

    {sheets.length===0&&<div className="text-center text-sm text-gray-400 font-bold py-6">아직 만든 학습지가 없어요. 위에서 프리셋을 고르고 <b>새 학습지 추가</b>를 눌러 보세요.</div>}

    {/* ── 클라우드에 저장된 학습지 ── */}
    {cloudList.length>0&&<div className="bg-white rounded-3xl p-4 shadow-sm border border-gray-100">
      <div className="flex items-center justify-between mb-2"><div className="text-sm font-black text-gray-800">☁ 클라우드에 저장된 학습지</div><button onClick={loadList} className="text-xs text-indigo-600 font-bold" style={{minHeight:'30px'}}>새로고침</button></div>
      <div className="space-y-2 max-h-72 overflow-auto">
        {cloudList.map(c=>{const open=sheets.some(s=>s.docId===c.id);
          return<div key={c.id} className={`flex items-center gap-2 p-2.5 rounded-2xl ${open?'bg-indigo-50 border border-indigo-200':'bg-gray-50'}`}>
            <div className="flex-1 min-w-0"><div className="text-xs font-black text-gray-800 truncate">{c.title}</div>
              <div className="text-[10px] text-gray-400 font-bold truncate">{gedFmtTime(c.createdAt)} · 실전 {c.count||0}문항 · {(c.units||[]).length}유형{open?' · 작업대에 열림':''}</div></div>
            <button onClick={()=>openCloud(c.id)} disabled={busy} className="text-[11px] px-3 py-2 bg-indigo-500 text-white rounded-lg font-bold" style={{minHeight:'36px'}}>{open?'이동':'열기'}</button>
            <button onClick={()=>deleteCloud(c.id)} className="text-[11px] px-2 py-2 bg-red-50 text-red-500 rounded-lg font-bold" style={{minHeight:'36px'}}>삭제</button>
          </div>;})}
      </div>
    </div>}
  </div>;
}

function TeacherDashboard({userData,onLogout,onUpdate}){
  const[tab,setTab]=useState('analysis');
  const TABS=[{k:'analysis',icon:'📊',lbl:'학생관리'},{k:'worksheets',icon:'📝',lbl:'학습지'},{k:'gedsheet',icon:'📐',lbl:'만능학습지'},{k:'notices',icon:'📢',lbl:'공지/숙제'}];
  return(<div className="teacher-ui flex flex-col min-h-screen max-w-2xl mx-auto bg-gray-50" style={{overflowX:'hidden',width:'100%',maxWidth:'100vw'}}>
    <header className="bg-indigo-700 text-white px-4 py-3 flex items-center gap-3 sticky top-0 z-20 shadow-md">
      <div className="text-2xl">👨‍🏫</div>
      <h1 className="text-lg font-black flex-1">선생님 모드</h1>
      <span className="text-sm font-bold opacity-80">{userData.name}</span>
      <DarkToggle/>
      <button onClick={onLogout} className="text-xs text-white/70 font-bold px-2 py-1 rounded-lg bg-white/10">로그아웃</button>
    </header>
    <div className="flex-1 overflow-auto scroll-body">
      {tab==='analysis'&&<StudentAnalysisTab/>}
      {tab==='worksheets'&&<WorksheetTab/>}
      {tab==='gedsheet'&&<GedWorksheetTab/>}
      {tab==='notices'&&<NoticeTab/>}
    </div>
    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg z-20 max-w-2xl mx-auto">
      <div className="flex">{TABS.map(t=><button key={t.k} onClick={()=>setTab(t.k)} className={`flex-1 flex flex-col items-center py-3 gap-1 ${tab===t.k?'text-indigo-600':'text-gray-400'}`}>
        <span className="text-2xl">{t.icon}</span><span className="text-xs font-bold">{t.lbl}</span>
      </button>)}</div>
    </nav>
  </div>);
}

// === js/app.js ===
/* --------------------------------------------------------------------
   앱 진입점
   로그인 상태에 따라 학생/선생님 대시보드를 띄운다
   -------------------------------------------------------------------- */

/* ===== APP ===== */
function App(){
  const[user,setUser]=useState(null);const[checking,setChecking]=useState(true);
  const[showSplash,setShowSplash]=useState(false);

  useEffect(()=>{
    const saved=localStorage.getItem('yakHakUser2');
    if(saved){const{name}=JSON.parse(saved);loadUser(name).then(data=>{if(data){const d={...data};const curMon=getKSTMonday();if(d.lastDate!==todayStr()){d.todayLessons=0;d.todayCorrect=0;d.todayWrong=0;d.lastDate=todayStr()}if(!d.currentWeekStart)d.currentWeekStart=curMon;else if(d.currentWeekStart!==curMon){if(!d.stampArchive)d.stampArchive=[];const oldDates=(d.activeDates||[]).filter(x=>x>=d.currentWeekStart&&x<curMon);if(oldDates.length>0)d.stampArchive.unshift({weekStart:d.currentWeekStart,activeDates:oldDates});d.currentWeekStart=curMon}d.lastLoginAt=`${todayStr()} ${timeStr()}`;saveUser(d);setUser(d);
      // 자동 로그인: 이번 탭 세션에 아직 스플래시를 안 봤을 때만 노출
      if(!sessionStorage.getItem('yakHakSplashDone'))setShowSplash(true);
    }setChecking(false)})}else setChecking(false);
  },[]);

  // 명시적 로그인: 마찬가지로 세션 플래그 확인
  const login=data=>{localStorage.setItem('yakHakUser2',JSON.stringify({name:data.name}));setUser(data);if(!sessionStorage.getItem('yakHakSplashDone'))setShowSplash(true);};
  // 로그아웃 시 플래그 초기화 → 다음 접속 때 스플래시 다시 보임
  const logout=()=>{localStorage.removeItem('yakHakUser2');setUser(null);setShowSplash(false);sessionStorage.removeItem('yakHakSplashDone');};
  const update=newData=>{setUser(newData)};
  // 스플래시 닫힐 때 이번 세션에 본 것으로 기록 (새로고침·탭 이동 때 재노출 방지)
  const handleSplashDone=()=>{sessionStorage.setItem('yakHakSplashDone','1');setShowSplash(false);};

  if(checking)return<div className="min-h-screen flex items-center justify-center text-2xl font-black text-indigo-600">🎓 불러오는 중...</div>;
  if(!user)return<AuthScreen onLogin={login}/>;
  const main = user.role==='admin'
    ? <TeacherDashboard userData={user} onLogout={logout} onUpdate={update}/>
    : <StudentDashboard userData={user} onLogout={logout} onUpdate={update}/>;
  return(<>{main}{showSplash&&<QuoteSplash onDone={handleSplashDone}/>}</>);
}

var root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);



</script>
