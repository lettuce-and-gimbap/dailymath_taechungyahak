  {icon:'🪞',title:'대칭이동',color:'amber',simple:'거울에 비친 것처럼 기준선 반대편으로 점을 옮기는 것이에요.',detail:['x축 대칭: y에 −1 → (a,b)→(a,−b)','y축 대칭: x에 −1 → (a,b)→(−a,b)','원점 대칭: 둘다 −1 → (a,b)→(−a,−b)','y=x 대칭: x,y 교환 → (a,b)→(b,a)','y=−x 대칭: 교환+둘다−1 → (a,b)→(−b,−a)'],formula:'y=x 대칭: (a,b) → (b,a)',tip:'y=x 대칭: 검정고시 빈출! x와 y를 바꾸면 됨',mem:'💡 y=x 기준 → x,y 위치 교환!'},
];

var CMAP={blue:{bg:'bg-blue-50',bd:'border-blue-200',hd:'text-blue-700',badge:'bg-blue-100 text-blue-800'},purple:{bg:'bg-purple-50',bd:'border-purple-200',hd:'text-purple-700',badge:'bg-purple-100 text-purple-800'},green:{bg:'bg-emerald-50',bd:'border-emerald-200',hd:'text-emerald-700',badge:'bg-emerald-100 text-emerald-800'},orange:{bg:'bg-orange-50',bd:'border-orange-200',hd:'text-orange-700',badge:'bg-orange-100 text-orange-800'},teal:{bg:'bg-teal-50',bd:'border-teal-200',hd:'text-teal-700',badge:'bg-teal-100 text-teal-800'},amber:{bg:'bg-amber-50',bd:'border-amber-200',hd:'text-amber-700',badge:'bg-amber-100 text-amber-800'}};

var GEO_TABS=[{k:'rad',lbl:'🌿 무리함수',C:RadicalModule},{k:'rat',lbl:'🔀 유리함수',C:RationalModule},{k:'qua',lbl:'🏹 이차함수',C:QuadraticModule},{k:'dis',lbl:'📏 점↔직선',C:DistanceModule},{k:'cir',lbl:'⭕ 원',C:CircleModule},{k:'sym',lbl:'🪞 대칭이동',C:SymmetryModule}];

          <button key={t.k} onClick={()=>setSubTab(t.k)} className={`px-4 py-3 text-sm font-bold border-b-2 whitespace-nowrap transition-all ${subTab===t.k?'border-blue-500 text-blue-600':'border-transparent text-gray-500'}`}>{t.lbl}</button>

function GeometryLearn({sz, userData, onUpdate}){
  const[tab,setTab]=useState('rad');
  const[zoom,setZoom]=useState(1);
  const[panX,setPanX]=useState(0);
  const[panY,setPanY]=useState(0);
  const[fs,setFs]=useState(false); // fullscreen
  const contentRef=useRef(null);
  const[measuredW,setMeasuredW]=useState(0);

  /* ── 탐색 활동 계측 (체류 시간이 아닌 '상호작용 기반' 측정) ──
     · 체류 시간은 유휴/배경 노출을 포함해 학습 신호로 부적절하므로 사용하지 않음
     · 대신 ①실질 조작 시간(유휴 보정) ②상호작용 횟수 ③탐색한 개념 폭을 누적
     · 성취도가 아닌 '자기주도 탐색·호기심' 지표로 분리 수집 */
  const EXPLORE_IDLE_CAP_MS=60000;  // 상호작용 간격이 60초 미만일 때만 실질 활동으로 인정
  const xpRef=useRef({count:0,activeMs:0,lastTs:0,concepts:{}});
  const tabRef=useRef('rad');
  useEffect(()=>{tabRef.current=tab;},[tab]);
  const bumpInteract=useCallback(()=>{
    const x=xpRef.current; const now=Date.now();
    if(x.lastTs){const gap=now-x.lastTs; if(gap>0&&gap<EXPLORE_IDLE_CAP_MS)x.activeMs+=gap;}
    x.lastTs=now; x.count++;
    x.concepts[tabRef.current]=(x.concepts[tabRef.current]||0)+1;
  },[]);
  // 첫 진입 개념도 한 번 기록
  useEffect(()=>{xpRef.current.concepts['rad']=(xpRef.current.concepts['rad']||0);},[]);
  // 그래프 영역의 모든 직접 조작(점 드래그·슬라이더 등)을 버블링으로 포착
  useEffect(()=>{
    const el=contentRef.current; if(!el)return;
    const h=()=>bumpInteract();
    el.addEventListener('pointerdown',h,{passive:true});
    el.addEventListener('touchstart',h,{passive:true});
    return()=>{el.removeEventListener('pointerdown',h);el.removeEventListener('touchstart',h);};
  },[bumpInteract,fs]);
  // 탐험 종료 시(언마운트) 누적치를 사용자 데이터에 병합 저장
  useEffect(()=>()=>{
    const x=xpRef.current;
    if(!userData||userData.role==='admin')return;
    // 사소한 방문(상호작용 3회 미만 또는 실질 활동 8초 미만)은 기록하지 않음 → 노이즈 차단
    if(x.count<3||x.activeMs<8000)return;
    const prev=userData.geoExplore||{sessions:0,totalActiveSec:0,totalInteractions:0,concepts:{}};
    const mergedConcepts={...(prev.concepts||{})};
    Object.keys(x.concepts).forEach(k=>{mergedConcepts[k]=(mergedConcepts[k]||0)+x.concepts[k];});
    const geoExplore={
      sessions:(prev.sessions||0)+1,
      totalActiveSec:(prev.totalActiveSec||0)+Math.round(x.activeMs/1000),
      totalInteractions:(prev.totalInteractions||0)+x.count,
      concepts:mergedConcepts,
      updatedAt:Date.now()
    };
    const upd={...userData,geoExplore};
    try{
      db.collection('users').doc(upd.name).set({geoExplore},{merge:true});
      if(onUpdate)onUpdate(upd);
    }catch(e){/* 저장 실패는 조용히 무시 (탐색 보조 지표) */}
  },[userData,onUpdate]);

  useEffect(()=>{
    if(!contentRef.current)return;
    const ro=new ResizeObserver(e=>setMeasuredW(e[0].contentRect.width));
    ro.observe(contentRef.current);
    return()=>ro.disconnect();
  },[]);

  const Active=GEO_TABS.find(t=>t.k===tab)?.C;
  const baseSC=measuredW>0?Math.floor(Math.min(measuredW,sz.W)/13):sz.SC;
  const baseSz={SC:baseSC,W:baseSC*13,H:baseSC*13};
  const onPan=useCallback((px,py)=>{setPanX(px);setPanY(py)},[]);
  const onZoom=useCallback((nz,npx,npy)=>{setZoom(Math.max(0.5,Math.min(3,nz)));if(npx!==undefined)setPanX(Math.max(-12,Math.min(12,npx)));if(npy!==undefined)setPanY(Math.max(-12,Math.min(12,npy)))},[]);
  const zoomedSz=useMemo(()=>({W:baseSz.W,H:baseSz.H,SC:Math.round(baseSz.SC*zoom),panX,panY,zoom,onPan,onZoom}),[baseSz,zoom,panX,panY,onPan,onZoom]);

  const szLive=useRef({});
  szLive.current={SC:Math.round(baseSC*zoom),W:baseSz.W,H:baseSz.H,zoom,panX,panY};
  useEffect(()=>{
    const el=contentRef.current;if(!el)return;
    const onWheel=e=>{
      const svgEl=e.target.closest('svg');if(!svgEl)return;
      e.preventDefault();
      const{SC,W,H,zoom,panX,panY}=szLive.current;
      const r=svgEl.getBoundingClientRect();
      const mx=e.clientX-r.left,my=e.clientY-r.top;
      const midMX=(mx-W/2)/SC+panX,midMY=(H/2-my)/SC+panY;
      const factor=e.deltaY>0?1/1.12:1.12;
      const nz=Math.max(0.5,Math.min(3,zoom*factor));
      const sc=nz/zoom;
      onZoom(nz,Math.max(-12,Math.min(12,midMX+(panX-midMX)/sc)),Math.max(-12,Math.min(12,midMY+(panY-midMY)/sc)));
    };
    el.addEventListener('wheel',onWheel,{passive:false});
    return()=>el.removeEventListener('wheel',onWheel);
  },[onZoom]);

  const handleTab=k=>{setTab(k);setPanX(0);setPanY(0);bumpInteract();};
  const resetAll=()=>{setZoom(1);setPanX(0);setPanY(0);};
  const hasPan=panX!==0||panY!==0;
  const tabLabel=GEO_TABS.find(t=>t.k===tab)?.lbl||'';

  // ── 전체화면 모드 ──
  if(fs)return(
    <div style={{position:'fixed',inset:0,zIndex:9999,background:'#fff',display:'flex',flexDirection:'column'}}>
      {/* 최소 상단 바 */}
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'#1e293b',flexShrink:0}}>
        <button onClick={()=>setFs(false)} style={{background:'#3b82f6',color:'#fff',border:'none',borderRadius:10,padding:'8px 16px',fontWeight:900,fontSize:15,cursor:'pointer',display:'flex',alignItems:'center',gap:6}}>
          ← 뒤로
        </button>
        <span style={{color:'#e2e8f0',fontWeight:700,fontSize:14,flex:1}}>{tabLabel}</span>
        <span style={{color:'#94a3b8',fontSize:12}}>{zoom.toFixed(1)}×</span>
        <input type="range" min={0.5} max={3} step={0.05} value={zoom} onChange={e=>setZoom(Number(e.target.value))}
          style={{width:80,accentColor:'#3b82f6'}}/>
        <button onClick={resetAll} style={{background:'#374151',color:'#9ca3af',border:'none',borderRadius:8,padding:'4px 10px',fontWeight:700,fontSize:12,cursor:'pointer'}}>초기화</button>
      </div>
      <div ref={contentRef} style={{flex:1,overflow:'hidden',padding:8,display:'flex',alignItems:'center',justifyContent:'center',paddingBottom:'env(safe-area-inset-bottom,12px)'}}>
        {Active&&<Active sz={zoomedSz}/>}
      </div>
    </div>
  );

  return(<div className="flex flex-col flex-1 overflow-auto">
    <div className="tab-scroll bg-gray-50 border-b flex-shrink-0">
      <div className="flex px-1 min-w-max">{GEO_TABS.map(t=><button key={t.k} onClick={()=>handleTab(t.k)} className={`px-3 py-2.5 text-xs font-bold border-b-2 whitespace-nowrap ${tab===t.k?'border-blue-500 text-blue-600':'border-transparent text-gray-500'}`}>{t.lbl}</button>)}</div>
    </div>
    {/* ── 배율 조정 바: tab-scroll과 동일한 독립 가로 스크롤 컨테이너 ── */}
    <div className="tab-scroll bg-white border-b flex-shrink-0" style={{overflowX:'auto',overflowY:'hidden'}}>
      <div style={{display:'flex',alignItems:'center',gap:0,padding:'0',minWidth:'max-content',height:44}}>
        {/* 현재 배율 표시 */}
        <span style={{padding:'0 10px',fontWeight:900,fontSize:13,color:'#6366f1',flexShrink:0,letterSpacing:'-0.3px'}}>{zoom.toFixed(1)}×</span>
        {/* 배율 스텝 버튼들 */}
        {[0.5,0.7,1.0,1.3,1.6,2.0,2.5,3.0].map(v=>(
          <button key={v} onClick={()=>setZoom(v)}
            style={{flexShrink:0,padding:'6px 12px',fontSize:12,fontWeight:700,borderBottom:`2px solid ${Math.abs(zoom-v)<0.03?'#6366f1':'transparent'}`,color:Math.abs(zoom-v)<0.03?'#6366f1':'#94a3b8',background:'none',whiteSpace:'nowrap',height:'100%',transition:'all 0.15s'}}>
            {v}×
          </button>
        ))}
        {/* 구분선 */}
        <span style={{width:1,height:22,background:'#e2e8f0',flexShrink:0,margin:'0 4px'}}/>
        {/* 미세 조절 슬라이더 */}
        <span style={{fontSize:11,color:'#cbd5e1',flexShrink:0,paddingLeft:4}}>세밀</span>
        <input type="range" min={0.5} max={3} step={0.05} value={zoom}
          onChange={e=>setZoom(Number(e.target.value))}
          style={{width:90,flexShrink:0,accentColor:'#6366f1',margin:'0 6px'}}/>
        {/* 구분선 */}
        <span style={{width:1,height:22,background:'#e2e8f0',flexShrink:0,margin:'0 4px'}}/>
        <button onClick={resetAll} style={{flexShrink:0,padding:'4px 10px',fontSize:11,fontWeight:700,color:'#94a3b8',background:'none',whiteSpace:'nowrap'}}>초기화</button>
        <button onClick={()=>setFs(true)} style={{flexShrink:0,margin:'0 8px 0 2px',padding:'5px 12px',fontSize:11,fontWeight:700,background:'#3b82f6',color:'#fff',borderRadius:8,whiteSpace:'nowrap'}}>🔍 확대</button>
      </div>
    </div>
    {hasPan&&<div className="flex items-center justify-between px-4 py-1.5 bg-indigo-50 border-b border-indigo-100 flex-shrink-0">
      <span className="text-xs text-indigo-600 font-bold">📍 이동 중 ({panX>0?'+':''}{panX.toFixed(1)}, {panY>0?'+':''}{panY.toFixed(1)})</span>
      <button onClick={()=>{setPanX(0);setPanY(0);}} className="text-xs px-2 py-1 rounded-lg bg-indigo-100 text-indigo-700 font-bold">원점으로</button>
    </div>}
    <div className="px-4 pt-1 pb-0 flex-shrink-0">
      <p className="text-xs text-gray-400">💡 배경을 길게 누르면 이동 · 🔍 확대 버튼으로 전체화면</p>
    </div>
    <div ref={contentRef} className="p-4 flex-1 overflow-auto" style={{paddingBottom:'calc(6rem + env(safe-area-inset-bottom,0px))'}}>{Active&&<Active sz={zoomedSz}/>}</div>
  </div>);
}

  return(<div className="p-4 space-y-3 pb-36">
    <div className="text-sm text-gray-500 bg-white rounded-2xl p-4 border border-gray-200 shadow-sm font-semibold">어려운 수학 용어를 쉬운 말로! 각 항목을 눌러 자세히 봐요 👇</div>

          <div className={`rounded-2xl p-3 text-center font-bold text-base ${cl.badge}`}>공식: {c.formula}</div>

function GeometryQuiz({userData, onUpdate}){
  const GEO_SET=[{icon:'🌿',lbl:'무리함수',gen:genRadicalQ},{icon:'🔀',lbl:'유리함수',gen:genRationalQ},{icon:'🏹',lbl:'이차함수',gen:genQuadraticQ},{icon:'📏',lbl:'점↔직선',gen:genDistanceQ},{icon:'⭕',lbl:'원',gen:genCircleQ},{icon:'🪞',lbl:'대칭이동',gen:genSymmetryQ}];
  const[concept,setConcept]=useState(null);const[problems,setProbs]=useState([]);const[sel,setSel]=useState({});
  const[isGraded, setIsGraded]=useState(false);
  const wsRef=useRef();
  const[startTime, setStartTime] = useState(Date.now());
  const[saved, setSaved] = useState(false);
  // ── 행동 추적 (신규) ──
  const[firstClickTimes,setFirstClickTimes]=useState({});
  const[revisionCounts,setRevisionCounts]=useState({});

  const gen=(cs)=>{
    setProbs(Array.from({length:5},()=>cs.gen()));
    setSel({});setIsGraded(false);setConcept(cs);setStartTime(Date.now());setSaved(false);
    setFirstClickTimes({});setRevisionCounts({});
  };
  const ORD=['①','②','③','④'];
  
  if(!concept)return(<div className="p-4 pb-36">
    <div className="bg-blue-50 border border-blue-200 rounded-2xl p-4 mb-4 text-sm text-blue-700 font-semibold">📌 공부하고 싶은 개념을 선택하면 랜덤 문제 5개가 생성됩니다!</div>
    <div className="grid grid-cols-2 gap-3">
      {GEO_SET.map(cs=><button key={cs.lbl} onClick={()=>gen(cs)} className="bg-gradient-to-br from-blue-500 to-indigo-600 text-white rounded-2xl p-5 text-left shadow-lg active:scale-95 transition-transform">
        <div className="text-3xl mb-2">{cs.icon}</div><div className="font-bold text-base">{cs.lbl}</div>
        <div className="mt-2 text-xs bg-white/20 rounded-lg px-2 py-1 inline-block">문제 시작 →</div>
      </button>)}
    </div></div>);
    
  const correct=problems.filter((_,i)=>sel[i]===problems[i]?.answer).length;
  const answered=Object.keys(sel).length;

  const saveQuizLog = async (feeling) => {
    if(saved || !userData) return;
    const totalSec = Math.round((Date.now() - startTime) / 1000);
    const qs = problems.map((p, i) => {
      const fms = firstClickTimes[i] ?? null;
      return{
        qTxt: p.q,
        uAns: sel[i] !== undefined ? p.choices[sel[i]] : '미입력',
        cAns: p.choices[p.answer],
        isOk: sel[i] === p.answer,
        timeSec: fms!=null ? Math.round(fms/1000) : null,
        firstClickMs: fms,
        revisionCount: revisionCounts[i] ?? 0,
        qTopicHash: getTopicHash(p),
        explanation: easyExplanation(p),
        graph: p.graph || null,
        meta: { category: 'geometry', type: concept.lbl, diff: '기하' }
      };
    });
    const log = {
      date: todayStr(), time: timeStr(), type: `기하: ${concept.lbl}`,
      score: `${correct} / 5`, questions: qs, totalSec, feeling
    };
    const upd = {...userData, logs: [log, ...(userData.logs||[])]};
    try {
      await db.collection('users').doc(upd.name).set(upd, {merge:true});
      if(onUpdate) onUpdate(upd);
      setSaved(true);
      updateQStats(qs); // fire-and-forget
    } catch(e) { alert('저장 실패. 인터넷 연결을 확인해주세요.'); }

function calcStreak(activeDates){
  if(!activeDates?.length)return{total:0,streak:0};
  const u=[...new Set(activeDates)].sort((a,b)=>b.localeCompare(a));const total=u.length;
  let streak=0;const cur=new Date();cur.setHours(0,0,0,0);
  const last=new Date(u[0]);last.setHours(0,0,0,0);
  const diff=(cur-last)/(1000*60*60*24);if(diff>1)return{total,streak:0};
  streak=1;for(let i=1;i<u.length;i++){const d1=new Date(u[i-1]),d2=new Date(u[i]);if((d1-d2)/(1000*60*60*24)===1)streak++;else break}
  return{total,streak};
}

function StudentSentFeedback({name,refreshSignal}){

    setLoading(true);
    try{
      const snap=await db.collection('studentFeedback').where('studentName','==',name).get();
      const arr=[];snap.forEach(d=>arr.push({id:d.id,...d.data()}));
      arr.sort((a,b)=>{
        const ta=a.sentAt?.toDate?a.sentAt.toDate().getTime():new Date(a.sentAt).getTime();
        const tb=b.sentAt?.toDate?b.sentAt.toDate().getTime():new Date(b.sentAt).getTime();
        return tb-ta;
      });
      setItems(arr.slice(0,10));
    }catch(e){}
    setLoading(false);
  };
  React.useEffect(()=>{load();},[name,refreshSignal]);

              <div className="flex gap-2">

function DailyPracticeTab({userData,onUpdate,onSessionActive}){
  const[screen,setScreen]=useState('menu');
  const[session,setSession]=useState(null);
  const[ver,setVer]=useState(userData.ver||0);
  const[verTopic,setVerTopic]=useState(null);
  const[rangeMin,setRangeMin]=useState(userData.rangeMin||10);
  const[rangeMax,setRangeMax]=useState(userData.rangeMax||99);
  const[divMin,setDivMin]=useState(userData.divRangeMin||10);
  const[divMax,setDivMax]=useState(userData.divRangeMax||99);
  const[goal,setGoal]=useState(userData.goal||3);

  const savedRaw=(()=>{try{return JSON.parse(localStorage.getItem('yakHakSavedSession_'+userData.name));}catch{return null;}})();
  const[savedData,setSavedData]=useState(savedRaw);

  const saveSettings=()=>{
  const upd={...userData,ver,
    rangeMin: rangeMin===''?1:Math.max(1,Number(rangeMin)),
    rangeMax: rangeMax===''?2:Math.max(2,Number(rangeMax)),
    divRangeMin: divMin===''?1:Math.max(1,Number(divMin)),
    divRangeMax: divMax===''?2:Math.max(2,Number(divMax)),
    goal};
  saveUser(upd);onUpdate(upd);
};
  const startSession=()=>{
  const effRMin = rangeMin===''||Number(rangeMin)<1 ? 1 : Math.floor(Number(rangeMin));
  const effRMax = rangeMax===''||Number(rangeMax)<=effRMin ? effRMin+1 : Math.floor(Number(rangeMax));
  const effDMin = divMin===''||Number(divMin)<1 ? 1 : Math.floor(Number(divMin));
  const effDMax = divMax===''||Number(divMax)<=effDMin ? effDMin+1 : Math.floor(Number(divMax));
  setRangeMin(effRMin); setRangeMax(effRMax);
  setDivMin(effDMin);   setDivMax(effDMax);
  const divCountIdxs=[];while(divCountIdxs.length<2){const r=randInt(1,10);if(!divCountIdxs.includes(r))divCountIdxs.push(r)}
  setSession({qNum:1,correct:0,wrong:0,startTime:Date.now(),qStartTime:Date.now(),questions:[],divCountIdxs,currentQ:null,selectedMC:null,fb:null,phase:'question',verTopic:verTopic||null});
  setScreen('session');
  onSessionActive?.(true);
};

  const resumeSession=()=>{
  if(!savedData)return;
  setVer(savedData.ver);
  setRangeMin(savedData.rangeMin); setRangeMax(savedData.rangeMax);
  setDivMin(savedData.divMin);     setDivMax(savedData.divMax);
  setSession({qNum:savedData.qNum||1,correct:savedData.correctCount||0,wrong:savedData.wrongCount||0,startTime:Date.now(),qStartTime:Date.now(),questions:[],divCountIdxs:savedData.divCountIdxs||[3,7],currentQ:null,selectedMC:null,fb:null,phase:'question',verTopic:null});
  setScreen('session');
  onSessionActive?.(true);
};

  const handleBack=()=>{
    setScreen('menu');
    onSessionActive?.(false);
    setSavedData(()=>{try{return JSON.parse(localStorage.getItem('yakHakSavedSession_'+userData.name));}catch{return null;}});
  };

  if(screen==='menu')return<PracticeMenu ver={ver} setVer={v=>{setVer(v);setVerTopic(null);}} verTopic={verTopic} setVerTopic={setVerTopic} rangeMin={rangeMin} setRangeMin={setRangeMin} rangeMax={rangeMax} setRangeMax={setRangeMax} divMin={divMin} setDivMin={setDivMin} divMax={divMax} setDivMax={setDivMax} goal={goal} setGoal={setGoal} todayLessons={userData.todayLessons} onSave={saveSettings} onStart={startSession} savedData={savedData} onResume={resumeSession}/>;
  if(screen==='session')return<PracticeSession session={session} setSession={setSession} ver={ver} rangeMin={rangeMin} rangeMax={rangeMax} divMin={divMin} divMax={divMax} userData={userData} onUpdate={onUpdate} onDone={(result)=>{setScreen('done');onSessionActive?.(false);}} onBack={handleBack}/>;
  if(screen==='done')return<PracticeDone userData={userData} onAgain={startSession} onHome={()=>{setScreen('menu');onSessionActive?.(false);}}/>;
  return null;
}

function makeQ(ver,qNum,divCountIdxs,rangeMin,rangeMax,divMin,divMax,seenSet=null,domain=null){
  let qType=ver;if(qType===2)qType=Math.random()<0.5?0:1;
  const isMC=Math.random()<0.25;
  if(qType===3||qType===4){
    const{target,divisors}=genDivisors(divMin,divMax,qType===4);
    const divQType=pick(['notDiv','allDiv','count']);
    return{category:'div',target,divisors,divQType,isMC:true,
      qLogTxt:divQType==='count'?`${target}의 약수 개수`:divQType==='notDiv'?`${target}의 약수 아닌 것 고르기`:`${target}의 모든 약수`};
  }
  // ── ver:5 중졸 / ver:6 고졸 검정고시 영역 연습 ──
  if(qType===5||qType===6){
    const midLabels=Object.keys(MID_DOMAIN_GENS);
    const highLabels=['다항식 계산','방정식과 부등식','도형과 기하','집합과 함수','확률과 통계'];
    const highGens=[genMockPoly,genMockEqInequal,genMockGeometry,genMockSetFunc,genMockProbStat];
    let areaLabel,gen;
    if(domain){
      // 영역 선택 모드
      areaLabel=domain;
      if(qType===5){
        gen=()=>genMiddleMock(domain);
      } else {
        const dIdx=highLabels.indexOf(domain);
        gen=dIdx>=0?highGens[dIdx]:highGens[Math.floor(Math.random()*highGens.length)];
      }
    } else {
      const areaLabels=qType===5?midLabels:highLabels;
      const areaIdx=(qNum-1)%areaLabels.length;
      areaLabel=areaLabels[areaIdx];
      gen=qType===5?()=>genMiddleMock(areaLabel):highGens[areaIdx];
    }
    let q=null;let tries=0;
    // seenSet이 있으면 문제 텍스트 중복 방지
    while(tries<12){
      try{q=gen();}catch(e){q=null;}
      if(!q){tries++;continue;}
      const key=q.q?.slice(0,30)||q.topic||'';
      if(!seenSet||!seenSet.has(key)){if(seenSet)seenSet.add(key);break;}
      tries++;q=null;
    }
    if(!q){try{q=qType===5?genMiddleMock():genMockProbStat();}catch(e){}}
    if(!q)q={topic:'확률',q:'3명 중 2명을 순서대로 뽑는 경우의 수는?',choices:['3','6','9','12'],answer:1,meta:{category:'stat',type:'확률과 통계',diff:'기초'}};
    return{...q,category:'exam5',isMC:true,
      qLogTxt:q.q||q.topic||areaLabel};
  }
  if(qType===0){const q=genDivBasic(rangeMin,rangeMax);return{...q,category:'math',isMC}}
  return{...genDivRemainder(rangeMin,rangeMax),category:'math',isMC};
}

/* ===== 풀이과정 박스 ===== */
function SolutionBox({q}){
  if(!q)return null;
  const Row=({step,children})=>(
    <div className="flex items-start gap-2 text-sm font-bold text-gray-700">
      <span className="shrink-0 bg-amber-100 text-amber-700 rounded-lg px-2 py-0.5 text-xs font-black">{step}</span>
      <span className="leading-relaxed">{children}</span>
    </div>
  );
  // 생성기가 직접 만든 단계별 해설(q.sol)이 있으면 우선 사용 — 정답과 동일한 계산값에서 나오므로 항상 일치
  if(Array.isArray(q.sol)&&q.sol.length){
    return(
      <div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 fade-in">
        <div className="text-xs font-black text-amber-600 mb-3 tracking-wide">📖 풀이 과정 (천천히 따라오세요)</div>
        <div className="space-y-2">
          {q.sol.map((s,i)=><Row key={i} step={i+1===q.sol.length?'정답':`${i+1}단계`}><span dangerouslySetInnerHTML={{__html:autoMathHtml(s)}}/></Row>)}
        </div>
      </div>
    );
  }
  if(q.category==='math'){
    if(q.hasR){
      const prod=q.b*q.ansC;
      return(
        <div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 fade-in">
          <div className="text-xs font-black text-amber-600 mb-3 tracking-wide">📖 풀이 과정</div>
          <div className="space-y-2">
            <Row step="1단계">{q.b} × {q.ansC} = {prod}</Row>
            <Row step="2단계">{q.a} - {prod} = {q.ansR} → 나머지</Row>
            <Row step="정답"><span className="text-green-700">{q.a} ÷ {q.b} = {q.ansC} ··· {q.ansR}</span></Row>
          </div>
        </div>
      );
    }else{
      const prod=q.b*q.ansC;
      return(
        <div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 fade-in">
          <div className="text-xs font-black text-amber-600 mb-3 tracking-wide">📖 풀이 과정</div>
          <div className="space-y-2">
            <Row step="계산">{q.a} ÷ {q.b} = {q.ansC}</Row>
            <Row step="검산">{q.b} × {q.ansC} = {prod}</Row>
          </div>
        </div>
      );
    }
  }
  if(q.category==='div'){
    const divs=q.divisors||[];
    const tgt=q.target;
    /* 짝 목록 계산 (공통 로직) */
    const pairRows=[];
    const half=Math.ceil(divs.length/2);
    for(let i=0;i<half;i++){
      const a=divs[i],b=divs[divs.length-1-i];
      const isSelf=(a===b);
      pairRows.push({a,b,isSelf});
    }
    if(q.divQType==='count'){
      return(
        <div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 fade-in">
          <div className="text-xs font-black text-amber-600 mb-3 tracking-wide">📖 풀이 과정</div>
          <div className="space-y-1">
            <div className="text-xs text-gray-500 font-bold mb-1">곱해서 {tgt}이(가) 되는 짝을 찾아요</div>
            {pairRows.map(({a,b,isSelf},i)=>(
              <div key={i} className="text-sm font-bold text-indigo-600">
                {isSelf?`${a} × ${a} = ${tgt}  (${a}는 자기 자신과 짝)`:`${a} × ${b} = ${tgt}`}
              </div>
            ))}
            <div className="mt-2 text-xs text-gray-500 font-bold">약수 목록: {divs.join(', ')}</div>
            <div className="mt-1 text-sm font-bold text-green-700">약수의 개수 = <span className="text-green-800">{divs.length}개</span></div>
          </div>
        </div>
      );
    }else if(q.divQType==='notDiv'){
      return(
        <div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 fade-in">
          <div className="text-xs font-black text-amber-600 mb-3 tracking-wide">📖 풀이 과정</div>
          <div className="space-y-1">
            <div className="text-xs text-gray-500 font-bold mb-1">곱해서 {tgt}이(가) 되는 짝을 찾아요</div>
            {pairRows.map(({a,b,isSelf},i)=>(
              <div key={i} className="text-sm font-bold text-indigo-600">
                {isSelf?`${a} × ${a} = ${tgt}  (${a}는 자기 자신과 짝)`:`${a} × ${b} = ${tgt}`}
              </div>
            ))}
            <div className="mt-2 text-xs text-gray-500 font-bold">약수 목록: {divs.join(', ')}</div>
            <div className="mt-1 text-sm font-bold text-red-600">위 목록에 없는 수 → 약수가 아닌 것</div>
          </div>
        </div>
      );
    }else{
      return(
        <div className="bg-amber-50 border-2 border-amber-200 rounded-2xl p-4 fade-in">
          <div className="text-xs font-black text-amber-600 mb-3 tracking-wide">📖 풀이 과정</div>
          <div className="space-y-1">
            <div className="text-xs text-gray-500 font-bold mb-1">곱해서 {tgt}이(가) 되는 짝을 찾아요</div>
            {pairRows.map(({a,b,isSelf},i)=>(
              <div key={i} className="text-sm font-bold text-indigo-600">
                {isSelf?`${a} × ${a} = ${tgt}  (${a}는 자기 자신과 짝)`:`${a} × ${b} = ${tgt}`}
              </div>
            ))}
            <div className="mt-2 text-sm font-bold text-green-700">약수: {divs.join(', ')}</div>
          </div>
        </div>
      );
    }
  }
  return <ExplanationBox q={q}/>;
}

/* ===== 커스텀 숫자 키패드 ===== */
function NumPadInput({q,ans,setAns,activeField,setActiveField,onConfirmRequest,handleFirstAction}){
  const press=k=>{
    handleFirstAction();
    setAns(v=>{
      const fk=q.hasR?(activeField==='R'?'ansR':'ansQ'):'ansQ';
      const cur=v[fk]||'';
      if(k==='C')return{...v,[fk]:''};
      if(k==='←')return{...v,[fk]:cur.slice(0,-1)};
      if(cur.length>=4)return v;
      return{...v,[fk]:cur+k};
    });
  };
  const canSubmit=q.hasR?(ans.ansQ!==''&&ans.ansR!==''):(ans.ansQ!=='');
  const PAD=['7','8','9','4','5','6','1','2','3','C','0','←'];
  const padCls=k=>k==='C'?'bg-red-50 border-red-200 text-red-600 text-base':k==='←'?'bg-orange-50 border-orange-200 text-orange-600 text-xl':'bg-white border-gray-200 text-gray-800 text-xl';
  return(
    <div className="space-y-3">
      {q.hasR?(
        <div className="flex gap-3">
          <button onClick={()=>setActiveField('Q')} className={`flex-1 py-3 rounded-2xl border-2 text-center transition-all ${activeField==='Q'?'border-indigo-500 bg-indigo-50':'border-gray-200 bg-white'}`}>
            <div className="text-xs text-gray-400 font-bold mb-1">몫</div>
            <div className={`text-2xl font-black ${activeField==='Q'?'text-indigo-700':'text-gray-500'}`}>{ans.ansQ||<span className="opacity-25">_</span>}</div>
          </button>
          <button onClick={()=>setActiveField('R')} className={`flex-1 py-3 rounded-2xl border-2 text-center transition-all ${activeField==='R'?'border-indigo-500 bg-indigo-50':'border-gray-200 bg-white'}`}>
            <div className="text-xs text-gray-400 font-bold mb-1">나머지</div>
            <div className={`text-2xl font-black ${activeField==='R'?'text-indigo-700':'text-gray-500'}`}>{ans.ansR||<span className="opacity-25">_</span>}</div>
          </button>
        </div>
      ):(
        <div className="w-full py-3 rounded-2xl border-2 border-indigo-400 bg-indigo-50 text-center">
          <div className="text-3xl font-black text-indigo-700">{ans.ansQ||<span className="opacity-25">0</span>}</div>
        </div>
      )}
      <div className="grid grid-cols-3 gap-2">
        {PAD.map(k=>(
          <button key={k} onClick={()=>press(k)}
            className={`py-4 rounded-2xl border font-black shadow-sm active:scale-95 transition-all ${padCls(k)}`}>
            {k}
          </button>
        ))}
      </div>
      <button onClick={()=>{if(canSubmit)onConfirmRequest();}}
        disabled={!canSubmit}
        className={`w-full py-5 rounded-3xl text-xl font-black shadow-lg transition-all ${canSubmit?'bg-gradient-to-r from-indigo-500 to-blue-600 text-white active:scale-95':'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
        확인 ✓
      </button>
    </div>
  );
}

function PracticeSession({session,setSession,ver,rangeMin,rangeMax,divMin,divMax,userData,onUpdate,onBack}){
  const seenQKeysRef = React.useRef(new Set());
  const verTopic=session.verTopic||null;
  const[q,setQ]=useState(()=>makeQ(ver,session.qNum,session.divCountIdxs,rangeMin,rangeMax,divMin,divMax,seenQKeysRef.current,verTopic));
  const[ans,setAns]=useState({ansQ:'',ansR:'',ansDiv:'',ansCount:''});
  const[fb,setFb]=useState(null);
  const[selMC,setSelMC]=useState(null);
  const[mcOpts,setMcOpts]=useState([]);
  const[phase,setPhase]=useState('question');
  const[correctCount,setCorrectCount]=useState(session.correct||0);
  const[wrongCount,setWrongCount]=useState(session.wrong||0);
  const[questions,setQuestions]=useState([]);
  const[startTime]=useState(Date.now());
  const[qStartTime,setQStartTime]=useState(Date.now());
  const[firstActionTime,setFirstActionTime]=useState(null);
  const[showConfirm,setShowConfirm]=useState(false);
  const[showExitModal,setShowExitModal]=useState(false);
  const[activeField,setActiveField]=useState('Q');   // 숫자패드 활성 필드 ('Q'|'R')
  const phaseRef=React.useRef(phase);
  const saveDataRef=React.useRef({});

  const handleFirstAction=()=>{
    if(firstActionTime===null)setFirstActionTime(Date.now());
  };

  useEffect(()=>{phaseRef.current=phase;},[phase]);
  useEffect(()=>{
    const d={ver,rangeMin,rangeMax,divMin,divMax,qNum:questions.length+1,divCountIdxs:session.divCountIdxs,correctCount,wrongCount};
    window.__yakHakActiveSession={...d,savedAt:Date.now()};
    saveDataRef.current=d;
  },[correctCount,wrongCount,questions.length]);
  useEffect(()=>()=>{window.__yakHakActiveSession=null;},[]);

  // 홈 버튼 / 비정상 종료 시 자동 저장
  useEffect(()=>{
    const autoSave=()=>{
      if(phaseRef.current==='done'||phaseRef.current==='reflection')return;
      const d=saveDataRef.current;
      if(!d||(!d.correctCount&&!d.wrongCount))return;
      localStorage.setItem('yakHakSavedSession_'+userData.name,JSON.stringify({...d,savedAt:Date.now()}));
    };
    const onVis=()=>{if(document.hidden)autoSave();};
    document.addEventListener('visibilitychange',onVis);
    window.addEventListener('pagehide',autoSave);
    window.addEventListener('beforeunload',autoSave);
    return()=>{
      document.removeEventListener('visibilitychange',onVis);
      window.removeEventListener('pagehide',autoSave);
      window.removeEventListener('beforeunload',autoSave);
    };
  },[]);

  // 모바일 뒤로가기 버튼 가로채기
  useEffect(()=>{
    history.pushState({practiceSession:true},'');
    const onPop=()=>{
      if(phaseRef.current==='done'||phaseRef.current==='reflection'){onBack();return;}
      history.pushState({practiceSession:true},'');
      setShowExitModal(true);
    };
    window.addEventListener('popstate',onPop);
    return()=>window.removeEventListener('popstate',onPop);
  },[]);

  const saveSession=()=>{
    const data={ver,rangeMin,rangeMax,divMin,divMax,
      qNum:questions.length+1,divCountIdxs:session.divCountIdxs,
      correctCount,wrongCount,savedAt:Date.now()};
    localStorage.setItem('yakHakSavedSession_'+userData.name,JSON.stringify(data));
  };

  const handleBackAttempt=()=>{
    if(phase==='done'||phase==='reflection'){onBack();return;}
    setShowExitModal(true);
  };

  useEffect(()=>{buildMCOpts()},[q]);
  const buildMCOpts=()=>{
    if(!q.isMC){setMcOpts([]);return}
    var _twoMode=questions.length>=15;
    // exam5: 이미 choices 배열이 있는 모의고사 포맷
    if(q.category==='exam5'&&q.choices){
      var opts5=q.choices.map((c,i)=>({text:c,isC:i===q.answer}));
      if(_twoMode&&opts5.length>2){var c5=opts5.find(o=>o.isC);var w5=opts5.find(o=>!o.isC);opts5=[c5,w5].filter(Boolean);if(Math.random()<0.5)opts5=[opts5[1],opts5[0]];}
      setMcOpts(opts5);return;
    }
    let opts=[];
    if(q.category==='math'){
      const ansStr=q.hasR?`몫: ${q.ansC}, 나머지: ${q.ansR}`:`${q.ansC}`;
      opts.push({text:ansStr,isC:true});
      while(opts.length<4){const wQ=Math.max(1,q.ansC+randInt(-2,2)||1);const wR=q.hasR?Math.max(0,(q.ansR+randInt(-1,2))%q.b):0;const wStr=q.hasR?`몫: ${wQ}, 나머지: ${wR}`:`${wQ}`;if(!opts.some(o=>o.text===wStr))opts.push({text:wStr,isC:false})}
    }else{
      if(q.divQType==='count'||q.isCount){
        // 약수 개수 — ±1·±2 제외, ±3 이상 차이나는 오답만
        const correct=q.divisors.length;
        opts.push({text:`${correct}개`,isC:true});
        const usedNums=new Set([correct]);
        const pool=[];
        for(let d=3;d<=15;d++){if(correct-d>=1)pool.push(correct-d);pool.push(correct+d);}
        shuffle(pool).forEach(c=>{if(opts.length<4&&!usedNums.has(c)){usedNums.add(c);opts.push({text:`${c}개`,isC:false})}});
        let ext=16;while(opts.length<4){const c=correct+ext;if(!usedNums.has(c)){usedNums.add(c);opts.push({text:`${c}개`,isC:false})}ext++}
      }else if(q.divQType==='notDiv'){
        // 약수 아닌 것 — target+1 같은 뻔한 패턴 배제, 범위 안 비약수 선택
        const divSet=new Set(q.divisors);
        const cands=[];
        for(let n=2;n<q.target;n++){if(!divSet.has(n))cands.push(n);}
        // target/2 이하의 비약수 = 약수처럼 보여서 더 그럴듯한 오답
        const plausible=cands.filter(n=>n<=Math.floor(q.target/2)+1);
        const wrongNum=(plausible.length>0?shuffle(plausible):shuffle(cands))[0]||(q.target+2);
        const usedTexts=new Set([String(wrongNum)]);
        opts.push({text:String(wrongNum),isC:true});
        shuffle([...q.divisors]).forEach(d=>{const s=String(d);if(opts.length<4&&!usedTexts.has(s)){usedTexts.add(s);opts.push({text:s,isC:false})}});
      }else{
        // 약수 모두 — Set으로 중복 완전 차단, 뻔한 비약수(target±1) 삽입 금지
        const correctStr=q.divisors.join(', ');
        const usedFakes=new Set([correctStr]);
        opts.push({text:correctStr,isC:true});
        const divSet=new Set(q.divisors);
        // Fake 1: 중간 원소 제거
        if(q.divisors.length>=3){const f1=[...q.divisors];f1.splice(Math.floor(q.divisors.length/2),1);const s=f1.join(', ');if(!usedFakes.has(s)){usedFakes.add(s);opts.push({text:s,isC:false})}}
        // Fake 2: target/2 근처 비약수 삽입 (target±1 제외)
        let ins=Math.floor(q.target/2);
        while(divSet.has(ins)||Math.abs(ins-q.target)<=1||ins<=1)ins++;
        const f2=[...q.divisors,ins].sort((a,b)=>a-b);const s2=f2.join(', ');
        if(!usedFakes.has(s2)){usedFakes.add(s2);opts.push({text:s2,isC:false})}
        // Fake 3: 마지막 원소 제거
        if(q.divisors.length>=2){const f3=q.divisors.slice(0,-1);const s3=f3.join(', ');if(!usedFakes.has(s3)){usedFakes.add(s3);opts.push({text:s3,isC:false})}}
        // Fake 4: 다른 비약수 삽입 (ins와 다른 값)
        if(opts.length<4){let ins2=ins+1;while(divSet.has(ins2)||ins2===ins||Math.abs(ins2-q.target)<=1)ins2++;const f4=[...q.divisors,ins2].sort((a,b)=>a-b);const s4=f4.join(', ');if(!usedFakes.has(s4)){usedFakes.add(s4);opts.push({text:s4,isC:false})}}
      }
    }
    if(_twoMode&&opts.length>2){var cO=opts.find(o=>o.isC);var wO=opts.find(o=>!o.isC);opts=[cO,wO].filter(Boolean);}
    setMcOpts(shuffle(opts));
  };

  const check=()=>{
    let isOk=false;let uAns='',cAns='';
    if(q.isMC){
      if(selMC===null)return;
      isOk=mcOpts[selMC].isC;
      uAns=mcOpts[selMC].text;
      if(q.category==='exam5'){
        cAns=q.choices?.[q.answer]||'';
      } else {
        cAns=q.category==='math'?(q.hasR?`몫: ${q.ansC}, 나머지: ${q.ansR}`:`${q.ansC}`):(q.divQType==='count'||q.isCount?`${q.divisors.length}개`:q.divQType==='notDiv'?mcOpts[selMC].isC?mcOpts[selMC].text:'(약수 아닌 것)':q.divisors.join(', '));
      }
    } else if(q.category==='math'){
      if(q.hasR){const vQ=parseInt(ans.ansQ),vR=parseInt(ans.ansR);if(isNaN(vQ)||isNaN(vR))return;isOk=vQ===q.ansC&&vR===q.ansR;uAns=`몫: ${vQ}, 나머지: ${vR}`;cAns=`몫: ${q.ansC}, 나머지: ${q.ansR}`}
      else{const vQ=parseInt(ans.ansQ);if(isNaN(vQ))return;isOk=vQ===q.ansC;uAns=`${vQ}`;cAns=`${q.ansC}`}
    }else{
      if(q.isCount){const v=parseInt(ans.ansCount);if(isNaN(v))return;isOk=v===q.divisors.length;uAns=`${v}개`;cAns=`${q.divisors.length}개`}
      else{const raw=ans.ansDiv;if(!raw.trim())return;let arr=raw.split(',').map(v=>parseInt(v.trim())).filter(v=>!isNaN(v));arr=[...new Set(arr)].sort((a,b)=>a-b);isOk=arr.join(',')===q.divisors.join(',');uAns=arr.join(', ')||'(입력없음)';cAns=q.divisors.join(', ')}
    }
    const elapsed=Math.round((Date.now()-qStartTime)/1000);
    const firstActionMs=firstActionTime!=null?firstActionTime-qStartTime:null;
    
    // 🔥 학습분석용 메타데이터 저장 🔥
    // exam5: 모의고사 포맷이므로 q.meta가 이미 있음 (type: '도형과 기하' 등)
    const meta = q.category==='exam5'
      ? (q.meta || { category: 'exam5', type: q.topic||'검정고시', diff: '기초' })
      : { category: q.category, type: q.type || '연산', diff: q.diff || '기본' };
    const topicHash = getTopicHash({meta, topic: meta.type});
    const newQ={qTxt:q.qLogTxt||q.txt, uAns, cAns, isOk, timeSec:elapsed,
      firstClickMs:firstActionMs,  // DailyPractice: 진정한 망설임 시간 (one-at-a-time)
      revisionCount:null,          // 자유입력 형식 → 수정 횟수 미적용
      qTopicHash:topicHash,
      examSource:getExamSource(q)||null,
      explanation:Array.isArray(q.sol)&&q.sol.length?q.sol.join('\n'):easyExplanation(q),
      meta};
    // 검정고시(exam5)는 회차 인쇄/PDF를 위해 원문제 전체를 함께 저장 (그림·선택지·해설 포함)
    if(q.category==='exam5'){
      newQ.topic=q.topic;
      newQ.qFull=q.q;
      newQ.choices=q.choices;
      newQ.answerIdx=q.answer;
      if(q.graph)newQ.graph=q.graph;
      if(Array.isArray(q.sol))newQ.sol=q.sol;
    }
    
    const newCorrect=correctCount+(isOk?1:0);const newWrong=wrongCount+(isOk?0:1);
    setCorrectCount(newCorrect);setWrongCount(newWrong);
    setQuestions(prev=>[...prev,newQ]);
    setFb({ok:isOk,msg:isOk?'✅ 정답입니다! 잘했어요!':`❌ 아쉬워요! 정답은 ${cAns} 입니다.`});
    setPhase('feedback');
    
    // 검정고시: 총 10문제, 나눗셈/약수: 정답 10개
    const isExam=ver>=5;
    const shouldEnd=isExam?(questions.length+1>=10):(newCorrect>=10);
    if(shouldEnd){
      setTimeout(()=>setPhase('reflection'), 1200);
    }
  };

  const finishLesson=async(feeling)=>{
    const totalSec=Math.round((Date.now()-startTime)/1000);
    const today=todayStr();const newActiveDates=[...new Set([...(userData.activeDates||[]),today])];
    const typeMap=['기본 나눗셈','심화 나눗셈','혼합 나눗셈','약수 구하기','약수(하드)','중졸 검정고시 연습','고졸 검정고시 연습'];
    
    // feeling(난이도 체감) 데이터 포함 저장
    const score=ver>=5?`${correctCount} / ${questions.length}`:`10 / ${questions.length}`;
    const log={studentName:userData.name,date:today,time:timeStr(),type:typeMap[ver]||'나눗셈',score,questions:questions,totalSec, feeling};
    const upd={...userData,totalLessons:(userData.totalLessons||0)+1,todayLessons:(userData.todayLessons||0)+1,todayCorrect:(userData.todayCorrect||0)+correctCount,todayWrong:(userData.todayWrong||0)+wrongCount,lastDate:today,activeDates:newActiveDates,logs:[log,...(userData.logs||[]).slice(0,49)]};
    
    await saveUser(upd);await saveLog(log);onUpdate(upd);
    localStorage.removeItem('yakHakSavedSession_'+userData.name);
    window.__yakHakActiveSession=null;
    setPhase('done');
  };

  const nextQ=()=>{
    const isExam=ver>=5;
    if(phase==='done'||phase==='reflection'||(isExam?questions.length>=10:correctCount>=10))return;
    const nNum=questions.length+1;
    // ── 세션 내 중복 방지: 이미 출제된 문제 키 수집 ──
    const seenKeys=new Set(questions.map(pq=>{
      // ver5(exam5): q.q 텍스트 기준, 나눗셈: "a÷b", 약수: target
      return pq.meta?.type==='exam5'||pq.category==='exam5' ? pq.qTxt?.slice(0,20)||pq.topic
           : pq.category==='div' ? String(pq.target||pq.qTxt)
           : `${pq.uAns}-${pq.cAns}`;
    }));
    let nQ=null;let tries=0;
    while(tries<8){
      nQ=makeQ(ver,nNum,session.divCountIdxs,rangeMin,rangeMax,divMin,divMax,seenQKeysRef.current,verTopic);
      const newKey=nQ.category==='exam5'? (nQ.q?.slice(0,20)||nQ.topic)
                 : nQ.category==='div' ? String(nQ.target)
                 : nQ.qLogTxt||`${nQ.a}-${nQ.b}`;
      if(!seenKeys.has(newKey))break;
      tries++;
    }
    setQ(nQ);setAns({ansQ:'',ansR:'',ansDiv:'',ansCount:''});setSelMC(null);setFb(null);setPhase('question');setQStartTime(Date.now());setFirstActionTime(null);setShowConfirm(false);setActiveField('Q');
  };

  if(phase==='done')return<PracticeDone ver={ver} userData={userData} correct={correctCount} wrong={wrongCount} onAgain={()=>{setPhase('question');setCorrectCount(0);setWrongCount(0);setQuestions([]);const nQ=makeQ(ver,1,session.divCountIdxs,rangeMin,rangeMax,divMin,divMax);setQ(nQ);setAns({ansQ:'',ansR:'',ansDiv:'',ansCount:''});setSelMC(null);setFb(null);setQStartTime(Date.now());}} onHome={onBack}/>;

  // 🔥 감정 성찰 (메타인지) 화면 렌더링 🔥
  if(phase==='reflection') {
    return(
      <div className="p-4 flex flex-col items-center justify-center min-h-screen text-center pb-36 fade-in">
        <div className="text-7xl mb-6">🧠</div>
        <h2 className="text-2xl font-black text-gray-800 mb-2">10문제 달성 완료!</h2>
        <p className="text-gray-500 mb-8 font-bold text-lg">스스로 생각하기에<br/>오늘 푼 문제들은 어떠셨나요?</p>
        <div className="flex flex-col gap-4 w-full max-w-xs mx-auto">
          <button onClick={() => finishLesson('easy')} className="py-5 bg-green-100 text-green-700 rounded-3xl font-black text-xl shadow-sm active:scale-95 transition-all">쉬웠어요 😊</button>
          <button onClick={() => finishLesson('normal')} className="py-5 bg-blue-100 text-blue-700 rounded-3xl font-black text-xl shadow-sm active:scale-95 transition-all">적당했어요 😐</button>
          <button onClick={() => finishLesson('hard')} className="py-5 bg-red-100 text-red-700 rounded-3xl font-black text-xl shadow-sm active:scale-95 transition-all">어려웠어요 😥</button>
        </div>
      </div>
    );
  }

  const pct=(correctCount/10)*100;
  return(<div className="p-4 space-y-4 pb-36">
    <div className="flex items-center gap-3">
      <button onClick={handleBackAttempt} className="w-12 h-12 rounded-2xl bg-white shadow flex items-center justify-center text-xl font-bold text-gray-500">◀</button>
      <div className="flex-1 h-3 bg-gray-200 rounded-full overflow-hidden"><div className="h-full bg-gradient-to-r from-indigo-500 to-blue-500 rounded-full transition-all duration-500" style={{width:`${pct}%`}}/></div>
      <div className="bg-indigo-100 text-indigo-700 font-black px-4 py-2 rounded-full text-base">✅ {correctCount}/10</div>
    </div>
    <div className={`bg-white rounded-3xl p-6 shadow-md flex flex-col ${q.category==='exam5'?'items-start':'items-center justify-center'} ${q.category==='exam5'?(q.graph?'':'min-h-48'):'min-h-40'}`}>
      {q.category==='exam5'
        ?<div className="flex flex-col items-start gap-1 mb-3 w-full">
          <div className="inline-block bg-indigo-100 text-indigo-800 text-sm font-bold px-3 py-1 rounded-full">📚 {q.topic||q.meta?.type||'검정고시 영역 연습'}</div>
          {(()=>{var src=getExamSource(q);return src?<div className="text-xs text-gray-400">📌 출처: {src}</div>:null;})()}
        </div>
        :<div className="inline-block bg-yellow-100 text-yellow-800 text-sm font-bold px-3 py-1 rounded-full mb-4">{q.category==='div'?'약수 구하기':'나눗셈'}</div>
      }
      {q.category==='exam5'&&q.graph?.type==='system_eq'&&<div className="flex justify-center mb-2 w-full"><GraphPreview q={q}/></div>}
      {q.category==='exam5'&&<div className="text-base font-bold text-gray-800 leading-relaxed text-left w-full break-keep">{q.q}</div>}
      {q.category==='exam5'&&q.graph&&q.graph.type!=='system_eq'&&<div className="flex justify-center mt-3 w-full"><GraphPreview q={q}/></div>}
      {q.category==='math'&&<div className="text-4xl font-black text-gray-800 tracking-wide">{q.a} ÷ {q.b} = ?</div>}
      {q.category==='div'&&<div className="text-3xl font-black text-gray-800 leading-relaxed">
        <span className="text-indigo-600">{q.target}</span> 의<br/>
        {q.divQType==='count'?'약수는 모두 몇 개?':q.divQType==='notDiv'?<span className="text-sm font-bold text-red-600 block mb-1">약수가 <u>아닌</u> 것은?</span>:<span className="text-sm font-bold text-blue-600 block mb-1">약수를 <u>모두</u> 쓴 것은?</span>}
      </div>}
    </div>
    {fb&&<div className={`rounded-2xl px-5 py-4 text-base font-bold flex items-center gap-3 fade-in ${fb.ok?'bg-green-50 text-green-700 border-2 border-green-300':'bg-red-50 text-red-700 border-2 border-red-300'}`}>{fb.msg}</div>}
    {fb&&<SolutionBox q={q}/>}
    {phase==='question'&&(<div className="space-y-3">
      {q.isMC?(
        <React.Fragment>
          {q.category==='exam5'
            ?<div className="flex flex-col gap-3">
              {mcOpts.map((opt,i)=>{
                let cls='border-gray-200 bg-white text-gray-700';
                if(selMC===i) cls='border-indigo-500 bg-indigo-50 text-indigo-700';
                return(<button key={i} onClick={()=>{if(phase==='question')setSelMC(i);}}
                  className={`p-4 rounded-2xl border-2 text-base font-bold transition-all text-left leading-relaxed ${cls}`}>
                  <span className="text-indigo-900">{['①','②','③','④'][i]}</span> <span className="leading-relaxed"><MathText v={opt.text}/></span>
                </button>);
              })}
            </div>
            :<div className="grid grid-cols-2 gap-3">
              {mcOpts.map((opt,i)=>{
                let cls2='border-gray-200 bg-white text-gray-800';
                if(selMC===i) cls2='border-indigo-400 bg-indigo-50 text-indigo-700';
                return(<button key={i} onClick={()=>{if(phase==='question')setSelMC(i);}} className={`p-4 rounded-2xl border-2 text-base font-bold transition-all ${cls2}`}>{opt.text}</button>);
              })}
            </div>
          }
          <button onClick={()=>{if(selMC!==null)setShowConfirm(true);}}
            disabled={selMC===null}
            className={`w-full py-5 rounded-3xl text-xl font-black shadow-lg transition-all ${selMC!==null?'bg-gradient-to-r from-indigo-500 to-blue-600 text-white active:scale-95':'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
            확인 ✓
          </button>
        </React.Fragment>
      ):(<div className="space-y-3">
        {q.category==='math'&&<NumPadInput
          q={q} ans={ans} setAns={setAns}
          activeField={activeField} setActiveField={setActiveField}
          handleFirstAction={handleFirstAction}
          onConfirmRequest={()=>setShowConfirm(true)}
        />}
        {/* 약수 문제는 항상 사지선다 – 직접입력 없음 */}
      </div>)}
    </div>)}
    {phase==='feedback'&&correctCount<10&&<button onClick={nextQ} className="w-full py-5 bg-gradient-to-r from-green-500 to-emerald-600 text-white rounded-3xl text-xl font-black shadow-lg active:scale-95 transition-transform">다음 문제 →</button>}
    {/* ── 제출 확인 바텀시트 ── */}
    {showConfirm&&(
      <div className="fixed inset-0 bg-black/40 flex items-end justify-center z-50 fade-in" onClick={()=>setShowConfirm(false)}>
        <div className="bg-white rounded-t-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl" onClick={e=>e.stopPropagation()}>
          <div className="w-10 h-1 bg-gray-300 rounded-full mx-auto mb-2"/>
          <p className="text-center text-base font-black text-gray-800 leading-relaxed">
            {q.isMC
              ?<React.Fragment>「<span className="text-indigo-600">{selMC!==null?mcOpts[selMC]?.text:''}</span>」를 선택했습니다.</React.Fragment>
              :q.hasR
                ?<React.Fragment>몫 <span className="text-indigo-600 text-xl">{ans.ansQ}</span>, 나머지 <span className="text-indigo-600 text-xl">{ans.ansR}</span> 입력했습니다.</React.Fragment>
                :<React.Fragment><span className="text-indigo-600 text-2xl">{ans.ansQ}</span> 입력했습니다.</React.Fragment>
            }
          </p>
          <p className="text-center text-gray-500 font-bold text-sm">제출하시겠습니까?</p>
          <div className="flex gap-3">
            <button onClick={()=>setShowConfirm(false)}
              className="flex-1 py-4 bg-gray-100 text-gray-600 rounded-2xl font-black text-lg active:scale-95 transition-all">
              취소
            </button>
            <button onClick={()=>{setShowConfirm(false);check();}}
              className="flex-1 py-4 bg-gradient-to-r from-indigo-500 to-blue-600 text-white rounded-2xl font-black text-lg active:scale-95 transition-all">
              제출
            </button>
          </div>
        </div>
      </div>
    )}
    {showExitModal&&(
      <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div className="bg-white rounded-3xl p-6 shadow-2xl w-full max-w-sm fade-in">
          <div className="text-center mb-5">
            <div className="text-4xl mb-3">📚</div>
            <div className="text-xl font-black text-gray-800">문제 풀이 중이에요!</div>
            <div className="text-sm text-gray-500 mt-2">현재 정답 <strong>{correctCount}/10</strong>까지 왔어요.<br/>어떻게 할까요?</div>
          </div>
          <div className="flex flex-col gap-3">
            <button onClick={()=>{saveSession();setShowExitModal(false);onBack();}}
              className="w-full py-4 bg-indigo-600 text-white rounded-2xl font-black text-lg active:scale-95 transition-all">
              현재 상태 저장하기 💾
            </button>
            <button onClick={()=>{setShowExitModal(false);onBack();}}
              className="w-full py-4 bg-gray-100 text-gray-600 rounded-2xl font-black text-lg active:scale-95 transition-all">
              그만하기
            </button>
            <button onClick={()=>setShowExitModal(false)}
              className="w-full py-3 text-gray-400 font-bold text-sm">
              계속 풀기
            </button>
          </div>
        </div>
      </div>
    )}
  </div>);
}

    <div className="text-8xl mb-4">🎉</div>
    <h2 className="text-3xl font-black text-gray-800 mb-2">레슨 완료!</h2>
    <p className="text-gray-500 text-lg mb-6">{isExam?`10문제 완료! 정답 ${correct}개`:'10문제를 모두 맞혔어요!'}</p>

/* --------------------------------------------------------------------
   학생용 학습 리포트
   세션이 끝난 뒤 보여 주는 성취 요약
   -------------------------------------------------------------------- */

/* ===== 학습 리포트 ===== */
function StudentLearningReport({userData,onClose}){
  const allLogs=userData.logs||[];
  const allQs=allLogs.flatMap(l=>l.questions||[]);
  const total=allQs.length;
  const correct=allQs.filter(q=>q.isOk).length;
  const pct=total>0?Math.round(correct/total*100):0;

  const catMap={};
  allQs.forEach(q=>{
    const cat=q.meta?.type||(q.topic?q.topic:'기타');
    if(!catMap[cat])catMap[cat]={total:0,correct:0};
    catMap[cat].total++;
    if(q.isOk)catMap[cat].correct++;
  });
  const cats=Object.entries(catMap).map(([k,v])=>({name:k,...v,pct:Math.round(v.correct/v.total*100)})).sort((a,b)=>a.pct-b.pct);
  const weak=cats.filter(c=>c.pct<60&&c.total>=2);
  const strong=cats.filter(c=>c.pct>=80&&c.total>=2);

  const encourage=pct>=80?'정말 잘하고 계세요! 꾸준히 하면 반드시 합격할 수 있습니다 😊':pct>=60?'잘 하고 계세요! 조금만 더 노력하면 더욱 좋아질 거예요 💪':'걱정하지 마세요. 천천히 꾸준히 하다 보면 반드시 늘게 됩니다 🌱';

  const reportRef=useRef(null);
  const[saving,setSaving]=useState(false);
  const saveAsJPG=async()=>{
    if(!window.html2canvas){alert('html2canvas를 불러오지 못했습니다.');return;}
    const el=reportRef.current;
    if(!el)return;
    setSaving(true);
    el.scrollTop=0;
    // React가 saving 상태로 리렌더한 뒤 잠시 기다려 레이아웃을 안정화
    await new Promise(r=>setTimeout(r,100));
    try{
      const W=el.scrollWidth;
      const fullH=el.scrollHeight;
      const canvas=await window.html2canvas(el,{
        scale:2,
        backgroundColor:'#ffffff',
        useCORS:true,
        scrollX:0,
        scrollY:0,
        width:W,
        height:fullH,
        windowWidth:W,
        windowHeight:fullH,
        onclone:(_doc,cloned)=>{
          // 컨테이너만 overflow 해제 (자식은 유지해야 progress bar 등이 정상 렌더)
          cloned.style.setProperty('position','relative','important');
          cloned.style.setProperty('top','0','important');
          cloned.style.setProperty('left','0','important');
          cloned.style.setProperty('max-height','none','important');
          cloned.style.setProperty('overflow','visible','important');
          cloned.style.setProperty('height',fullH+'px','important');
          cloned.style.setProperty('box-shadow','none','important');
          // 버튼은 레이아웃 유지하되 보이지 않게 처리 (저장 중… 문구 등 제거)
          cloned.querySelectorAll('button').forEach(b=>b.style.setProperty('visibility','hidden','important'));
        },
      });
      const a=document.createElement('a');
      a.href=canvas.toDataURL('image/jpeg',0.95);
      a.download=`학습보고서_${userData.name}.jpg`;
      a.click();
    }catch(err){alert('JPG 저장 실패: '+err.message);}
    finally{setSaving(false);}
  };

  return(
    <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
      <div ref={reportRef} className="bg-white rounded-3xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto fade-in">
        <div className="bg-indigo-600 text-white px-5 py-4 rounded-t-3xl flex items-center gap-3">
          <div className="text-2xl">📊</div>
          <div className="flex-1">
            <div className="font-black text-lg">나의 학습 리포트</div>
            <div className="text-xs text-indigo-200 font-semibold">{userData.name}님 · 총 {total}문제</div>
          </div>
          <button onClick={saveAsJPG} disabled={saving} className="px-3 py-1.5 bg-white text-indigo-700 rounded-xl font-black text-sm disabled:opacity-60">{saving?'저장 중…':'💾 JPG 저장'}</button>
          <button onClick={onClose} className="px-3 py-1.5 bg-white/20 rounded-xl font-bold text-sm">✕</button>
        </div>
        <div className="p-5 space-y-4">
          {total===0?(
            <div className="text-center py-10 text-gray-400 text-lg font-bold">아직 풀이 기록이 없어요.<br/>문제를 풀어보세요!</div>
          ):(
            <>
              <div className="text-center py-4 bg-gray-50 rounded-2xl">
                <div className={`text-6xl font-black ${pct>=80?'text-green-600':pct>=60?'text-blue-600':'text-red-500'}`}>{pct}%</div>
                <div className="text-sm text-gray-500 mt-1 font-bold">전체 정답률 ({correct}/{total}문제)</div>
              </div>
              <div className="bg-yellow-50 border-2 border-yellow-300 rounded-2xl px-4 py-3 text-base font-bold text-yellow-900 leading-relaxed">{encourage}</div>
              <div className="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm">
                <div className="font-black text-gray-800 mb-3">📈 영역별 정답률</div>
                {cats.length===0?<div className="text-gray-400 text-sm">데이터가 부족합니다.</div>:cats.map(c=>(
                  <div key={c.name} className="flex items-center gap-2 mb-2">
                    <span className="text-xs font-bold text-gray-600 w-28 shrink-0 truncate">{c.name}</span>
                    <div className="flex-1 bg-gray-200 rounded-full h-3 overflow-hidden">
                      <div className={`h-full rounded-full ${c.pct>=80?'bg-green-500':c.pct>=60?'bg-blue-500':'bg-red-400'}`} style={{width:c.pct+'%'}}/>
                    </div>
                    <span className={`text-xs font-black w-10 text-right ${c.pct>=80?'text-green-600':c.pct>=60?'text-blue-600':'text-red-500'}`}>{c.pct}%</span>
                  </div>
                ))}
              </div>
              {weak.length>0&&(
                <div className="bg-red-50 border border-red-100 rounded-2xl p-4">
                  <div className="font-black text-red-700 mb-2">📌 더 연습하면 좋은 부분</div>
                  {weak.map(c=>(
                    <div key={c.name} className="text-sm text-red-800 font-bold mb-1">• {c.name} ({c.pct}%) — 집중 연습을 추천해요!</div>
                  ))}
                </div>
              )}
              {strong.length>0&&(
                <div className="bg-green-50 border border-green-100 rounded-2xl p-4">
                  <div className="font-black text-green-700 mb-2">🌟 잘하고 있는 부분</div>
                  {strong.map(c=>(
                    <div key={c.name} className="text-sm text-green-800 font-bold mb-1">• {c.name} ({c.pct}%) — 훌륭해요!</div>
                  ))}
                </div>
              )}
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ===== HISTORY TAB ===== */
function HistoryTab({userData, feedbacks}){

  const logs=showAll?allLogs:recentLogs;

  return(<div className="p-4 pb-36 space-y-3">
    
    {fbs.length > 0 && (
      <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 mb-2 shadow-sm">
        <div className="flex justify-between items-center mb-1">
          <div className="font-black text-indigo-800 text-base">💌 받은 피드백 ({fbs.length})</div>
          <button onClick={()=>setShowFbs(!showFbs)} className="text-xs bg-indigo-200 text-indigo-800 px-3 py-1.5 rounded-lg font-bold">{showFbs?'접기 ▲':'펼쳐보기 ▼'}</button>
        </div>
        {showFbs && (
          <div className="space-y-3 mt-4">
            {fbs.map(fb => (
              <div key={fb.id} className="bg-white p-4 rounded-2xl shadow-sm border border-indigo-100 relative">
                {!fb.read && <div className="absolute -top-1.5 -right-1.5 w-3.5 h-3.5 bg-red-500 rounded-full border-2 border-white"></div>}
                {fb.relatedLog && <div className="text-xs text-indigo-500 font-black mb-2 inline-block bg-indigo-50 px-2 py-1 rounded">📋 {fb.relatedLog}</div>}
                <div className="text-base font-bold text-gray-800 leading-relaxed">{fb.message}</div>
                <div className="text-xs text-gray-400 mt-3 font-semibold text-right">{fb.createdAt?.toDate?.()?.toLocaleDateString('ko-KR') || new Date(fb.createdAt).toLocaleDateString('ko-KR')}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    )}

    <div className="flex items-center justify-between mt-4 mb-2">
      <div className="text-lg font-black text-gray-700">📅 학습 기록 {showAll?'(전체)':'(최근 5일)'}</div>
      <div className="flex gap-2">
        <button onClick={()=>setShowReport(true)} className="text-xs font-bold px-3 py-1.5 bg-indigo-600 text-white rounded-xl">📊 나의 리포트</button>
        {olderCount>0&&<button onClick={()=>setShowAll(!showAll)} className="text-xs font-bold px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded-xl">{showAll?'최근만 보기 ▲':`더보기 ${olderCount}개 ▼`}</button>}
      </div>
    </div>
    {allLogs.length===0&&<div className="text-center text-gray-400 py-12 text-base font-bold">아직 완료한 레슨이 없어요.<br/>문제를 풀어보세요!</div>}
    {allLogs.length>0&&logs.length===0&&<div className="text-center text-gray-400 py-8 text-sm font-bold">최근 5일간 학습 기록이 없어요.<br/>아래 '더보기'로 지난 기록을 볼 수 있어요.</div>}
    {logs.map((log,i)=>{const isOpen=open===i;return(<div key={i} className="bg-white rounded-2xl shadow-sm overflow-hidden">
      <div className="flex items-center gap-3 p-4 border-b border-gray-100">
        <div className="flex-1"><div className="font-bold text-gray-800 text-base">{fmtDate(log.date)} {log.time}</div>
          <div className="text-sm text-gray-500 mt-0.5">{log.type} · 점수 {log.score}{log.totalSec?` · ⏱️ ${Math.floor(log.totalSec/60)}분 ${log.totalSec%60}초`:''}</div></div>
        <button onClick={()=>setPrintLog(log)} className="text-sm text-emerald-700 font-bold px-3 py-1.5 bg-emerald-50 rounded-xl">🖨️ 인쇄</button>
        <button onClick={()=>setOpen(isOpen?null:i)} className="text-sm text-indigo-600 font-bold px-3 py-1.5 bg-indigo-50 rounded-xl">{isOpen?'닫기':'보기'}</button>
      </div>
      {isOpen&&log.questions&&log.questions.length>0&&(<div className="p-3 grid grid-cols-1 sm:grid-cols-2 gap-3">
        {log.questions.map((q,j)=><div key={j} className={`rounded-xl p-3 text-sm ${q.isOk?'bg-green-50':'bg-red-50'}`}>
          <div className="flex gap-2"><span className="font-bold text-gray-500">Q{j+1}.</span><span className="font-bold text-gray-800 flex-1">{q.qTxt}</span><span className={`font-black ${q.isOk?'text-green-600':'text-red-500'}`}>{q.isOk?'O':'X'}</span></div>
          {q.examSource&&<div className="mt-1 pl-6 text-xs text-blue-500 font-bold">📌 {q.examSource}</div>}
          {!q.isOk&&<div className="mt-1 pl-6 text-xs text-gray-500">내 답: <span dangerouslySetInnerHTML={{__html:autoMathHtml(String(q.uAns??''))}}/> → 정답: <span className="text-indigo-600 font-bold" dangerouslySetInnerHTML={{__html:autoMathHtml(String(q.cAns??''))}}/></div>}
          {q.explanation&&<div className="mt-2 pl-6 text-xs text-amber-800 leading-relaxed">💡 <span dangerouslySetInnerHTML={{__html:autoMathHtml(q.explanation)}}/></div>}
          {q.timeSec!==undefined&&<div className="mt-0.5 pl-6 text-xs text-indigo-400 font-bold">⏱️ {q.timeSec}초</div>}
        </div>)}
      </div>)}
    </div>)})}
    {printLog&&<SessionPrintModal log={printLog} onClose={()=>setPrintLog(null)}/>}
    {showReport&&<StudentLearningReport userData={userData} onClose={()=>setShowReport(false)}/>}
  </div>);
}

/* --------------------------------------------------------------------
   모의고사 탭
   중졸·고졸 검정고시 모의고사 응시
   -------------------------------------------------------------------- */

function MockExamTab({userData,onUpdate}){
  const[screen,setScreen]=useState('start');
  const[examLevel,setExamLevel]=useState(null);
  const[questions,setQuestions]=useState([]);
  const[sel,setSel]=useState({});
  const[isGraded,setIsGraded]=useState(false);
  const[saved,setSaved]=useState(false);
  const[startTime,setStartTime]=useState(null);
  const[mode,setMode]=useState('');
  // ── 행동 추적 (신규) ──
  const[firstClickTimes,setFirstClickTimes]=useState({}); // {qIdx: ms from startTime to first click}
  const[revisionCounts,setRevisionCounts]=useState({});   // {qIdx: number of answer changes after first}
  const[selectedDomains,setSelectedDomains]=useState([]);

  const HIGH_DOMAIN_GENS={'다항식 계산':genMockPoly,'방정식과 부등식':genMockEqInequal,'도형과 기하':genMockGeometry,'집합과 함수':genMockSetFunc,'확률과 통계':genMockProbStat};
  const DOMAIN_GENS=examLevel==='middle'?MID_DOMAIN_GENS:HIGH_DOMAIN_GENS;
  const DOMAINS=Object.keys(DOMAIN_GENS);

  const computeStats=(logs)=>{
    const s={};DOMAINS.forEach(d=>s[d]={c:0,t:0});
    (logs||[]).forEach(log=>{
      if(!log.questions)return;
      log.questions.forEach(q=>{
        const type=(q.meta?.type||log.type||'').toLowerCase();
        const cat=(q.meta?.category||'').toLowerCase();
        const exact=DOMAINS.find(d=>type.includes(d.toLowerCase()));
        if(exact){s[exact].t++;if(q.isOk)s[exact].c++;return;}
        if(examLevel==='middle')return;
        if(type.includes('다항식')||cat==='poly'||type.includes('나눗셈')||type.includes('나머지')||type.includes('인수분해')||type.includes('항등식'))
          {s['다항식 계산'].t++;if(q.isOk)s['다항식 계산'].c++;}
        else if(type.includes('방정식')||type.includes('부등식')||type.includes('스토리')||type.includes('문장제')||cat==='eq'||cat==='ineq')
          {s['방정식과 부등식'].t++;if(q.isOk)s['방정식과 부등식'].c++;}
        else if(type.includes('기하')||type.includes('도형')||cat==='geometry'||type.includes('대칭')||type.includes('거리')||type.includes('직선')||type.includes('내분'))
          {s['도형과 기하'].t++;if(q.isOk)s['도형과 기하'].c++;}
        else if(type.includes('함수')||type.includes('집합')||type.includes('명제')||cat==='set'||cat==='func')
          {s['집합과 함수'].t++;if(q.isOk)s['집합과 함수'].c++;}
        else if(type.includes('확률')||type.includes('통계')||type.includes('순열')||type.includes('조합')||cat==='div'||cat==='stat'||type.includes('약수')||type.includes('배수'))
          {s['확률과 통계'].t++;if(q.isOk)s['확률과 통계'].c++;}
      });
    });
    return s;
  };

  const startExam=(examMode,domainList)=>{
    setMode(examMode);
    const stats=computeStats(userData.logs||[]);
    const weakDomains=DOMAINS.filter(d=>stats[d].t===0||(stats[d].c/stats[d].t)<0.7);
    const safeGen=(gen)=>{try{const q=gen();return q||null;}catch(e){return null;}};
    let pool=[];
    if(examMode==='weak'){
      const targets=weakDomains.length>0?weakDomains:DOMAINS;
      for(let i=0;i<10;i++){
        const dom=i<7?targets[i%targets.length]:DOMAINS[i%DOMAINS.length];
        const q=safeGen(DOMAIN_GENS[dom]);if(q)pool.push(q);
      }
    }else if(examMode==='domain'){
      const targets=domainList&&domainList.length>0?domainList:DOMAINS;
      let safety2=0;
      while(pool.length<10&&safety2++<80){
        const dom=pick(targets);
        const q=safeGen(DOMAIN_GENS[dom]);
        if(q)pool.push(q);
      }
      pool=shuffle(pool);
    }else{
      DOMAINS.forEach(dom=>{for(let j=0;j<2;j++){const q=safeGen(DOMAIN_GENS[dom]);if(q)pool.push(q);}});
      pool=shuffle(pool);
    }
    let safety=0;
    while(pool.length<10&&safety++<50){const q=safeGen(pick(Object.values(DOMAIN_GENS)));if(q)pool.push(q);}
    setQuestions(pool.slice(0,10));setSel({});setIsGraded(false);setSaved(false);setStartTime(Date.now());setScreen('exam');
    setFirstClickTimes({});setRevisionCounts({});
  };

  const saveResult=async(feeling)=>{
    if(saved||!userData)return;
    const totalSec=Math.round((Date.now()-startTime)/1000);
    const correctCount=questions.filter((q,i)=>sel[i]===q.answer).length;
    const qs=questions.map((q,i)=>{
      const fms=firstClickTimes[i]??null;
      return{
        qTxt:q.q.length>70?q.q.slice(0,70)+'…':q.q,
        qFull:q.q,
        choices:q.choices,
        answerIdx:q.answer,
        uAns:sel[i]!==undefined?q.choices[sel[i]]:'미입력',
        cAns:q.choices[q.answer],
        isOk:sel[i]===q.answer,
        timeSec:fms!=null?Math.round(fms/1000):null,
        firstClickMs:fms,
        revisionCount:revisionCounts[i]??0,
        qTopicHash:getTopicHash(q),
        sol:Array.isArray(q.sol)&&q.sol.length?q.sol:null,
        explanation:easyExplanation(q),
        meta:q.meta
      };
    });
    const levelLabel=examLevel==='middle'?'중졸':'고졸';
    const typeLabel=mode==='weak'?`📝 ${levelLabel} 약점 집중 모의고사`:mode==='domain'?`📝 ${levelLabel} 영역집중 [${selectedDomains.join('+')}]`:`📝 ${levelLabel} 랜덤 혼합 모의고사`;
    const log={date:todayStr(),time:timeStr(),type:typeLabel,score:`${correctCount} / 10`,questions:qs,totalSec,feeling};
    const newLogs=[log,...(userData.logs||[])];
    const newTodayLessons=(userData.todayLessons||0)+1;
    const activeDates=[...new Set([...(userData.activeDates||[]),todayStr()])];
    const upd={...userData,logs:newLogs,todayLessons:newTodayLessons,activeDates,lastDate:todayStr()};
    try{
      await db.collection('users').doc(upd.name).set(upd,{merge:true});
      if(onUpdate)onUpdate(upd);
      setSaved(true);
      updateQStats(qs); // fire-and-forget: qStats 집계 (실패해도 무시)
    }catch(e){alert('저장 실패. 인터넷 연결을 확인해주세요.');}
  };

  const ORD=['①','②','③','④'];
  const correctCount=questions.filter((q,i)=>sel[i]===q.answer).length;
  const answered=Object.keys(sel).length;

  if(screen==='start'){
    if(!examLevel)return(<div className="p-4 pb-36 space-y-4 fade-in">
      <div className="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-3xl p-6 text-white shadow-lg">
        <h2 className="text-xl font-black mb-1">📝 검정고시 모의고사</h2>
        <p className="text-sm opacity-90">먼저 응시할 학력을 골라 주세요.</p>
      </div>
      <button onClick={()=>setExamLevel('middle')} className="w-full p-6 bg-gradient-to-r from-sky-500 to-blue-600 text-white rounded-3xl text-left shadow-lg active:scale-95 transition-transform">
        <div className="text-2xl font-black">📘 중졸 모의고사</div><div className="text-sm mt-2 opacity-90">2023~2026 최근 핵심 유형 · 중학교 과정 5개 영역</div>
      </button>
      <button onClick={()=>setExamLevel('high')} className="w-full p-6 bg-gradient-to-r from-violet-500 to-indigo-700 text-white rounded-3xl text-left shadow-lg active:scale-95 transition-transform">
        <div className="text-2xl font-black">📚 고졸 모의고사</div><div className="text-sm mt-2 opacity-90">2023~2026 고졸 기출 변형 · 고등학교 과정 5개 영역</div>
      </button>
    </div>);
    const stats=computeStats(userData.logs||[]);
    const weakDomains=DOMAINS.filter(d=>stats[d].t===0||(stats[d].c/stats[d].t)<0.7);
    const GRADE_COLOR={0:'bg-gray-200',1:'bg-orange-400',2:'bg-lime-400',3:'bg-green-500',4:'bg-emerald-500'};
    const getGrade=(st)=>{if(st.t===0)return 0;const r=st.c/st.t;return r<0.4?1:r<0.7?2:r<0.9?3:4;};
    const ICONS=['🌱','🌱','🌿','🌳','🍎'];
    return(<div className="p-4 pb-36 space-y-4 fade-in">
      <div className="bg-gradient-to-r from-indigo-600 to-violet-600 rounded-3xl p-6 text-white shadow-lg">
        <button onClick={()=>setExamLevel(null)} className="text-sm font-bold opacity-90 mb-3">← 학력 다시 선택</button>
        <h2 className="text-xl font-black mb-1">📝 {examLevel==='middle'?'중졸':'고졸'} 기출 혼합 모의고사</h2>
        <p className="text-sm opacity-90">2023~2026 기출 패턴 변형 · 최근 유형 우선</p>
      </div>
      {weakDomains.length>0&&(<div className="bg-orange-50 border border-orange-200 rounded-2xl p-4">
        <div className="text-sm font-black text-orange-700 mb-2">🎯 현재 취약 영역 (정답률 70% 미만)</div>
        <div className="flex flex-wrap gap-2">{weakDomains.map(d=><span key={d} className="bg-orange-100 text-orange-700 text-xs font-bold px-3 py-1.5 rounded-full border border-orange-200">{d}</span>)}</div>
      </div>)}
      <div className="space-y-3">
        <button onClick={()=>startExam('weak')} className="w-full p-5 bg-gradient-to-r from-orange-500 to-red-500 text-white rounded-3xl font-black text-lg shadow-lg active:scale-95 transition-transform">
          🎯 약점 집중 공략 10문제
          <div className="text-xs font-normal opacity-80 mt-1">취약 영역 집중 + 기출 변형 자동 출제</div>
        </button>
        <button onClick={()=>startExam('random')} className="w-full p-5 bg-gradient-to-r from-indigo-500 to-blue-600 text-white rounded-3xl font-black text-lg shadow-lg active:scale-95 transition-transform">
          🎲 랜덤 혼합 모의고사 10문제
          <div className="text-xs font-normal opacity-80 mt-1">5개 영역 골고루 · 매번 새 문제</div>
        </button>
      </div>
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div className="text-sm font-black text-gray-700 mb-2">📌 영역 선택 집중 풀기</div>
        <div className="text-xs text-gray-400 mb-3">원하는 영역만 체크하고 그 영역에서만 문제를 풀어요</div>
        <div className="flex flex-wrap gap-2 mb-3">
          {DOMAINS.map(d=>(
            <button key={d} onClick={()=>setSelectedDomains(prev=>prev.includes(d)?prev.filter(x=>x!==d):[...prev,d])}
              className={`px-3 py-2 rounded-full text-xs font-bold border-2 transition-all active:scale-95 ${selectedDomains.includes(d)?'bg-teal-500 text-white border-teal-500':'bg-white text-gray-600 border-gray-200'}`}>
              {selectedDomains.includes(d)?'✓ ':''}{d}
            </button>
          ))}
        </div>
        <button onClick={()=>{if(selectedDomains.length>0)startExam('domain',selectedDomains);}}
          className={`w-full py-4 rounded-2xl font-black text-base transition-all active:scale-95 ${selectedDomains.length>0?'bg-gradient-to-r from-teal-500 to-green-600 text-white shadow-md':'bg-gray-100 text-gray-400 cursor-default'}`}>
          {selectedDomains.length>0?`📌 선택 영역 10문제 시작 →`:'영역을 먼저 선택하세요'}
          {selectedDomains.length>0&&<div className="text-xs font-normal opacity-80 mt-1">{selectedDomains.join(' · ')}</div>}
        </button>
      </div>
      <div className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div className="text-sm font-black text-gray-600 mb-3">🌳 나의 수학 나무 숲 현황</div>
        <div className="space-y-2.5">
          {DOMAINS.map(d=>{
            const st=stats[d];const g=getGrade(st);const rate=st.t===0?0:Math.round((st.c/st.t)*100);
            return(<div key={d} className="flex items-center gap-2">
              <span className="text-base w-5">{ICONS[g]}</span>
              <span className="text-xs font-bold text-gray-700 w-28 flex-shrink-0">{d}</span>
              <div className="flex-1 bg-gray-100 rounded-full h-2.5">
                <div className={`${GRADE_COLOR[g]} h-2.5 rounded-full transition-all`} style={{width:`${st.t===0?4:Math.max(4,rate)}%`}}/>
              </div>
              <span className="text-xs font-bold text-gray-500 w-14 text-right">{st.t===0?'미학습':`${rate}%`}</span>
            </div>);
          })}
        </div>
      </div>
    </div>);
  }

  if(screen==='exam'){
    return(<div className="p-4 pb-36 space-y-4 fade-in">
      <div className="sticky top-0 bg-white border-b py-3 flex items-center gap-3 z-10 -mx-4 px-4 shadow-sm">
        <button onClick={()=>setScreen('start')} className="text-gray-500 text-sm font-bold">← 나가기</button>
        <span className="flex-1 text-sm font-black text-gray-700">{examLevel==='middle'?'중졸':'고졸'} · {mode==='weak'?'🎯 약점 집중':mode==='domain'?`📌 ${selectedDomains.join('+')}` :'🎲 랜덤 혼합'} ({answered}/10)</span>
        {isGraded&&<span className="text-sm font-black text-indigo-600">{correctCount}/10점</span>}
      </div>
      {questions.map((q,i)=>{
        const isSel=sel[i]!==undefined,isCorrect=sel[i]===q.answer;
        return(<div key={i} className="bg-white p-5 rounded-3xl shadow-sm border border-gray-100">
          <div className="flex items-center gap-2 mb-3">
            <span className="w-7 h-7 rounded-full bg-indigo-500 text-white text-xs font-black flex items-center justify-center flex-shrink-0">{i+1}</span>
            <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-1 rounded-full">{q.topic}</span>
            {(()=>{var src=getExamSource(q);return src?<span className="text-[10px] text-gray-400 font-normal ml-1">📌 {src}</span>:null;})()}
            {isGraded&&isSel&&<span className="ml-auto text-base">{isCorrect?'✅':'❌'}</span>}
          </div>
          {q.graph?.type==='system_eq'&&<div className="flex justify-center mb-2"><GraphPreview q={q}/></div>}
          <div className="font-bold text-gray-800 text-sm leading-relaxed mb-3"><QText v={q.q}/></div>
          {/* 기하 문제 그래프 미리보기 */}
          {q.graph&&q.graph.type!=='system_eq'&&<div className="flex justify-center mb-2"><GraphPreview q={q}/></div>}
          <div className="grid grid-cols-1 gap-2">
            {q.choices.map((ch,j)=>{
              let cls='bg-gray-50 border-gray-200 text-gray-700';
              if(isGraded){if(sel[i]===j)cls=j===q.answer?'bg-green-100 border-green-400 text-green-800 font-bold':'bg-red-100 border-red-400 text-red-700';else if(j===q.answer)cls='bg-green-50 border-green-300 text-green-700 font-semibold';}
              else if(sel[i]===j)cls='bg-indigo-100 border-indigo-400 text-indigo-800 font-semibold';
              return(<button key={j} onClick={()=>{
                if(isGraded)return;
                const now=Date.now()-startTime;
                // 첫 선택: firstClickMs 기록
                if(firstClickTimes[i]===undefined) setFirstClickTimes(p=>({...p,[i]:now}));
                // 이후 선택: 이미 다른 답 선택한 경우에만 revisionCount++
                else if(sel[i]!==undefined&&sel[i]!==j) setRevisionCounts(p=>({...p,[i]:(p[i]||0)+1}));
                setSel(s=>({...s,[i]:j}));
              }}
                className={`text-left text-base px-4 py-3 rounded-xl border-2 transition-all active:scale-95 ${cls}`}>
                {ORD[j]} <MathText v={ch}/>
              </button>);
            })}
          </div>
          {isGraded&&!isCorrect&&(<div className="mt-3 text-sm bg-red-50 border border-red-200 rounded-xl px-3 py-2 text-red-700 font-bold">정답: {ORD[q.answer]} <MathText v={q.choices[q.answer]}/></div>)}
          {isGraded&&<ExplanationBox q={q}/>}
        </div>);
      })}
      {answered===10&&!isGraded&&(<div className="fade-in">
        <button onClick={()=>setIsGraded(true)} className="w-full py-5 bg-indigo-600 text-white rounded-3xl font-black text-xl shadow-lg active:scale-95 transition-transform">채점하기 📝</button>
      </div>)}
      {isGraded&&!saved&&(<div className="bg-white p-6 rounded-3xl shadow-sm text-center border-2 border-indigo-100 fade-in">
        <div className="text-2xl font-black text-indigo-700 mb-1">🎯 {correctCount}/10 정답!</div>
        <div className="text-sm text-gray-500 mb-4">이번 모의고사는 어떠셨나요? 평가 후 기록이 저장됩니다.</div>
        <div className="flex gap-2 justify-center">
          <button onClick={()=>saveResult('easy')} className="flex-1 py-4 bg-green-100 text-green-700 rounded-2xl font-black active:scale-95 transition-transform">쉬웠어요 😊</button>
          <button onClick={()=>saveResult('normal')} className="flex-1 py-4 bg-blue-100 text-blue-700 rounded-2xl font-black active:scale-95 transition-transform">적당해요 😐</button>
          <button onClick={()=>saveResult('hard')} className="flex-1 py-4 bg-red-100 text-red-700 rounded-2xl font-black active:scale-95 transition-transform">어려워요 😥</button>
        </div>
      </div>)}
      {isGraded&&saved&&(<div className="text-center fade-in space-y-3">
        <div className="inline-block bg-green-100 text-green-700 font-bold px-6 py-4 rounded-2xl">✅ 학습 기록에 저장되었습니다!</div>
        <button onClick={()=>setScreen('start')} className="block w-full py-4 bg-indigo-50 text-indigo-600 rounded-2xl font-bold">다시 도전하기 →</button>
      </div>)}
    </div>);
  }
  return null;
}
