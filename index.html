   - SVG 도형 렌더러 (좌표평면 planeSVG, 수직선, 내분점, 조립제법 표, 사상도)
   - 문제 카드 / 학습지 전체 HTML 템플릿 + 인쇄용 CSS
   기존 앱의 전역 이름(pick, shuffle 등)과 충돌하지 않도록 모두 GS 안에 둔다.
   ===================================================================== */
var GS=(function(){
  let UID=0;
  const nf=v=>Number.isInteger(v)?String(v):String(Math.round(v*1000)/1000);
  const par=v=>v<0?`(${nf(v)})`:nf(v);
  const xm=p=>p===0?'x':(p>0?`x-${nf(p)}`:`x+${nf(-p)}`);
  const ym=q=>q===0?'y':(q>0?`y-${nf(q)}`:`y+${nf(-q)}`);
  const tail=q=>q===0?'':(q>0?`+${nf(q)}`:`-${nf(-q)}`);
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const tex=t=>`<span class="tx" contenteditable="false" data-tex="${esc(t)}"></span>`;
  const pr=(a,b)=>`(${nf(a)},\\ ${nf(b)})`;
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  const pick=arr=>arr[rnd(0,arr.length-1)];
  const nz=(a,b)=>{let v=rnd(a,b);let g=0;while(v===0&&g++<20)v=rnd(a,b);return v===0?1:v;};
  const CIRC=['①','②','③','④'];
  const isInt=v=>Math.abs(v-Math.round(v))<1e-9;
  const sqrtTex=n=>{const s=Math.round(Math.sqrt(n));return s*s===n?nf(s):`\\sqrt{${nf(n)}}`;};
  const sqrtTxt=n=>{const s=Math.round(Math.sqrt(n));return s*s===n?nf(s):`√${nf(n)}`;};

  function shuffleWith(rng,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
  const shuffle=arr=>shuffleWith(Math.random,arr);
  function mulberry(seed){let t=seed>>>0;return()=>{t+=0x6D2B79F5;let r=Math.imul(t^t>>>15,1|t);r^=r+Math.imul(r^r>>>7,61|r);return((r^r>>>14)>>>0)/4294967296;};}

  /* 다항식 항 표기 : 계수 c, 변수식 v("x^3","x","" 상수) */
  function term(c,v,first){
    if(c===0)return'';
    let s='';
    if(c<0)s='-';else if(!first)s='+';
    const a=Math.abs(c);
    if(v==='')s+=nf(a);else s+=(a===1?'':nf(a))+v;
    return s;
  }
  function poly(coefs){let s='',first=true;for(const[c,v]of coefs){const t=term(c,v,first);if(t){s+=t;first=false;}}return s||'0';}

  /* ---------- 보기 만들기 ---------- */
  function numChoices(ans){
    let off=rnd(0,3);
    if(ans>=1&&ans-off<1)off=ans-1;
    const lo=ans-off;
    return{list:[0,1,2,3].map(i=>nf(lo+i)),ans:off};
  }
  function stepChoices(ans,step){let off=rnd(0,3);while(ans-off*step<1&&off>0)off--;const lo=ans-off*step;return{list:[0,1,2,3].map(i=>nf(lo+i*step)),ans:off};}
  /* 정답 1개 + 후보 목록에서 서로 다른 오답 3개 → 섞어서 {list, ans} */
  function pickChoices(correct,cands,fallback){
    const seen=new Set([correct]);const wrongs=[];
    for(const c of cands){if(!seen.has(c)){seen.add(c);wrongs.push(c);}if(wrongs.length===3)break;}
    let k=1;while(wrongs.length<3&&fallback){const c=fallback(k++);if(c&&!seen.has(c)){seen.add(c);wrongs.push(c);}if(k>40)break;}
    const sh=shuffle([{c:correct,ok:true},...wrongs.map(c=>({c,ok:false}))]);
    return{list:sh.map(o=>o.c),ans:sh.findIndex(o=>o.ok)};
  }
  /* 좌표 보기 : 정답 (X,Y) + 부호/자리 바꾼 오답 */
  function coordChoices(X,Y){
    const cands=[[Y,X],[-X,Y],[X,-Y],[-X,-Y],[X+1,Y],[X,Y+1],[X-1,Y-1]].map(([a,b])=>pr(a,b));
    return pickChoices(pr(X,Y),cands,k=>pr(X+k,Y-k));
  }
  function choicesHTML(list,one,raw){
    return`<div class="choices${one?' one':''}">`+list.map((c,i)=>`<span class="ch"><span class="ci">${CIRC[i]}</span> ${raw?c:tex(c)}</span>`).join('')+`</div>`;
  }

  /* =====================================================================
     SVG 렌더러
     ===================================================================== */
  const F='font-family="Jua, Gaegu, sans-serif"';
  const NAVY='#123a6b',RED='#c0272d',GREEN='#1b7f3b',GREY='#9aa7b8';

  /* 좌표평면
     g : {xmin,xmax,ymin,ymax,s?,grid?(기본 true),maxW?}
     items : [{t:'fn'|'circle'|'vline'|'hline'|'seg'|'pt'|'text'|'rangle'|'vdash', ...}] */
  function planeSVG(g,items){
    const{xmin,xmax,ymin,ymax}=g;const pad=g.pad||44;const maxW=g.maxW||440;
    const s=Math.max(14,Math.min(g.s||36,Math.floor((maxW-pad*2)/Math.max(1,xmax-xmin)),Math.floor((maxW-pad*2)/Math.max(1,ymax-ymin))));
    const grid=g.grid!==false;
    const W=(xmax-xmin)*s+pad*2,H=(ymax-ymin)*s+pad*2;
    const X=x=>Math.round((pad+(x-xmin)*s)*10)/10,Y=y=>Math.round((pad+(ymax-y)*s)*10)/10;
    const id='gsclip'+(++UID);
    const fsz=Math.max(15,Math.min(21,Math.round(s*0.6)));
    const L=(x1,y1,x2,y2,c,w,dash='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" ${dash?`stroke-dasharray="${dash}"`:''} stroke-linecap="square"/>`;
    let o=`<svg class="plane" viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" ${F}>`;
    o+=`<defs><clipPath id="${id}"><rect x="${X(xmin)-2}" y="${Y(ymax)-2}" width="${(xmax-xmin)*s+4}" height="${(ymax-ymin)*s+4}"/></clipPath></defs>`;
    o+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>`;
    if(grid){
      for(let i=xmin;i<=xmax;i++)o+=L(X(i),Y(ymin),X(i),Y(ymax),'#8d8d8d',1.3);
      for(let j=ymin;j<=ymax;j++)o+=L(X(xmin),Y(j),X(xmax),Y(j),'#8d8d8d',1.3);
    }
    /* 축 */
    o+=L(X(xmin)-14,Y(0),X(xmax)+14,Y(0),'#000',4)+L(X(0),Y(ymin)+14,X(0),Y(ymax)-14,'#000',4);
    o+=`<polygon points="${X(xmax)+20},${Y(0)} ${X(xmax)+7},${Y(0)-7} ${X(xmax)+7},${Y(0)+7}" fill="#000"/>`;
    o+=`<polygon points="${X(0)},${Y(ymax)-20} ${X(0)-7},${Y(ymax)-7} ${X(0)+7},${Y(ymax)-7}" fill="#000"/>`;
    o+=`<text x="${X(xmax)+24}" y="${Y(0)+9}" font-size="${fsz+4}" font-style="italic">x</text>`;
    o+=`<text x="${X(0)+11}" y="${Y(ymax)-22}" font-size="${fsz+4}" font-style="italic">y</text>`;
    /* 눈금 */
    if(g.ticks!==false){
      const step=(xmax-xmin)>14?2:1;
      for(let i=xmin;i<=xmax;i++){if(i===0||i%step)continue;o+=L(X(i),Y(0)-5,X(i),Y(0)+5,'#000',2.6);o+=`<text x="${X(i)}" y="${Y(0)+fsz+8}" font-size="${fsz}" text-anchor="middle">${i}</text>`;}
      for(let j=ymin;j<=ymax;j++){if(j===0||j%step)continue;o+=L(X(0)-5,Y(j),X(0)+5,Y(j),'#000',2.6);o+=`<text x="${X(0)-11}" y="${Y(j)+7}" font-size="${fsz}" text-anchor="end">${j}</text>`;}
    }
    o+=`<text x="${X(0)-5}" y="${Y(0)+fsz+8}" font-size="${fsz-2}" text-anchor="end">O</text>`;
    /* 요소 */
    let c='';
    for(const it of(items||[])){
      if(it.t==='fn'){
        const col=it.color||NAVY,w=it.width||(it.dash?2.6:4.2);
        const from=it.from!==undefined?it.from:xmin,to=it.to!==undefined?it.to:xmax;
        let d='',open=false;
        for(let k=0;k<=800;k++){const x=from+(to-from)*k/800,y=it.f(x);
          const ok=isFinite(y)&&!isNaN(y)&&y>=ymin-2&&y<=ymax+2;
          if(ok){d+=(open?' L ':' M ')+X(x)+' '+Y(y);open=true;}else open=false;}
        c+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" ${it.dash?`stroke-dasharray="${typeof it.dash==='string'?it.dash:'9 7'}"`:''}/>`;
      }
      else if(it.t==='circle'){c+=`<circle cx="${X(it.cx)}" cy="${Y(it.cy)}" r="${it.r*s}" fill="none" stroke="${it.color||NAVY}" stroke-width="${it.width||4}"/>`;}
      else if(it.t==='vline'){c+=L(X(it.x),Y(ymin),X(it.x),Y(ymax),it.color||RED,it.width||3,it.dash===undefined?'10 7':it.dash);
        if(it.label)c+=`<text x="${X(it.x)+8}" y="${Y(ymax)+fsz+4}" font-size="${fsz+1}" fill="${it.color||RED}" font-style="italic">${it.label}</text>`;}
      else if(it.t==='hline'){c+=L(X(xmin),Y(it.y),X(xmax),Y(it.y),it.color||RED,it.width||3,it.dash===undefined?'10 7':it.dash);
        if(it.label)c+=`<text x="${X(xmax)-8}" y="${Y(it.y)-8}" font-size="${fsz+1}" fill="${it.color||RED}" text-anchor="end" font-style="italic">${it.label}</text>`;}
      else if(it.t==='vdash'){c+=L(X(it.x),Y(ymin),X(it.x),Y(ymax),it.color||'#000',1.8,'7 6');}
      else if(it.t==='seg'){c+=L(X(it.x1),Y(it.y1),X(it.x2),Y(it.y2),it.color||NAVY,it.width||4,it.dash||'');}
      else if(it.t==='pt'){
        const col=it.color||RED;
        if(it.guide){
          c+=L(X(it.x),Y(0),X(it.x),Y(it.y),col,1.8,'6 5')+L(X(0),Y(it.y),X(it.x),Y(it.y),col,1.8,'6 5');
          if(!it.nolabel){
            if(it.x)c+=`<rect x="${X(it.x)-fsz*0.9}" y="${Y(0)+6}" width="${fsz*1.8}" height="${fsz+6}" fill="#fff"/><text x="${X(it.x)}" y="${Y(0)+fsz+8}" font-size="${fsz}" text-anchor="middle" fill="${col}" font-weight="700">${it.xl!==undefined?it.xl:nf(it.x)}</text>`;
            if(it.y)c+=`<rect x="${X(0)-fsz*2.2}" y="${Y(it.y)-fsz*0.7}" width="${fsz*2.1}" height="${fsz+4}" fill="#fff"/><text x="${X(0)-11}" y="${Y(it.y)+7}" font-size="${fsz}" text-anchor="end" fill="${col}" font-weight="700" ${it.yl!==undefined?'font-style="italic"':''}>${it.yl!==undefined?it.yl:nf(it.y)}</text>`;
          }
        }
        c+=`<circle cx="${X(it.x)}" cy="${Y(it.y)}" r="${it.r||7}" fill="${it.hollow?'#fff':col}" stroke="${col}" stroke-width="3.2"/>`;
        if(it.label){const dx=it.lx!==undefined?it.lx:12,dy=it.ly!==undefined?it.ly:-12;
          c+=`<text x="${X(it.x)+dx}" y="${Y(it.y)+dy}" font-size="${fsz+3}" fill="${col}" font-weight="700">${it.label}</text>`;}
      }
      else if(it.t==='text'){c+=`<text x="${X(it.x)}" y="${Y(it.y)}" font-size="${it.size||fsz}" fill="${it.color||'#111'}" text-anchor="${it.anchor||'start'}" ${it.italic?'font-style="italic"':''}>${it.s!==undefined?it.s:it.text}</text>`;}
      else if(it.t==='rangle'){const px=X(it.x),py=Y(it.y),k=9;const ux=it.u[0]*k,uy=-it.u[1]*k,vx=it.v[0]*k,vy=-it.v[1]*k;
        c+=`<path d="M ${px+ux} ${py+uy} L ${px+ux+vx} ${py+uy+vy} L ${px+vx} ${py+vy}" fill="none" stroke="#000" stroke-width="1.8"/>`;}
    }
    o+=`<g clip-path="url(#${id})">${c}</g></svg>`;
    return o;
  }

  /* 조립제법 표 */
  function synthSVG(k,coefs,products,bottom,hideR){
    const cols=coefs.length,cw=64,x0=70,W=x0+cw*cols+40,H=150;
    let o=`<svg class="fig-svg" viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" ${F} font-size="24">`;
    o+=`<rect x="1" y="1" width="${W-2}" height="${H-2}" fill="#fff" stroke="#000" stroke-width="2"/>`;
    o+=`<text x="34" y="42" text-anchor="middle">${k}</text><line x1="52" y1="22" x2="52" y2="70" stroke="#000" stroke-width="2"/>`;
    coefs.forEach((c,i)=>o+=`<text x="${x0+cw*i+cw/2}" y="42" text-anchor="middle">${c}</text>`);
    products.forEach((c,i)=>o+=`<text x="${x0+cw*(i+1)+cw/2}" y="80" text-anchor="middle">${c}</text>`);
    o+=`<line x1="${x0+8}" y1="96" x2="${x0+cw*cols}" y2="96" stroke="#000" stroke-width="2"/>`;
    bottom.forEach((c,i)=>{const last=i===cols-1;const t=(last&&hideR)?'<tspan font-style="italic">R</tspan>':c;
      o+=`<text x="${x0+cw*i+cw/2}" y="130" text-anchor="middle">${t}</text>`;
      if(last)o+=`<path d="M ${x0+cw*i+6} 104 L ${x0+cw*i+6} 142 L ${x0+cw*i+cw-6} 142" fill="none" stroke="#000" stroke-width="2"/>`;});
    return o+`</svg>`;
  }
  /* 수직선 (부등식의 해) */
  function numlineSVG(a,b,mode,closed){
    const W=380,H=70,x0=40,x1=340,y=44;const lo=Math.min(a,b),hi=Math.max(a,b),span=Math.max(hi-lo,1);
    const X=v=>x0+80+(v-lo)/span*140;
    let o=`<svg class="fig-svg" viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" ${F} font-size="20">`;
    const box=(xa,xb)=>`<rect x="${xa}" y="${y-22}" width="${xb-xa}" height="22" fill="#c9d6ea"/>`;
    if(mode==='in')o+=box(X(lo),X(hi));else o+=box(x0,X(lo))+box(X(hi),x1);
    o+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#000" stroke-width="2.4"/><polygon points="${x1+10},${y} ${x1-2},${y-6} ${x1-2},${y+6}" fill="#000"/><text x="${x1+14}" y="${y+7}" font-style="italic">x</text>`;
    const dot=v=>`<circle cx="${X(v)}" cy="${y}" r="5.5" fill="${closed?'#000':'#fff'}" stroke="#000" stroke-width="2"/><text x="${X(v)}" y="${y+24}" text-anchor="middle">${nf(v)}</text>`;
    return o+dot(lo)+dot(hi)+`</svg>`;
  }
  /* 내분점 수직선 */
  function divSVG(a,b,m,n,showP){
    const W=420,H=96,x0=50,x1=370,y=58;const X=t=>x0+30+t*(x1-x0-60);const P=m/(m+n);
    let o=`<svg class="fig-svg" viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" ${F} font-size="20">`;
    o+=`<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="#000" stroke-width="2.4"/><polygon points="${x1+10},${y} ${x1-2},${y-6} ${x1-2},${y+6}" fill="#000"/><text x="${x1+14}" y="${y+7}" font-style="italic">x</text>`;
    const dot=(t,top,bot,col)=>`<circle cx="${X(t)}" cy="${y}" r="5.5" fill="${col||'#000'}"/><text x="${X(t)}" y="${y-14}" text-anchor="middle" fill="${col||'#000'}">${top}</text><text x="${X(t)}" y="${y+26}" text-anchor="middle">${bot}</text>`;
    o+=dot(0,'A',nf(a))+dot(1,'B',nf(b))+dot(P,'P',showP!==undefined?nf(showP):'',RED);
    o+=`<path d="M ${X(0)+4} ${y-30} Q ${(X(0)+X(P))/2} ${y-48} ${X(P)-4} ${y-30}" fill="none" stroke="#000" stroke-width="1.6"/><text x="${(X(0)+X(P))/2}" y="${y-44}" text-anchor="middle">${nf(m)}</text>`;
    o+=`<path d="M ${X(P)+4} ${y-30} Q ${(X(P)+X(1))/2} ${y-48} ${X(1)-4} ${y-30}" fill="none" stroke="#000" stroke-width="1.6"/><text x="${(X(P)+X(1))/2}" y="${y-44}" text-anchor="middle">${nf(n)}</text>`;
    return o+`</svg>`;
  }
  /* 함수 사상도 */
  function mapSVG(sets,maps){
    const n=sets.length,cw=150,W=cw*n+40,H=70+Math.max(...sets.map(s=>s.items.length))*44+20;
    let o=`<svg class="fig-svg" viewBox="0 0 ${W} ${H}" width="${W}" xmlns="http://www.w3.org/2000/svg" ${F} font-size="22">`;
    const pos=(si,ei)=>({x:40+cw*si,y:70+ei*44});
    sets.forEach((st,si)=>{const cx=40+cw*si;o+=`<ellipse cx="${cx}" cy="${70+(st.items.length-1)*22}" rx="34" ry="${st.items.length*24+8}" fill="none" stroke="#000" stroke-width="2"/>`;
      o+=`<text x="${cx}" y="28" text-anchor="middle" font-style="italic">${st.name}</text>`;
      st.items.forEach((it,ei)=>{const p=pos(si,ei);o+=`<circle cx="${p.x}" cy="${p.y}" r="3" fill="#000"/><text x="${p.x-10}" y="${p.y+8}" text-anchor="end">${it}</text>`;});});
    maps.forEach((m,mi)=>{const s1=sets[mi],s2=sets[mi+1];const mx=40+cw*mi+cw/2;
      o+=`<text x="${mx}" y="28" text-anchor="middle" font-style="italic">${m.name}</text>`;
      m.pairs.forEach(([a,b])=>{const i=s1.items.indexOf(a),j=s2.items.indexOf(b);if(i<0||j<0)return;const p=pos(mi,i),q=pos(mi+1,j);
        o+=`<line x1="${p.x+6}" y1="${p.y}" x2="${q.x-8}" y2="${q.y}" stroke="#000" stroke-width="1.8"/><polygon points="${q.x-6},${q.y} ${q.x-16},${q.y-5} ${q.x-16},${q.y+5}" fill="#000" transform="rotate(${Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI} ${q.x-6} ${q.y})"/>`;});});
    return o+`</svg>`;
  }

  /* =====================================================================
     KaTeX 렌더 (없으면 잠시 후 재시도)
     ===================================================================== */
  function renderTex(root,tries){
    if(!root)return;
    if(typeof window.katex==='undefined'){if((tries||0)<40)setTimeout(()=>renderTex(root,(tries||0)+1),150);return;}
    root.querySelectorAll('.tx[data-tex]').forEach(el=>{
      try{window.katex.render(el.dataset.tex,el,{throwOnError:false,displayMode:false});}
      catch(e){el.textContent=el.dataset.tex;}
    });
  }

  /* =====================================================================
     HTML 템플릿
     ===================================================================== */
  function conceptHTML(unit){
    const body=Array.isArray(unit.concept)?`<ul>${unit.concept.map(c=>`<li>${c}</li>`).join('')}</ul>`:unit.concept;
    return`<span class="cap">먼저 이것만 기억해요</span>${body}`;
  }
  /* 문제 카드 안쪽 HTML.  idx 0 = 예제(풀이 공개), 그 외 = 실전(풀이는 ansOnly) */
  function probHTML(unit,params,idx,no,opts){
    let r;
    try{r=unit.build(params);}catch(e){r={err:'문제를 만들 수 없는 조건입니다. 숫자를 바꿔 주세요.'};}
    if(!r||r.err)return`<div class="gen err">⚠️ ${r&&r.err||'조건 오류'}</div>`;
    const isEx=idx===0;
    const one=r.layout?r.layout==='one':(!r.raw&&r.choices.every(c=>String(c).length<=4));
    const sol=Array.isArray(r.sol)?r.sol.map(s=>`<p>${s}</p>`).join(''):r.sol;
    const ansBody=r.answerRaw!==undefined?r.answerRaw:tex(r.answerTex!==undefined?r.answerTex:String(r.choices[r.ans]));
    return`<div class="gen">
      <div class="qtext"><span class="qno">${isEx?'예제':no}</span>${r.q}</div>
      ${r.figure||''}
      ${choicesHTML(r.choices,one,r.raw)}
      ${isEx?'':'<div class="blank">풀이 &amp; 답 :</div>'}
      <div class="sol${isEx?'':' ansOnly'}"><b>${isEx?'함께 풀어봅시다':'풀이'}</b>${sol}</div>
      <div class="ans${isEx?'':' ansOnly'}">정답 &nbsp; <span class="ansIdx">${CIRC[r.ans]}</span> ${ansBody}</div>
    </div>`;
  }

  /* 학습지 본문(.gsheet 내부) 전체 — groups:[{unit, recs:[{idx,params,override,no}]}] */
  function bodyHTML(cfg,groups){
    let h=`<h1>${esc(cfg.title||'고졸 검정고시 수학 · 만능 학습지')}</h1>`;
    if(cfg.subtitle)h+=`<p class="sub">${esc(cfg.subtitle)}</p>`;
    h+=`<div class="namebox"><span>이름 : ______________</span><span>날짜 : ______ 월 ______ 일</span></div>`;
    if(cfg.intro!==false)h+=`<div class="card concept intro"><span class="cap">이 학습지를 쓰는 방법</span><ul>
      <li>유형마다 <b>[개념] → [예제] → [실전 문제]</b> 순서로 갑니다. 개념은 한 줄만 외우면 됩니다.</li>
      <li>좌표평면 문제는 <b>x축·y축의 눈금을 먼저 손가락으로 짚고</b>, 점의 자리를 읽는 것부터 시작합니다.</li>
      <li>대칭이동은 <b>종이접기</b>, 평행이동은 <b>밀기</b>. 이 두 마디만 기억해도 절반은 끝납니다.</li>
      <li>실전 문제는 시험지와 똑같은 모양입니다. 답을 고르고, 점선 상자에 풀이를 써 보세요.</li></ul></div>`;
    groups.forEach(gr=>{
      const u=gr.unit;
      h+=`<h2 id="${u.id}">${u.tag}. ${esc(u.title)}<small>${u.src||''}</small></h2>`;
      if(cfg.includeConcept!==false)h+=`<div class="card concept">${conceptHTML(u)}</div>`;
      const ex=gr.recs.filter(r=>r.idx===0),qs=gr.recs.filter(r=>r.idx!==0);
      ex.forEach(r=>{h+=`<h3>풀이 예시</h3><div class="card ex">${r.override||probHTML(u,r.params,0,'예제')}</div>`;});
      if(qs.length){h+=`<h3>실전 문제</h3><div class="qgrid">`;qs.forEach(r=>{h+=`<div class="card">${r.override||probHTML(u,r.params,r.idx,r.no)}</div>`;});h+=`</div>`;}
    });
    return h;
  }

  /* 독립 문서(새 탭 / 인쇄창) 전체 HTML */

      <button id="btnAns" class="${cfg.showAns?'on':''}">${cfg.showAns?'정답 숨기기':'정답 보이기'}</button>
      <button id="btnCols" class="${cfg.cols2?'on':''}">실전문제 2단</button>
      <button id="btnPrint">🖨️ 인쇄 / PDF 저장</button>
      <span class="hint">인쇄창에서 "PDF로 저장"을 고르면 PDF 파일로 남길 수 있습니다.</span>

    const script=`
      var sh=document.querySelector('.gsheet');

      rt();
      document.getElementById('fsRange').oninput=function(e){sh.style.setProperty('--fs',e.target.value+'px');document.getElementById('fsVal').textContent=e.target.value+'px';};
      document.getElementById('btnAns').onclick=function(){var on=sh.classList.toggle('noans');this.classList.toggle('on',!on);this.textContent=on?'정답 보이기':'정답 숨기기';};
      document.getElementById('btnCols').onclick=function(){var on=sh.classList.toggle('cols2');this.classList.toggle('on',on);};
      document.getElementById('btnPrint').onclick=function(){window.print();};`;
    return`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>${title}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"><${'/'}script>
<style>
html,body{margin:0;padding:0;background:#dfe4ea}
#gsbar{position:sticky;top:0;z-index:50;background:#123a6b;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:15px;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
#gsbar b{font-size:17px;margin-right:6px}
#gsbar button{font-family:inherit;font-size:15px;padding:7px 14px;border:0;border-radius:10px;background:#ffd45e;color:#123a6b;cursor:pointer;font-weight:700}
#gsbar button.on{background:#8ef0b0}
#gsbar .g{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);padding:5px 12px;border-radius:10px}
#gsbar .hint{font-size:13px;opacity:.85}
.wrap{padding:22px 12px 80px}
${SHEET_CSS}
@media print{@page{size:A4;margin:12mm}html,body{background:#fff!important}#gsbar{display:none!important}.wrap{padding:0}}
</style></head><body>${bar}<div class="wrap"><div class="${cls}" style="--fs:${cfg.fs||24}px">${bodyHTML(cfg,groups)}</div></div>
<script>${script}<${'/'}script></body></html>`;
  }

    numChoices,stepChoices,pickChoices,coordChoices,choicesHTML,
    planeSVG,synthSVG,numlineSVG,divSVG,mapSVG,renderTex,conceptHTML,probHTML,bodyHTML,docHTML,SHEET_CSS,
    NAVY,RED,GREEN,GREY};
})();

/* =====================================================================
   만능 학습지 — 유형별 문제 엔진 (GED_AREAS / GED_UNITS)
   각 유형(unit) :
     id, tag(시험 문항 번호), area, title, src(출제 근거), coord(좌표 중심 유형 ★)
     concept : [li html...]        fields : [{k,label,min,max}|{k,label,sel:[...]}]
     def : 예제용 기본 조건          rand() : 실전용 무작위 조건
     build(p) : {q, figure?, choices, raw?, layout?, ans, answerTex|answerRaw, sol:[p...]} | {err}
   ===================================================================== */
var GED_AREAS=[
  {k:'C0',title:'좌표 기초 워밍업',desc:'좌표 읽기 · 사분면 · 직선의 그래프'},
  {k:'A', title:'영역 A · 다항식과 복소수',desc:'1번~5번'},
  {k:'B', title:'영역 B · 방정식과 부등식',desc:'6번~9번'},
  {k:'C', title:'영역 C · 도형의 방정식 (좌표평면)',desc:'10번~14번'},
  {k:'D', title:'영역 D · 집합 · 명제 · 함수',desc:'15번~18번'},
  {k:'E', title:'영역 E · 경우의 수',desc:'19번~20번'}
];

var GED_UNITS=(function(){
  const{nf,par,xm,ym,tail,tex,pr,rnd,pick,nz,CIRC,sqrtTex,sqrtTxt,shuffle,shuffleWith,mulberry,term,poly,
    numChoices,stepChoices,pickChoices,coordChoices,planeSVG,synthSVG,numlineSVG,divSVG,mapSVG,NAVY,RED,GREEN,GREY}=GS;
  const fig=svg=>`<div class="fig">${svg}</div>`;
  const quadName=(x,y)=>x>0&&y>0?1:(x<0&&y>0?2:(x<0&&y<0?3:(x>0&&y<0?4:0)));
  const lineTex=(a,b)=>`y=${a===1?'':(a===-1?'-':nf(a))}x${tail(b)}`;

  return[
  /* ================================================================
     C0. 좌표 기초 워밍업 (좌표 중심 ★)
     ================================================================ */
  { id:'c1', tag:'기초 1', area:'C0', title:'좌표평면 위의 점 읽기', src:'모든 좌표 문제의 출발점', coord:true,
    concept:[
      '좌표는 <b>(가로, 세로)</b> 순서입니다. 항상 <b>x가 먼저, y가 나중</b>입니다.',
      '점에서 <b>x축으로 수직으로 내려가</b> 만나는 눈금이 x좌표, <b>y축으로 수평으로 가서</b> 만나는 눈금이 y좌표입니다.',
      '오른쪽·위쪽은 양수(+), 왼쪽·아래쪽은 음수(−)입니다.',
      '손가락으로 점선을 따라 축까지 짚어 보면 절대 틀리지 않습니다.'],
    fields:[{k:'x',label:'점의 x',min:-5,max:5},{k:'y',label:'점의 y',min:-5,max:5}],
    def:{x:3,y:2},
    rand(){return{x:nz(-5,5),y:nz(-5,5)};},
    build(p){
      const ch=coordChoices(p.x,p.y);
      const q=`그림과 같이 좌표평면 위에 점 ${tex('\\mathrm{P}')}가 있다. 점 ${tex('\\mathrm{P}')}의 좌표는?`;
      const figure=fig(planeSVG({xmin:-6,xmax:6,ymin:-6,ymax:6,s:34},[{t:'pt',x:p.x,y:p.y,label:'P',guide:true,nolabel:true,r:8}]));
      const sol=[
        `점 P에서 <b>아래(또는 위)로 곧게</b> 내려가 x축과 만나는 눈금을 읽습니다 → ${tex(nf(p.x))}`,
        `점 P에서 <b>옆으로 곧게</b> 가서 y축과 만나는 눈금을 읽습니다 → ${tex(nf(p.y))}`,
        `(x, y) 순서로 쓰면 ${tex(`\\mathrm{P}${pr(p.x,p.y)}`)} 입니다.`];
      return{q,figure,choices:ch.list,ans:ch.ans,sol,answerTex:pr(p.x,p.y),layout:'one'};
    }
  },
  { id:'c2', tag:'기초 2', area:'C0', title:'사분면과 부호', src:'대칭이동(14번)의 밑바탕', coord:true,
    concept:[
      '좌표평면은 두 축이 네 칸으로 나눕니다. 오른쪽 위부터 <b>시계 반대 방향</b>으로 제1 → 제2 → 제3 → 제4사분면입니다.',
      '제1사분면 (+, +) · 제2사분면 (−, +) · 제3사분면 (−, −) · 제4사분면 (+, −)',
      'x축 대칭은 y의 부호만, y축 대칭은 x의 부호만, 원점 대칭은 둘 다 바뀝니다.',
      '축 위의 점(x=0 또는 y=0)은 어느 사분면에도 속하지 않습니다.'],
    fields:[{k:'x',label:'점의 x',min:-5,max:5},{k:'y',label:'점의 y',min:-5,max:5},{k:'kind',label:'움직임',sel:['그대로','x축 대칭','y축 대칭','원점 대칭']}],
    def:{x:-3,y:2,kind:'그대로'},
    rand(){return{x:nz(-5,5),y:nz(-5,5),kind:pick(['그대로','그대로','x축 대칭','y축 대칭','원점 대칭'])};},
    build(p){
      if(p.x===0||p.y===0)return{err:'축 위의 점은 사분면에 속하지 않습니다. 0이 아닌 수를 넣어 주세요.'};
      let X=p.x,Y=p.y,how='';
      if(p.kind==='x축 대칭'){Y=-p.y;how='x축 대칭은 y의 부호만 바꿉니다.';}
      else if(p.kind==='y축 대칭'){X=-p.x;how='y축 대칭은 x의 부호만 바꿉니다.';}
      else if(p.kind==='원점 대칭'){X=-p.x;Y=-p.y;how='원점 대칭은 x, y 둘 다 부호를 바꿉니다.';}
      const qn=quadName(X,Y);
      const names=['제1사분면','제2사분면','제3사분면','제4사분면'];
      const q=p.kind==='그대로'
        ?`점 ${tex(pr(p.x,p.y))}은 제몇 사분면 위의 점인가?`
        :`점 ${tex(pr(p.x,p.y))}을 <b>${p.kind}</b>이동한 점은 제몇 사분면 위의 점인가?`;
      const items=[{t:'text',x:2.2,y:2.8,s:'제1',size:22,color:'#888'},{t:'text',x:-3.6,y:2.8,s:'제2',size:22,color:'#888'},{t:'text',x:-3.6,y:-3.2,s:'제3',size:22,color:'#888'},{t:'text',x:2.2,y:-3.2,s:'제4',size:22,color:'#888'},
        {t:'pt',x:p.x,y:p.y,label:'P',guide:true,r:8}];
      const figure=fig(planeSVG({xmin:-6,xmax:6,ymin:-6,ymax:6,s:32},items));
      const sol=[
        `점 P${tex(pr(p.x,p.y))}의 부호는 (${p.x>0?'+':'−'}, ${p.y>0?'+':'−'}) 입니다.`,
        ...(how?[how+` → ${tex(pr(X,Y))}, 부호는 (${X>0?'+':'−'}, ${Y>0?'+':'−'})`]:[]),
        `(${X>0?'+':'−'}, ${Y>0?'+':'−'}) 는 <b>${names[qn-1]}</b>입니다.`];
      return{q,figure,choices:names,raw:true,layout:'two',ans:qn-1,sol,answerRaw:names[qn-1]};
    }
  },
  { id:'c3', tag:'기초 3', area:'C0', title:'직선의 그래프 읽기 (기울기와 y절편)', src:'12번 직선의 방정식 밑바탕', coord:true,
    concept:[
      `직선 ${tex('y=ax+b')}은 <b>y = (기울기)x + (y절편)</b> 모양입니다.`,
      '<b>y절편 b</b> = 직선이 y축과 만나는 눈금. 그래프에서 바로 읽습니다.',

  { id:'u1', tag:'1번', area:'A', title:'다항식의 계산', src:'2023~2026 매회 1번',

  { id:'u2', tag:'2번', area:'A', title:'항등식', src:'2023~2026 매회 2번',

  { id:'u3', tag:'3번', area:'A', title:'나머지정리 · 조립제법', src:'2023~2026 매회 3번',
    concept:[
      `조립제법은 '내려쓰고 → 곱하고 → 더하고'를 반복하는 박자 놀이입니다.`,

      `맨 위 줄에는 다항식의 계수를 차례로 적습니다. 빠진 차수가 있으면 그 자리에 0을 씁니다.`,

    fields:[{k:'k',label:'나누는 수 k (x−k)',min:-3,max:3},{k:'b',label:'x² 계수',min:-5,max:5},{k:'c',label:'x 계수',min:-6,max:6},{k:'d',label:'상수항',min:-6,max:6}],

      const figure=fig(synthSVG(nf(p.k),[1,p.b,p.c,p.d].map(nf),products.map(nf),[1,q2,q3,R].map(nf),true));

/* --------------------------------------------------------------------

   앱 진입점에서 사용

function DarkToggle({className}){
  const[dark,setDark]=React.useState(()=>typeof document!=='undefined'&&document.body.classList.contains('dark'));
  const toggle=()=>{
    const next=!dark;
    setDark(next);
    document.body.classList.toggle('dark',next);
    try{localStorage.setItem('yakHakTheme',next?'dark':'light');}catch(e){}
  };
  return(<button onClick={toggle} aria-label="다크 모드 전환" title="다크/라이트 모드" className={`dark-toggle ${className||''}`}>{dark?'☀️':'🌙'}</button>);
}

function AuthScreen({onLogin}){
  const[name,setName]=useState('');const[pin,setPin]=useState('');const[pinC,setPinC]=useState('');
  const[isReg,setIsReg]=useState(false);const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const handle=async()=>{
    if(!name.trim()||pin.length!==4){setErr('이름과 4자리 PIN을 모두 입력해주세요.');return}
    setLoading(true);setErr('');
    try{
      const doc=await db.collection('users').doc(name.trim()).get();
      if(isReg){
        if(pin!==pinC){setErr('PIN 번호가 서로 다릅니다.');setLoading(false);return}
        if(doc.exists){setErr('이미 같은 이름의 계정이 있습니다. 혹시 본인 계정인지 다시 확인해보시고, 이미 계정이 있으시면 로그인을 해주세요.');setLoading(false);return}
        const isAdmin=ADMIN_NAMES.includes(name.trim());
        const userData={name:name.trim(),pin,role:isAdmin?'admin':'student',createdAt:todayStr(),lastLoginAt:`${todayStr()} ${timeStr()}`,totalLessons:0,todayLessons:0,todayCorrect:0,todayWrong:0,lastDate:todayStr(),activeDates:[],logs:[],currentWeekStart:getKSTMonday(),stampArchive:[],goal:3,ver:0,rangeMin:10,rangeMax:99,divRangeMin:10,divRangeMax:99};
        await db.collection('users').doc(name.trim()).set(userData);
        onLogin(userData);
      }else{
        if(!doc.exists){setErr('등록되지 않은 이름입니다. 가입하기를 눌러주세요.');setLoading(false);return}
        const data=doc.data();
        if(data.pin!==pin){setErr('PIN 번호가 올바르지 않습니다.');setLoading(false);return}
        // Check new day
        const data2={...data};if(data2.lastDate!==todayStr()){data2.todayLessons=0;data2.todayCorrect=0;data2.todayWrong=0;data2.lastDate=todayStr()}
	data2.lastLoginAt=`${todayStr()} ${timeStr()}`; // 로그인 시 항상 갱신
        const curMon=getKSTMonday();if(!data2.currentWeekStart)data2.currentWeekStart=curMon;
        else if(data2.currentWeekStart!==curMon){if(!data2.stampArchive)data2.stampArchive=[];const oldDates=(data2.activeDates||[]).filter(d=>d>=data2.currentWeekStart&&d<curMon);if(oldDates.length>0)data2.stampArchive.unshift({weekStart:data2.currentWeekStart,activeDates:oldDates});data2.currentWeekStart=curMon}
        await saveUser(data2);onLogin(data2);
      }
    }catch(e){setErr('서버 연결 오류. 인터넷 연결을 확인해주세요.')}
    setLoading(false);
  };
  return(<div className="min-h-screen bg-gradient-to-br from-indigo-100 via-blue-50 to-purple-100 flex items-center justify-center p-5">
    <div className="fixed top-4 right-4 z-30"><DarkToggle/></div>
    <div className="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-sm">
      <div className="text-center mb-8"><div className="text-7xl mb-3">🎓</div>
        <h1 className="text-3xl font-black text-gray-800">태청야학 수학반</h1>
        <p className="text-gray-500 text-base mt-2">배움엔 나이가 없어요!</p></div>
      <div className="space-y-5">
        <div><label className="block text-lg font-bold text-gray-700 mb-2">이름</label>
          <input type="text" lang="ko" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handle()}
            className="w-full border-2 border-gray-200 rounded-2xl px-5 py-4 text-xl font-bold focus:border-blue-400 outline-none" placeholder="예: 홍길동"/></div>
        <div><label className="block text-lg font-bold text-gray-700 mb-2">PIN 번호 (숫자 4자리)</label>
          <input type="number" value={pin} onChange={e=>setPin(e.target.value.slice(0,4))} onKeyDown={e=>e.key==='Enter'&&handle()}
            className="w-full border-2 border-gray-200 rounded-2xl px-5 py-4 text-2xl font-black text-center tracking-widest focus:border-blue-400 outline-none" placeholder="0 0 0 0"/></div>
        {isReg&&<div><label className="block text-lg font-bold text-gray-700 mb-2">PIN 확인</label>
          <input type="number" value={pinC} onChange={e=>setPinC(e.target.value.slice(0,4))} onKeyDown={e=>e.key==='Enter'&&handle()}
            className="w-full border-2 border-gray-200 rounded-2xl px-5 py-4 text-2xl font-black text-center tracking-widest focus:border-blue-400 outline-none" placeholder="0 0 0 0"/></div>}
        {err&&<div className="bg-red-50 text-red-600 rounded-2xl px-5 py-3 text-base font-bold border border-red-200">{err}</div>}
        <button onClick={handle} disabled={loading} className="w-full py-5 bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-2xl text-xl font-black shadow-lg active:scale-95 transition-transform">
          {loading?'처리 중...':(isReg?'✅ 가입하기':'→ 로그인')}</button>
        <button onClick={()=>{setIsReg(!isReg);setErr('')}} className="w-full py-3 text-gray-500 font-bold text-base">
          {isReg?'이미 계정이 있어요 → 로그인':'처음이에요 → 새로 가입하기'}</button>
      </div>
    </div>
  </div>);
}

function QuoteSplash({onDone}){
  const DURATION=4500;
  // 접속할 때마다 다음 글귀가 나오도록 인덱스 회전
  const startIdx=React.useRef((()=>{
    let i=0;try{i=parseInt(localStorage.getItem('yakHakQuoteIdx')||'0',10)||0;}catch(e){}
    i=((i%LEARN_QUOTES.length)+LEARN_QUOTES.length)%LEARN_QUOTES.length;
    try{localStorage.setItem('yakHakQuoteIdx',String((i+1)%LEARN_QUOTES.length));}catch(e){}
    return i;
  })()).current;
  const quoteEntry=LEARN_QUOTES[startIdx];
  const quote=typeof quoteEntry==='string'?quoteEntry:quoteEntry.text;
  const quoteAuthor=typeof quoteEntry==='string'?'태청야학 수학반':quoteEntry.author;
  const bg=QUOTE_BGS[startIdx%QUOTE_BGS.length];
  const cardRef=React.useRef();
  const[pct,setPct]=React.useState(100);
  const[paused,setPaused]=React.useState(false);
  const[saving,setSaving]=React.useState(false);
  const elapsedRef=React.useRef(0);
  const lastRef=React.useRef(Date.now());
  const doneRef=React.useRef(false);

  React.useEffect(()=>{
    lastRef.current=Date.now();
    let raf;
    const tick=()=>{
      const now=Date.now();
      if(!paused){
        elapsedRef.current += now-lastRef.current;
        const p=Math.max(0,100-(elapsedRef.current/DURATION)*100);
        setPct(p);
        if(elapsedRef.current>=DURATION&&!doneRef.current){doneRef.current=true;onDone();return;}
      }
      lastRef.current=now;
      raf=requestAnimationFrame(tick);
    };
    raf=requestAnimationFrame(tick);
    return()=>cancelAnimationFrame(raf);
  },[paused]);

  const finish=()=>{if(!doneRef.current){doneRef.current=true;onDone();}};

  const capture=async()=>{
    if(typeof html2canvas==='undefined'){alert('스크린샷으로 간직해 주세요!');return;}
    setSaving(true);setPaused(true);
    try{
      const canvas=await html2canvas(cardRef.current,{backgroundColor:null,scale:2,useCORS:true});
      const link=document.createElement('a');
      link.download='태청야학_오늘의_글귀.png';
      link.href=canvas.toDataURL('image/png');
      link.click();
    }catch(e){alert('이미지 저장에 실패했어요. 화면을 스크린샷으로 간직해 주세요!');}
    setSaving(false);setPaused(false);
  };

  const stop=e=>{e.stopPropagation();};

  return(
    <div
      onPointerDown={()=>setPaused(true)}
      onPointerUp={()=>setPaused(false)}
      onPointerLeave={()=>setPaused(false)}
      onPointerCancel={()=>setPaused(false)}
      style={{position:'fixed',inset:0,zIndex:9999,background:bg,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'28px',touchAction:'none',userSelect:'none'}}>
      {/* 진행 바 */}
      <div style={{position:'absolute',top:0,left:0,right:0,height:'4px',background:'rgba(255,255,255,0.25)'}}>
        <div style={{height:'100%',width:pct+'%',background:'rgba(255,255,255,0.9)',transition:'width .1s linear'}}/>
      </div>

      {/* 글귀 카드 (캡쳐 대상) */}
      <div ref={cardRef} style={{background:bg,borderRadius:'28px',padding:'40px 28px',maxWidth:'440px',width:'100%',textAlign:'center',boxShadow:'0 20px 60px rgba(0,0,0,0.25)'}}>
        <div style={{fontSize:'40px',marginBottom:'18px'}}>🎓</div>
        <div style={{fontSize:'15px',fontWeight:800,color:'rgba(255,255,255,0.85)',letterSpacing:'0.05em',marginBottom:'18px'}}>오늘의 배움 한 줄</div>
        <p style={{fontSize:'24px',lineHeight:1.55,fontWeight:900,color:'#fff',wordBreak:'keep-all',textShadow:'0 2px 12px rgba(0,0,0,0.22)',margin:0}}>{quote}</p>
        <div style={{marginTop:'26px',fontSize:'13px',fontWeight:700,color:'rgba(255,255,255,0.8)'}}>— {quoteAuthor} —</div>
      </div>

      {/* 안내 + 버튼 (캡쳐 영역 밖) */}
      <div style={{marginTop:'22px',display:'flex',flexDirection:'column',alignItems:'center',gap:'12px',width:'100%',maxWidth:'440px'}}>
        <div style={{fontSize:'13px',fontWeight:700,color:'rgba(255,255,255,0.9)',height:'18px'}}>
          {paused?'⏸ 잠시 멈췄어요 (손을 떼면 다시 진행돼요)':'화면을 꾹 누르면 멈춰서 더 오래 볼 수 있어요'}
        </div>
        <div style={{display:'flex',gap:'10px',width:'100%'}}>
          <button onPointerDown={stop} onClick={capture} disabled={saving}
            style={{flex:1,padding:'14px',borderRadius:'16px',background:'rgba(255,255,255,0.95)',color:'#444',fontWeight:900,fontSize:'15px'}}>
            {saving?'저장 중...':'📸 글귀 간직하기'}
          </button>
          <button onPointerDown={stop} onClick={finish}
            style={{flex:1,padding:'14px',borderRadius:'16px',background:'rgba(0,0,0,0.22)',color:'#fff',fontWeight:900,fontSize:'15px'}}>
            들어가기 →
          </button>
        </div>
      </div>
    </div>
  );
}

// === js/ui/sessionPrint.js ===
/* --------------------------------------------------------------------
   회차(세션) 인쇄·PDF 모달
   학생 기록 화면과 선생님 모드에서 공용 사용
   -------------------------------------------------------------------- */

/* ═══════════════════════════════════════════════════════════
   회차(세션) 문제 + 정답 + 해설 인쇄/PDF 모달
   - 학생 기록·선생님 모드에서 공용 사용
   - 선생님 코멘트·해설 수정 기능 포함 ($ 수식 $ 지원)
   ═══════════════════════════════════════════════════════════ */
function SessionPrintModal({log,studentName,studentId,onClose}){
  if(!log)return null;
  const ORD=['①','②','③','④','⑤'];
  const qs=log.questions||[];
  const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // 세션 고유 ID: Firestore에 편집 내용 저장/로드에 사용
  const sessionId=studentId
    ?`${studentId}_${(log.date||'nd')}_${(log.time||'').replace(/[^0-9]/g,'')}`
    :null;

  const[topicOverrides,setTopicOverrides]=useState({});
  const[overrideSaved,setOverrideSaved]=useState({});
  const[savedEditsMap,setSavedEditsMap]=useState({});
  const[sessionLoaded,setSessionLoaded]=useState(false);
  const[corrected,setCorrected]=useState({});
  const[printCols,setPrintCols]=useState(1);

  const[edits,setEdits]=useState(()=>{
    const init={};
    qs.forEach((q,i)=>{
      const solDefault=Array.isArray(q.sol)&&q.sol.length?q.sol.join('\n'):(q.explanation||'');
      init[i]={solText:solDefault,comment:'',editing:false,overrideApplied:false};
    });
    return init;
  });

  // 1단계: 이 세션에 저장된 편집 내용 + 오답 수정 체크 로드
  useEffect(()=>{
    if(!sessionId){setSessionLoaded(true);return;}
    db.collection('sessionEdits').doc(sessionId).get()
      .then(snap=>{
        if(snap.exists){
          const data=snap.data()||{};
          const map={};const corr={};
          qs.forEach((_,i)=>{
            if(data[`q${i}`])map[i]=data[`q${i}`];
            if(data[`corrected_q${i}`])corr[i]=true;
          });
          setSavedEditsMap(map);
          setCorrected(corr);
          setEdits(prev=>{
            const updated={...prev};
            Object.entries(map).forEach(([idx,saved])=>{
              const i=Number(idx);
              updated[i]={...updated[i],...saved};
            });
            return updated;
          });
        }
        setSessionLoaded(true);
      })
      .catch(()=>setSessionLoaded(true));
  },[sessionId]);

  // 2단계: 세션 편집 로드 완료 후 topic 오버라이드 로드
  useEffect(()=>{
    if(!sessionLoaded)return;
    db.collection('teacherSettings').doc('explanationOverrides').get()
      .then(snap=>{if(snap.exists)setTopicOverrides(snap.data()||{});})
      .catch(()=>{});
  },[sessionLoaded]);

  // topic 오버라이드를 세션 편집이 없는 문제에만 적용
  // 우선순위: ①이 문제 자체의 sol(정확한 값) ②그래프에서 재생성 ③저장된 틀 텍스트
  // comment는 다음 문제에 전파하지 않음 (각 문제별 선생님 코멘트와 별개)
  useEffect(()=>{
    if(Object.keys(topicOverrides).length===0)return;
    setEdits(prev=>{
      const updated={...prev};
      qs.forEach((q,i)=>{
        if(savedEditsMap[i])return;
        const topic=String(q.topic||q.meta?.type||'');
        const override=topicOverrides[topic];
        if(!override)return;
        const generatedSol=genSolFromGraph(q);
        const storedSol=typeof override==='object'?(override.solText||''):override;
        const solText=generatedSol||storedSol;
        if(solText){
          updated[i]={...updated[i],solText,overrideApplied:true};
        }
      });
      return updated;
    });
  },[topicOverrides]);

  const setEdit=(i,field,val)=>setEdits(prev=>({...prev,[i]:{...prev[i],[field]:val}}));

  // 편집 패널 닫을 때 Firestore에 저장
  const saveSessionEdit=async(i)=>{
    if(!sessionId)return;
    const e=edits[i]||{};
    try{
      await db.collection('sessionEdits').doc(sessionId).set(
        {[`q${i}`]:{solText:e.solText||'',comment:e.comment||''},updatedAt:Date.now()},
        {merge:true}
      );
      setSavedEditsMap(prev=>({...prev,[i]:{solText:e.solText||'',comment:e.comment||''}}));
    }catch(err){
      alert('세션 저장 실패: '+err.message);
    }
  };

  const toggleEditing=(i)=>{
    const e=edits[i]||{};
    if(e.editing)saveSessionEdit(i);
    setEdits(prev=>({...prev,[i]:{...prev[i],editing:!prev[i]?.editing}}));
  };

  // 다음 해설에 반영: 해설 풀이 틀(solText)만 저장, 코멘트는 전파하지 않음
  const saveOverride=async(i)=>{
    const q=qs[i];
    const e=edits[i]||{};
    const solText=e.solText||'';
    if(!solText.trim()){alert('해설(풀이 과정)을 먼저 입력해주세요.\n코멘트는 다음 문제에 반영되지 않습니다.');return;}
    const topic=String(q.topic||q.meta?.type||'');
    if(!topic){alert('이 문제에는 topic 정보가 없어 저장할 수 없습니다.');return;}
    try{
      await saveSessionEdit(i);
      // comment는 포함하지 않음 — 해설 풀이 틀(solText)만 다음 문제에 반영
      const overrideVal={solText,graphType:q.graph?.type||null,questionRef:q.q||q.qTxt||'',updatedAt:Date.now()};
      await db.collection('teacherSettings').doc('explanationOverrides').set(
        {[topic]:overrideVal,updatedAt:Date.now()},{merge:true}
      );
      setTopicOverrides(prev=>({...prev,[topic]:overrideVal}));
      setOverrideSaved(prev=>({...prev,[i]:true}));
      setTimeout(()=>setOverrideSaved(prev=>({...prev,[i]:false})),2500);
    }catch(err){alert('저장 실패: '+err.message);}
  };

  const renderMathHtml=txt=>{
    if(!txt)return'';
    // 마크다운 인라인 서식 적용 (HTML 이스케이프 후 적용하므로 안전)
    const applyMd=s=>s
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/\*(.+?)\*/g,'<em>$1</em>')
      .replace(/__(.+?)__/g,'<strong>$1</strong>')
      .replace(/_(.+?)_/g,'<em>$1</em>')
      .replace(/~~(.+?)~~/g,'<del>$1</del>');
    const result=[];
    const s=String(txt);
    const re=/(\$\$[\s\S]*?\$\$|\$[^\$\n]+\$)/g;
    let lastIdx=0,m;
    while((m=re.exec(s))!==null){
      if(m.index>lastIdx)result.push(applyMd(esc(s.slice(lastIdx,m.index))));
      const token=m[1];
      const isDisplay=token.startsWith('$$');
      const inner=isDisplay?token.slice(2,-2).trim():token.slice(1,-1);
      try{
        const rendered=window.katex
          ?window.katex.renderToString(inner,{throwOnError:false,displayMode:isDisplay,strict:false,output:'mathml'})
          :isDisplay?`<div style="font-style:italic;text-align:center;margin:.4em 0">${esc(inner)}</div>`:`<em>${esc(inner)}</em>`;
        result.push(isDisplay?`<div style="text-align:center;margin:.4em 0">${rendered}</div>`:rendered);
      }catch(e){
        result.push(isDisplay?`<div style="font-style:italic;text-align:center;margin:.4em 0">${esc(inner)}</div>`:`<em>${esc(inner)}</em>`);
      }
      lastIdx=m.index+m[0].length;
    }
    if(lastIdx<s.length)result.push(applyMd(esc(s.slice(lastIdx))));
    return result.join('');
  };

  const doPrint=(mode='teacher')=>{
    const isStudent=mode==='student';
    const cols=printCols||1;
    const pw=window.open('','_blank','width=900,height=1200');
    if(!pw){alert('팝업이 차단되어 있습니다. 팝업을 허용한 후 다시 시도해주세요.');return;}
    const isLarge=mode==='teacher-large'||mode==='student';
    const showSol=!isStudent;
    const docTitle=isStudent?'검정고시 연습 문제지':mode==='teacher-large'?'검정고시 연습 문제·해설지 (큰글씨)':'검정고시 연습 문제·해설지';
    const pageGroups=[];
    for(let i=0;i<qs.length;i+=3)pageGroups.push({startIdx:i,items:qs.slice(i,i+3)});
    const total=pageGroups.length;
    const sz=isLarge
      ?{qb:'19px',ch:'17px',qn:'17px',ans:'15px',sol:'14px',meta:'12px',topic:'11px',title:'18px',footer:'12px',cont:'11px'}
      :{qb:'13px',ch:'12px',qn:'13px',ans:'12px',sol:'11.5px',meta:'11px',topic:'10px',title:'17px',footer:'11px',cont:'10px'};
    let pages='';
    for(let pi=0;pi<total;pi++){
      const{startIdx,items:pqs}=pageGroups[pi];
      const isLast=pi===total-1;
      const hdr=pi===0
        ?`<div class="title-block"><div class="title">${docTitle}</div><div class="meta">${esc((studentName?studentName+' · ':'')+esc(log.type||'연습')+' · '+fmtDate(log.date)+' '+(log.time||''))}</div></div>`
        :`<div class="cont-hdr">${esc(studentName||'연습')} · ${fmtDate(log.date)} (${pi+1}/${total} 페이지)</div>`;
      const qsHtml=pqs.map((q,j)=>{
        const i=startIdx+j;
        const e=edits[i]||{};
        const hasFull=q.qFull&&Array.isArray(q.choices);
        const correct=hasFull?q.choices[q.answerIdx]:(q.cAns||'');
        const choHtml=hasFull
          ?isStudent
            ?`<div class="choices">${q.choices.map((c,jj)=>`<div class="ch">${esc(ORD[jj]+' '+c)}</div>`).join('')}</div>`
            :`<div class="choices">${q.choices.map((c,jj)=>`<div class="${jj===q.answerIdx?'ch ok':'ch'}">${esc(ORD[jj]+' '+c)}${jj===q.answerIdx?' ✓':''}</div>`).join('')}</div>`
          :'';
        const solText=e.solText||'';
        const solHtml=(showSol&&solText)?`<div class="sol"><span class="sol-hd">📖 풀이 과정</span><div style="line-height:1.8">${renderMathHtml(solText).replace(/\n/g,'<br>')}</div></div>`:'';
        const commentHtml=(showSol&&e.comment)?`<div class="teacher-comment"><span class="tc-hd">👨‍🏫 선생님 코멘트</span><div style="line-height:1.8">${renderMathHtml(e.comment).replace(/\n/g,'<br>')}</div></div>`:'';
        const qrHtml=isStudent?'':` <span class="qr ${q.isOk?'ok':'fail'}">${q.isOk?'O':'X'}</span>`;
        const uHtml=(showSol&&!q.isOk&&q.uAns)?` <span class="u-ans">(내 답: ${esc(q.uAns)})</span>`:'';
        const ansHtml=isStudent?'':`<div class="ans">정답: ${esc(hasFull?ORD[q.answerIdx]+' ':'')}${esc(correct)}${uHtml}</div>`;
        const topicHtml=(showSol&&q.topic)?`<div class="topic">[${esc(q.topic)}]${q.examSource?' · 📌 '+esc(q.examSource):''}</div>`:'';
        const graphSvg=q.graph?graphToSvgString(q):'';
        const graphHtml=graphSvg?`<div style="text-align:center;margin:4px 0 6px">${graphSvg}</div>`:'';
        return`<div class="question"><div class="q-head"><span class="qn">${i+1}.</span><span class="qb">${esc(hasFull?q.qFull:q.qTxt)}</span>${qrHtml}</div>${topicHtml}${graphHtml}${choHtml}${ansHtml}${solHtml}${commentHtml}</div>`;
      }).join('');
      pages+=`<div class="${isLast?'page':'page pb'}">${hdr}${qsHtml}${isLast?'<div class="footer">— 태청야학 수학 학습 도우미 —</div>':''}</div>`;
    }
    pw.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><title>${docTitle}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"><style>
      *{box-sizing:border-box;margin:0;padding:0;}
      .katex svg{display:inline!important;vertical-align:middle}.katex{line-height:1.2}.katex-display{display:block;text-align:center;margin:.5em 0}
      body{font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;color:#1e293b;background:white;}
      .page{padding:12mm 15mm;${cols===2?'columns:2;column-gap:24px;':''}}
      .pb{break-after:page;page-break-after:always;}
      .title-block{text-align:center;border-bottom:2px solid #1e293b;padding-bottom:10px;margin-bottom:18px;}
      .title{font-size:${sz.title};font-weight:900;}
      .meta{font-size:${sz.meta};color:#475569;margin-top:3px;font-weight:700;}
      .cont-hdr{text-align:right;font-size:${sz.cont};color:#94a3b8;border-bottom:1px solid #e2e8f0;padding-bottom:4px;margin-bottom:14px;}
      .question{break-inside:avoid;page-break-inside:avoid;margin-bottom:${isLarge?'26px':'20px'};padding-bottom:${isLarge?'18px':'14px'};border-bottom:1px solid #e2e8f0;}
      .q-head{display:flex;gap:8px;align-items:flex-start;margin-bottom:4px;}
      .qn{font-weight:900;color:#4f46e5;flex-shrink:0;min-width:22px;font-size:${sz.qn};}
      .qb{font-weight:700;line-height:1.7;flex:1;font-size:${sz.qb};}
      .qr{font-weight:900;font-size:${sz.ch};flex-shrink:0;}
      .qr.ok{color:#16a34a;}.qr.fail{color:#ef4444;}
      .topic{margin-left:26px;font-size:${sz.topic};color:#64748b;font-weight:700;margin-bottom:3px;}
      .choices{margin-left:26px;display:grid;grid-template-columns:1fr 1fr;gap:${isLarge?'6px 16px':'2px 14px'};margin:${isLarge?'8px 0':'5px 0'};}
      .ch{font-size:${sz.ch};color:#374151;line-height:${isLarge?'1.7':'1.5'};}
      .ch.ok{font-weight:900;color:#15803d;}
      .ans{margin-left:26px;margin-top:5px;font-size:${sz.ans};font-weight:900;color:#15803d;}
      .u-ans{color:#ef4444;font-weight:700;margin-left:8px;}
      .sol{margin-left:26px;margin-top:8px;font-size:${sz.sol};background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:8px 14px;}
      .sol-hd{font-weight:900;color:#b45309;display:block;margin-bottom:4px;}
      .teacher-comment{margin-left:26px;margin-top:8px;font-size:${sz.sol};background:#f0fdf4;border:1px solid #86efac;border-radius:6px;padding:8px 14px;}
      .tc-hd{font-weight:900;color:#166534;display:block;margin-bottom:4px;}
      .footer{text-align:center;font-size:${sz.footer};color:#94a3b8;margin-top:20px;}
      @media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}.pb{break-after:page;page-break-after:always;}.question{break-inside:avoid;page-break-inside:avoid;}}
    </style></head><body>${pages}<script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body></html>`);
    pw.document.close();
  };

  const toggleCorrection=async(i)=>{
    if(!sessionId||!studentId)return;
    const newVal=!corrected[i];
    setCorrected(prev=>({...prev,[i]:newVal}));
    try{
      await db.collection('sessionEdits').doc(sessionId).set(
        {[`corrected_q${i}`]:newVal,updatedAt:Date.now()},
        {merge:true}
      );
    }catch(err){
      setCorrected(prev=>({...prev,[i]:!newVal}));
      alert('오답 수정 저장 실패: '+err.message);
    }
  };

  return(
    <div className="session-print-area fixed inset-0 z-50 bg-white overflow-auto">
      <div className="no-print sticky top-0 bg-indigo-600 text-white px-4 py-3 flex items-center gap-3 shadow-md flex-wrap">
        <button onClick={onClose} className="px-3 py-1.5 bg-white/20 rounded-xl font-bold text-sm">← 닫기</button>
        <div className="flex-1 font-black text-sm">📄 회차 문제·해설 인쇄</div>
        {[1,2].map(n=><button key={n} onClick={()=>setPrintCols(n)} className={`px-2 py-1 rounded-lg text-xs font-bold border ${printCols===n?'bg-white text-indigo-700 border-white':'bg-white/20 text-white border-white/40'}`}>{n}열</button>)}
        <button onClick={()=>doPrint('student')} className="px-3 py-1.5 bg-sky-400 text-white rounded-xl font-black text-sm">📄 학생 제공용</button>
        <button onClick={()=>doPrint('teacher-large')} className="px-3 py-1.5 bg-emerald-500 text-white rounded-xl font-black text-sm">🔡 큰글씨 보기</button>
        <button onClick={()=>doPrint('teacher')} className="px-3 py-1.5 bg-white text-indigo-700 rounded-xl font-black text-sm">📋 기본</button>
      </div>
      <div className="no-print px-4 pt-2 pb-1 bg-sky-50 mx-4 rounded-lg mt-2 text-xs text-sky-700 font-semibold">
        📄 <b>학생 제공용</b>: 정답·해설 없이 문제만 (큰 글씨) &nbsp;|&nbsp; 🔡 <b>큰글씨 보기</b>: 해설 포함, 학생이 읽기 쉬운 큰 글씨 &nbsp;|&nbsp; 📋 <b>기본</b>: 정답·해설 포함 기본 크기
      </div>
      <div className="no-print px-4 pt-1 text-xs text-red-500 font-semibold">- 잘림 현상이 있을 수 있습니다. 원활한 인쇄를 위해 Chrome 등 다른 브라우저를 사용해주세요 :) -</div>
      <div className="no-print px-4 pt-1 pb-1 text-xs text-indigo-600 font-semibold bg-indigo-50 mx-4 rounded-lg mt-1">✏️ 각 문제 아래 [해설 수정] 버튼으로 해설을 수정하거나 선생님 코멘트를 추가할 수 있습니다. <b>$ 수식 $</b> 수학식 · <b>**굵게**</b> · <b>*기울임*</b> · <b>~~취소선~~</b> 입력 가능. · <b>💾 저장 &amp; 완료</b>로 이 세션에 고정, <b>📚 다음 해설에 반영</b>으로 같은 유형 모든 학생에 적용됩니다.</div>

      <style dangerouslySetInnerHTML={{__html:`
        @media print {
          .no-print { display: none !important; }
          .session-print-item { page-break-inside: avoid; break-inside: avoid; }
          .print-page-group { page-break-after: always; break-after: page; }
          .print-page-group:last-child { page-break-after: auto; break-after: auto; }
          .print-page-header { page-break-inside: avoid; break-inside: avoid; }
        }
      `}}/>

      <div className="px-6 py-5 max-w-3xl mx-auto">
        {Array.from({length:Math.ceil(qs.length/3)},(_,pi)=>{
          const pageQs=qs.slice(pi*3,pi*3+3);
          const isLast=pi===Math.ceil(qs.length/3)-1;
          return(
            <div key={pi} className={isLast?'':'print-page-group'}>
              {pi===0?(
                <div className="text-center border-b-2 border-gray-800 pb-3 mb-5 print-page-header">
                  <div className="text-xl font-black text-gray-900">검정고시 연습 문제·해설지</div>
                  <div className="text-sm text-gray-600 mt-1 font-bold">
                    {studentName?`${studentName} · `:''}{log.type||'연습'} · {fmtDate(log.date)} {log.time||''} · 점수 {log.score||''}
                  </div>
                </div>
              ):(

                        <div className="leading-relaxed" dangerouslySetInnerHTML={{__html:renderMathHtml(e.comment).replace(/\n/g,'<br/>')}}/>

                          </div>
                          <div>
                            <div className="text-xs font-black text-green-700 mb-1">💬 선생님 코멘트 <span className="font-normal text-gray-500">($ 수식 $, **굵게**, *기울임*, ~~취소선~~ 입력 가능)</span></div>
                            <textarea value={e.comment||''} onChange={ev=>setEdit(i,'comment',ev.target.value)} rows={3} className="w-full text-sm border border-green-200 rounded-lg p-2 resize-y bg-white" placeholder="이 문제에 대한 선생님 코멘트를 입력하세요."/>
                          </div>
                          <div className="flex flex-wrap gap-2 items-center">
                            <button onClick={()=>toggleEditing(i)} className="px-4 py-1.5 bg-indigo-600 text-white rounded-lg text-sm font-black">{sessionId?'💾 저장 & 완료':'완료 ✓'}</button>
                            <button
                              onClick={()=>saveOverride(i)}
                              disabled={!e.solText?.trim()}
                              className={`px-4 py-1.5 rounded-lg text-sm font-black transition-all ${overrideSaved[i]?'bg-green-500 text-white':'bg-amber-500 text-white disabled:opacity-40 active:scale-95'}`}
                            >
                              {overrideSaved[i]?'✅ 반영 완료!':'📚 다음 해설에 반영'}
                            </button>
                            {e.solText?.trim()&&<span className="text-[10px] text-gray-400">같은 유형 문제의 풀이 틀로 저장됩니다 (코멘트 제외)</span>}
                          </div>
                        </div>
                      ):(
                        <button onClick={()=>toggleEditing(i)} className="text-xs font-bold px-3 py-1.5 bg-indigo-100 text-indigo-700 rounded-lg">
                          ✏️ {e.solText||e.comment?'해설 수정':'해설 추가'}
                        </button>
                      )}
                    </div>
                  </div>
                );
              })}
              {isLast&&<div className="text-center text-xs text-gray-400 mt-6">— 태청야학 수학 학습 도우미 —</div>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* --------------------------------------------------------------------
   그래프 탐험 6개 모듈과 개념 데이터
   슬라이더로 그래프를 직접 움직여 보는 학습 도구

/* ===== GEOMETRY MODULES ===== */
function RadicalModule({sz}){
  const{W,H,SC,panX=0,panY=0}=sz;const cx=W/2-panX*SC,cy=H/2+panY*SC;
  const[p,setP]=useState(0),[q,setQ]=useState(0),[a,setA]=useState(1);
  const ref=useRef();
  const{dn,mv,up}=useDrag(ref,sz,([mx,my])=>{setP(mx);setQ(my)});
  const{panStart,panMove,panEnd,panning}=usePan(sz);
  const{pinchStart,pinchMove,pinchEnd}=usePinch(ref,sz);
  const hXY=e=>e.touches?.length>0?[e.touches[0].clientX,e.touches[0].clientY]:[e.clientX,e.clientY];
  const hDn=e=>{if(e.touches?.length>=2){up();panEnd();pinchStart(e.touches);return;}const r=ref.current?.getBoundingClientRect();if(!r)return;const[ex,ey]=hXY(e);if(Math.hypot(ex-r.left-(cx+p*SC),ey-r.top-(cy-q*SC))>40)panStart(ex,ey)};
  const hMv=e=>{if(e.touches?.length>=2){pinchMove(e.touches);return;}const[ex,ey]=hXY(e);if(!panMove(ex,ey))mv(e)};
  const hUp=()=>{pinchEnd();panEnd();up()};
  const pts=[];for(let sx=0;sx<=W;sx+=2){const mx=(sx-cx)/SC,inn=mx-p;if(inn<0)continue;const my=a*Math.sqrt(inn)+q;if(Math.abs(my)>13)continue;pts.push(`${sx.toFixed(1)},${(cy-my*SC).toFixed(1)}`)}
  const aStr=a===1?'':a===-1?'−':String(a);const innerStr=p===0?'x':`x${eqSh(p)}`;
  return(<div className="space-y-3">
    <div className="flex flex-wrap gap-3 items-center">
      <label className="flex items-center gap-2 text-base font-bold text-gray-700">계수 a:
        <select value={a} onChange={e=>setA(+e.target.value)} className="border-2 border-blue-300 rounded-xl px-3 py-2 bg-white text-base font-bold">
          {[-3,-2,-1,1,2,3].map(v=><option key={v} value={v}>{v}</option>)}
        </select>
      </label>
      <span className="text-sm bg-blue-50 border border-blue-200 rounded-full px-3 py-1.5 text-blue-700 font-semibold">🔴 점 드래그 · 배경 길게 누르면 이동</span>
    </div>
    <div className="text-center text-sm text-blue-600 bg-white rounded-xl py-2 px-3 border border-blue-100">
      원점에서 x축 방향으로 <strong>{p}</strong>만큼, y축 방향으로 <strong>{q}</strong>만큼 <strong>평행이동</strong>했어요!
    </div>
    <div className="text-center font-bold text-blue-700 bg-blue-50 rounded-2xl py-3 text-base border border-blue-200">
      <KF tex={`y=${a===1?'':a===-1?'-':a}\\sqrt{${p===0?'x':p>0?`x-${p}`:`x+${-p}`}}${q===0?'':q>0?`+${q}`:String(q)}`}/>
      <span className="text-gray-300 mx-2">|</span> 시작점: ({p}, {q})
    </div>
    <svg ref={ref} width={W} height={H} {...SVG_PROPS} style={{...SVG_PROPS.style,cursor:panning?'grabbing':'crosshair'}}
      onMouseDown={hDn} onMouseMove={hMv} onMouseUp={hUp} onMouseLeave={hUp}
      onTouchStart={hDn} onTouchMove={hMv} onTouchEnd={hUp}>
      <Grid W={W} H={H} SC={SC} cx={cx} cy={cy}/>
      {pts.length>1&&<path d={`M ${pts.join(' L ')}`} fill="none" stroke="#3b82f6" strokeWidth={3} strokeLinecap="round"/>}
      <Dot sx={cx+p*SC} sy={cy-q*SC} color="#3b82f6" onDown={dn} cx={cx} cy={cy} label={[p,q]}/>
    </svg>
  </div>);
}

function RationalModule({sz}){
  const{W,H,SC,panX=0,panY=0}=sz;const cx=W/2-panX*SC,cy=H/2+panY*SC;
  const[p,setP]=useState(0),[q,setQ]=useState(0),[k,setK]=useState(1);
  const ref=useRef();
  const{dn,mv,up}=useDrag(ref,sz,([mx,my])=>{setP(mx);setQ(my)});
  const{panStart,panMove,panEnd,panning}=usePan(sz);
  const{pinchStart,pinchMove,pinchEnd}=usePinch(ref,sz);
  const hXY=e=>e.touches?.length>0?[e.touches[0].clientX,e.touches[0].clientY]:[e.clientX,e.clientY];
  const hDn=e=>{if(e.touches?.length>=2){up();panEnd();pinchStart(e.touches);return;}const r=ref.current?.getBoundingClientRect();if(!r)return;const[ex,ey]=hXY(e);if(Math.hypot(ex-r.left-(cx+p*SC),ey-r.top-(cy-q*SC))>40)panStart(ex,ey)};
  const hMv=e=>{if(e.touches?.length>=2){pinchMove(e.touches);return;}const[ex,ey]=hXY(e);if(!panMove(ex,ey))mv(e)};
  const hUp=()=>{pinchEnd();panEnd();up()};
  const branch=left=>{const pts=[];for(let mx=left?-13:p+0.04;left?mx<p-0.04:mx<=13;mx+=0.04){const my=k/(mx-p)+q;if(Math.abs(my)>13)continue;pts.push(`${(cx+mx*SC).toFixed(1)},${(cy-my*SC).toFixed(1)}`)}return pts.length>1?`M ${pts.join(' L ')}`:''};
  return(<div className="space-y-3">
    <div className="flex flex-wrap gap-3 items-center">
      <label className="flex items-center gap-2 text-base font-bold text-gray-700">상수 k:
        <select value={k} onChange={e=>setK(+e.target.value)} className="border-2 border-purple-300 rounded-xl px-3 py-2 bg-white text-base font-bold">
          {[-4,-3,-2,-1,1,2,3,4].map(v=><option key={v} value={v}>{v}</option>)}
        </select>
      </label>
      <span className="text-sm bg-purple-50 border border-purple-200 rounded-full px-3 py-1.5 text-purple-700 font-semibold">🟣 점 드래그 · 배경 길게 누르면 이동</span>
    </div>
    <div className="text-center text-sm text-purple-600 bg-white rounded-xl py-2 px-3 border border-purple-100">
      원점에서 x축 방향으로 <strong>{p}</strong>만큼, y축 방향으로 <strong>{q}</strong>만큼 <strong>평행이동</strong>했어요!
    </div>
    <div className="text-center font-bold text-purple-700 bg-purple-50 rounded-2xl py-3 text-base border border-purple-200">
      <KF tex={`y={${k}\\over ${p===0?'x':p>0?`x-${p}`:`x+${-p}`}}${q===0?'':q>0?`+${q}`:String(q)}`}/>
      <span className="text-gray-300 mx-2">|</span> 점근선: x={p}, y={q}
    </div>
    <svg ref={ref} width={W} height={H} {...SVG_PROPS} style={{...SVG_PROPS.style,cursor:panning?'grabbing':'crosshair'}}
      onMouseDown={hDn} onMouseMove={hMv} onMouseUp={hUp} onMouseLeave={hUp}
      onTouchStart={hDn} onTouchMove={hMv} onTouchEnd={hUp}>
      <Grid W={W} H={H} SC={SC} cx={cx} cy={cy}/>
      <line x1={cx+p*SC} y1={0} x2={cx+p*SC} y2={H} stroke="#c084fc" strokeWidth={1.5} strokeDasharray="6,4"/>
      <line x1={0} y1={cy-q*SC} x2={W} y2={cy-q*SC} stroke="#c084fc" strokeWidth={1.5} strokeDasharray="6,4"/>
      <path d={branch(true)} fill="none" stroke="#9333ea" strokeWidth={3} strokeLinecap="round"/>
      <path d={branch(false)} fill="none" stroke="#9333ea" strokeWidth={3} strokeLinecap="round"/>
      <Dot sx={cx+p*SC} sy={cy-q*SC} color="#9333ea" onDown={dn} cx={cx} cy={cy} label={[p,q]}/>
    </svg>
  </div>);
}

function QuadraticModule({sz}){
  const{W,H,SC,panX=0,panY=0}=sz;const cx=W/2-panX*SC,cy=H/2+panY*SC;
  const[p,setP]=useState(0),[q,setQ]=useState(0),[a,setA]=useState(1),[ds,setDs]=useState(-7),[de,setDe]=useState(7);
  const ref=useRef();
  const{dn,mv,up}=useDrag(ref,sz,([mx,my])=>{setP(mx);setQ(my)});
  const{panStart,panMove,panEnd,panning}=usePan(sz);
  const{pinchStart,pinchMove,pinchEnd}=usePinch(ref,sz);
  const hXY=e=>e.touches?.length>0?[e.touches[0].clientX,e.touches[0].clientY]:[e.clientX,e.clientY];
  const hDn=e=>{if(e.touches?.length>=2){up();panEnd();pinchStart(e.touches);return;}const r=ref.current?.getBoundingClientRect();if(!r)return;const[ex,ey]=hXY(e);if(Math.hypot(ex-r.left-(cx+p*SC),ey-r.top-(cy-q*SC))>40)panStart(ex,ey)};
  const hMv=e=>{if(e.touches?.length>=2){pinchMove(e.touches);return;}const[ex,ey]=hXY(e);if(!panMove(ex,ey))mv(e)};
  const hUp=()=>{pinchEnd();panEnd();up()};
  
  const ghost=[],dom=[];
  // 1. 그래프 그리기 용도 (화면 표시용)
  for(let sx=0;sx<=W;sx+=2){const mx=(sx-cx)/SC,my=a*(mx-p)**2+q;if(Math.abs(my)<=13)ghost.push(`${sx},${(cy-my*SC).toFixed(1)}`)}
  for(let mx=ds;mx<=de;mx+=0.04){const my=a*(mx-p)**2+q;dom.push(`${(cx+mx*SC).toFixed(1)},${(cy-my*SC).toFixed(1)}`);}
  
  // 2. 정확한 최댓값/최솟값 수학적 계산 (소수점 오차 원천 차단)
  const validY = [a * (ds - p)**2 + q, a * (de - p)**2 + q];
  if (p >= ds && p <= de) validY.push(q);
  const extreme = a > 0 ? Math.min(...validY) : Math.max(...validY);
  
  const aStr=a===-1?'−':a===1?'':String(a);
  
  return(<div className="space-y-3">
    <div className="flex flex-col sm:flex-row flex-wrap gap-3 items-center justify-center">
      <label className="flex items-center gap-2 text-sm font-bold text-gray-700">a:
        <select value={a} onChange={e=>setA(+e.target.value)} className="border-2 border-emerald-300 rounded-xl px-2 py-2 bg-white font-bold">
          {[-2,-1,1,2].map(v=><option key={v} value={v}>{v}</option>)}
        </select>
      </label>
      {/* 범위 버튼 한계치를 -6 ~ 6으로 확장 */}
      <div className="flex items-center gap-2 text-sm font-bold text-gray-700 bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-200">
        <span>범위 x:</span>
        <div className="flex items-center gap-1">
          <button onClick={()=>setDs(v=>Math.max(-12,Math.min(de-1,v-1)))} className="w-7 h-7 rounded-full bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-lg">−</button>
          <span className="w-7 text-center">{ds}</span>
          <button onClick={()=>setDs(v=>Math.max(-12,Math.min(de-1,v+1)))} className="w-7 h-7 rounded-full bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-lg">+</button>
        </div>
        <span className="text-gray-400">~</span>
        <div className="flex items-center gap-1">
          <button onClick={()=>setDe(v=>Math.max(ds+1,Math.min(12,v-1)))} className="w-7 h-7 rounded-full bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-lg">−</button>
          <span className="w-7 text-center">{de}</span>
          <button onClick={()=>setDe(v=>Math.max(ds+1,Math.min(12,v+1)))} className="w-7 h-7 rounded-full bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-lg">+</button>
        </div>
      </div>
    </div>
    
    <div className="text-center font-bold text-emerald-700 bg-emerald-50 rounded-2xl py-3 text-sm border border-emerald-200">
      <KF tex={`y=${a===-1?'-':a===1?'':a}(x${p===0?'':p>0?`-${p}`:`+${-p}`})^{2}${q===0?'':q>0?`+${q}`:String(q)}`}/>
      <span className="text-gray-300 mx-2">|</span> {a>0?'최솟값':'최댓값'}: {Math.round(extreme)} (x∈[{ds},{de}])
    </div>
    
    <svg ref={ref} width={W} height={H} {...SVG_PROPS} style={{...SVG_PROPS.style,cursor:panning?'grabbing':'crosshair'}}
      onMouseDown={hDn} onMouseMove={hMv} onMouseUp={hUp} onMouseLeave={hUp}
      onTouchStart={hDn} onTouchMove={hMv} onTouchEnd={hUp}>
      <Grid W={W} H={H} SC={SC} cx={cx} cy={cy}/>
      {ghost.length>1&&<path d={`M ${ghost.join(' L ')}`} fill="none" stroke="#bbf7d0" strokeWidth={2} strokeDasharray="6,4"/>}
      <line x1={cx+ds*SC} y1={0} x2={cx+ds*SC} y2={H} stroke="#fbbf24" strokeWidth={1.5} strokeDasharray="4,4"/>
      <line x1={cx+de*SC} y1={0} x2={cx+de*SC} y2={H} stroke="#fbbf24" strokeWidth={1.5} strokeDasharray="4,4"/>
      {dom.length>1&&<path d={`M ${dom.join(' L ')}`} fill="none" stroke="#16a34a" strokeWidth={3} strokeLinecap="round"/>}
      <Dot sx={cx+p*SC} sy={cy-q*SC} color="#16a34a" onDown={dn} cx={cx} cy={cy} label={[p,q]}/>
      {/* 극점 이외에서 최대/최솟값이 발생하는 경우: 축 수선의 발 + 좌표 라벨 */}
      {(()=>{
        const extremeX=a>0?(extreme===a*(ds-p)**2+q?ds:de):(extreme===a*(ds-p)**2+q?ds:de);
        const isVertex=p>=ds&&p<=de&&extreme===q;
        if(isVertex)return null;
        const esx=cx+extremeX*SC,esy=cy-extreme*SC;
        const col='#ef4444';
        return(<>
          <line x1={esx} y1={esy} x2={esx} y2={cy} stroke={col} strokeWidth={2} strokeDasharray="7,4" opacity={0.75}/>
          <line x1={esx} y1={esy} x2={cx} y2={esy} stroke={col} strokeWidth={2} strokeDasharray="7,4" opacity={0.75}/>
          <line x1={esx} y1={cy-8} x2={esx} y2={cy+8} stroke={col} strokeWidth={3.5}/>
          <text x={esx} y={cy+30} textAnchor="middle" fontSize={24} fill={col} fontWeight="900" stroke="white" strokeWidth="4" paintOrder="stroke">{extremeX}</text>
          <line x1={cx-8} y1={esy} x2={cx+8} y2={esy} stroke={col} strokeWidth={3.5}/>
          <text x={cx-18} y={esy+8} textAnchor="end" fontSize={24} fill={col} fontWeight="900" stroke="white" strokeWidth="4" paintOrder="stroke">{Math.round(extreme)}</text>
        </>);
      })()}
    </svg>
  </div>);
}

function DistanceModule({sz}){
  const{W,H,SC,panX=0,panY=0}=sz;const cx=W/2-panX*SC,cy=H/2+panY*SC;
  const[ptX,setPX]=useState(2),[ptY,setPY]=useState(3),[la,setLA]=useState(3),[lb,setLB]=useState(-4),[lc,setLC]=useState(5);
  const ref=useRef();
  const{dn,mv,up}=useDrag(ref,sz,([mx,my])=>{setPX(mx);setPY(my)});
  const{panStart,panMove,panEnd,panning}=usePan(sz);
  const{pinchStart,pinchMove,pinchEnd}=usePinch(ref,sz);
  const hXY=e=>e.touches?.length>0?[e.touches[0].clientX,e.touches[0].clientY]:[e.clientX,e.clientY];
  const hDn=e=>{if(e.touches?.length>=2){up();panEnd();pinchStart(e.touches);return;}const r=ref.current?.getBoundingClientRect();if(!r)return;const[ex,ey]=hXY(e);if(Math.hypot(ex-r.left-(cx+ptX*SC),ey-r.top-(cy-ptY*SC))>40)panStart(ex,ey)};
  const hMv=e=>{if(e.touches?.length>=2){pinchMove(e.touches);return;}const[ex,ey]=hXY(e);if(!panMove(ex,ey))mv(e)};
  const hUp=()=>{pinchEnd();panEnd();up()};
  
  const nV=la*ptX+lb*ptY+lc,denSq=la**2+lb**2,dV=Math.sqrt(denSq);
  const fX=dV>0?ptX-la*nV/denSq:ptX,fY=dV>0?ptY-lb*nV/denSq:ptY;
  const distStr=distFracStr(Math.abs(nV),denSq);
  
  const le=[];if(Math.abs(lb)>0.001){[-13,13].forEach(mx=>{const my=-(la*mx+lc)/lb;le.push([cx+mx*SC,cy-my*SC])})}
  else if(Math.abs(la)>0.001){const mx=-lc/la;le.push([cx+mx*SC,0],[cx+mx*SC,H])}
  const sqPerfect=Math.round(Math.sqrt(denSq))**2===denSq;
  
  const Stepper=({label,val,onMinus,onPlus})=>(<div className="flex flex-col items-center bg-white border border-orange-100 rounded-2xl px-3 py-2 shadow-sm gap-1">
    <span className="text-sm font-black text-orange-600">{label}</span>
    <button onClick={onPlus} className="w-10 h-10 rounded-full bg-orange-100 text-orange-700 font-bold flex items-center justify-center text-2xl">+</button>
    <span className="w-8 text-center text-xl font-black text-gray-800">{val}</span>
    <button onClick={onMinus} className="w-10 h-10 rounded-full bg-orange-100 text-orange-700 font-bold flex items-center justify-center text-2xl">−</button>
  </div>);

  const nCalc = Math.abs(nV);
  const dCalc = sqPerfect ? Math.round(Math.sqrt(denSq)) : `√${denSq}`;
  const showFinal = (String(nCalc) !== distStr && String(nCalc)+'/'+String(dCalc) !== distStr) || nCalc === 0;

  // KaTeX 수식 생성
  const laS=la<0?`(${la})`:String(la),lbS=lb<0?`(${lb})`:String(lb),lcS=lc<0?`(${lc})`:String(lc);
  const distToLatex=s=>{if(!s.includes('/'))return s;const[n,d]=s.split('/');return`\\dfrac{${n}}{${d.startsWith('√')?`\\sqrt{${d.slice(1)}}`:d}}`};
  const denTex=sqPerfect?String(Math.round(dV)):`\\sqrt{${denSq}}`;
  const formulaTex=`d=\\dfrac{|${laS}\\times${ptX}+${lbS}\\times${ptY}+${lcS}|}{\\sqrt{${laS}^{2}+${lbS}^{2}}}=\\dfrac{${nCalc}}{${denTex}}${showFinal?`=${distToLatex(distStr)}`:''}`;

  return(<div className="space-y-3">
    <div className="grid grid-cols-3 gap-2">
      <Stepper label="a" val={la} onMinus={()=>setLA(v=>Math.max(-10,v-1))} onPlus={()=>setLA(v=>Math.min(10,v+1))}/>
      <Stepper label="b" val={lb} onMinus={()=>setLB(v=>Math.max(-10,v-1))} onPlus={()=>setLB(v=>Math.min(10,v+1))}/>
      <Stepper label="c" val={lc} onMinus={()=>setLC(v=>Math.max(-10,v-1))} onPlus={()=>setLC(v=>Math.min(10,v+1))}/>
    </div>

    <div className="text-xs text-gray-600 bg-white border border-gray-200 rounded-xl p-3 shadow-sm text-left">
      <div className="font-bold text-gray-800 mb-1">직선: <KF tex={`${la}x${lb>=0?`+${lb}`:lb}y${lc>=0?`+${lc}`:lc}=0`}/>, 점: ({ptX}, {ptY})</div>
      <ul className="list-disc pl-4 space-y-0.5">
        <li><span className="font-bold">분자</span>: x, y 자리에 점의 좌표 대입 후 절댓값</li>
        <li><span className="font-bold">분모</span>: <KF tex={`\\sqrt{(x\\text{ 앞})^2+(y\\text{ 앞})^2}`}/></li>
      </ul>
    </div>

    <div className="font-bold text-orange-700 bg-orange-50 rounded-2xl py-3 px-3 border border-orange-200 text-center">
      <KF block tex={formulaTex}/>
    </div>
    
    <svg ref={ref} width={W} height={H} {...SVG_PROPS} style={{...SVG_PROPS.style,cursor:panning?'grabbing':'crosshair'}}
      onMouseDown={hDn} onMouseMove={hMv} onMouseUp={hUp} onMouseLeave={hUp}
      onTouchStart={hDn} onTouchMove={hMv} onTouchEnd={hUp}>
      <Grid W={W} H={H} SC={SC} cx={cx} cy={cy}/>
      {le.length>=2&&<line x1={le[0][0]} y1={le[0][1]} x2={le[1][0]} y2={le[1][1]} stroke="#ea580c" strokeWidth={2.5}/>}
      <line x1={cx+ptX*SC} y1={cy-ptY*SC} x2={cx+fX*SC} y2={cy-fY*SC} stroke="#fb923c" strokeWidth={1.8} strokeDasharray="4,3"/>
      <circle cx={cx+fX*SC} cy={cy-fY*SC} r={6} fill="#fb923c" stroke="white" strokeWidth={2}/>
      <Dot sx={cx+ptX*SC} sy={cy-ptY*SC} color="#dc2626" onDown={dn} cx={cx} cy={cy} label={[ptX,ptY]}/>
      <text x={8} y={H-8} fontSize={11} fill="#64748b">거리 = {distStr}</text>
    </svg>
  </div>);
}

function CircleModule({sz}){
  const{W,H,SC,panX=0,panY=0}=sz;const cx=W/2-panX*SC,cy=H/2+panY*SC;
  const[h,setH]=useState(0),[k,setK]=useState(0),[r,setR]=useState(3);
  const[lineEnabled,setLineEnabled]=useState(false);
  const[lineDir,setLineDir]=useState('h'); // 'h'=수평(y=n), 'v'=수직(x=n)
  const[linePos,setLinePos]=useState(0);
  const ref=useRef();
  const{dn,mv,up}=useDrag(ref,sz,([mx,my])=>{setH(mx);setK(my)});
  const{panStart,panMove,panEnd,panning}=usePan(sz);
  const{pinchStart,pinchMove,pinchEnd}=usePinch(ref,sz);
  const hXY=e=>e.touches?.length>0?[e.touches[0].clientX,e.touches[0].clientY]:[e.clientX,e.clientY];
  const hDn=e=>{if(e.touches?.length>=2){up();panEnd();pinchStart(e.touches);return;}const r2=ref.current?.getBoundingClientRect();if(!r2)return;const[ex,ey]=hXY(e);if(Math.hypot(ex-r2.left-(cx+h*SC),ey-r2.top-(cy-k*SC))>40)panStart(ex,ey)};
  const hMv=e=>{if(e.touches?.length>=2){pinchMove(e.touches);return;}const[ex,ey]=hXY(e);if(!panMove(ex,ey))mv(e)};
  const hUp=()=>{pinchEnd();panEnd();up()};

  // 원-직선 교점 판정
  const lineDist=lineEnabled?(lineDir==='h'?Math.abs(linePos-k):Math.abs(linePos-h)):null;
  const lineStatus=lineDist===null?null:lineDist<r?'meet':lineDist===r?'tangent':'apart';

  const circleTex=`(x${h===0?'':h>0?`-${h}`:`+${-h}`})^{2}+(y${k===0?'':k>0?`-${k}`:`+${-k}`})^{2}=${r}^{2}`;

  return(<div className="space-y-3">
    <div className="flex flex-wrap gap-2 items-center">
      <label className="flex items-center gap-2 text-base font-bold text-gray-700">r:
        <input type="range" min={1} max={6} value={r} onChange={e=>setR(+e.target.value)} className="w-24 accent-teal-500"/>
        <span className="font-bold text-teal-600 w-5">{r}</span>
      </label>
      <span className="text-xs bg-teal-50 border border-teal-200 rounded-full px-3 py-1.5 text-teal-700 font-semibold">🟢 중심 드래그 · 배경 길게 누르면 이동</span>
    </div>

    {/* 직선 추가 UI */}
    <div className="flex flex-wrap gap-2 items-center">
      <button onClick={()=>{setLineEnabled(!lineEnabled);setLinePos(0);}}
        className={`px-3 py-2 rounded-xl font-bold text-sm border-2 ${lineEnabled?'bg-rose-500 text-white border-rose-500':'bg-white text-rose-600 border-rose-300'}`}>
        {lineEnabled?'직선 제거 ✕':'➕ 직선 추가'}
      </button>
      {lineEnabled&&<>
        <button onClick={()=>setLineDir('h')} className={`px-3 py-2 rounded-xl font-bold text-sm border-2 ${lineDir==='h'?'bg-rose-100 text-rose-700 border-rose-400':'bg-white text-gray-500 border-gray-200'}`}>수평 y=k</button>
        <button onClick={()=>setLineDir('v')} className={`px-3 py-2 rounded-xl font-bold text-sm border-2 ${lineDir==='v'?'bg-rose-100 text-rose-700 border-rose-400':'bg-white text-gray-500 border-gray-200'}`}>수직 x=k</button>
      </>}
    </div>
    {lineEnabled&&<div className="flex items-center gap-2 bg-rose-50 border border-rose-200 rounded-2xl px-4 py-2">
      <span className="text-base font-black text-rose-700">{lineDir==='h'?'y':'x'} =</span>
      <button onClick={()=>setLinePos(v=>Math.max(-12,v-1))} className="w-10 h-10 rounded-full bg-rose-200 text-rose-700 font-bold flex items-center justify-center text-2xl">−</button>
      <span className="w-8 text-center text-xl font-black text-gray-800">{linePos}</span>
      <button onClick={()=>setLinePos(v=>Math.min(12,v+1))} className="w-10 h-10 rounded-full bg-rose-200 text-rose-700 font-bold flex items-center justify-center text-2xl">+</button>
      <span className={`ml-2 text-sm font-bold px-3 py-1 rounded-full ${lineStatus==='meet'?'bg-green-100 text-green-700':lineStatus==='tangent'?'bg-amber-100 text-amber-700':'bg-red-100 text-red-600'}`}>
        {lineStatus==='meet'?'✓ 2점에서 만남':lineStatus==='tangent'?'◎ 접선 (1점)':'✗ 만나지 않음'}
      </span>
    </div>}

    <div className="text-center font-bold text-teal-700 bg-teal-50 rounded-2xl py-3 text-sm border border-teal-200">
      <KF tex={circleTex}/> <span className="text-gray-300 mx-2">|</span> 중심: ({h},{k}), r={r}
    </div>
    <svg ref={ref} width={W} height={H} {...SVG_PROPS} style={{...SVG_PROPS.style,cursor:panning?'grabbing':'crosshair'}}
      onMouseDown={hDn} onMouseMove={hMv} onMouseUp={hUp} onMouseLeave={hUp}
      onTouchStart={hDn} onTouchMove={hMv} onTouchEnd={hUp}>
      <Grid W={W} H={H} SC={SC} cx={cx} cy={cy}/>
      {lineEnabled&&(lineDir==='h'
        ?<line x1={0} y1={cy-linePos*SC} x2={W} y2={cy-linePos*SC} stroke="#e11d48" strokeWidth={2.5} strokeDasharray="8,4"/>
        :<line x1={cx+linePos*SC} y1={0} x2={cx+linePos*SC} y2={H} stroke="#e11d48" strokeWidth={2.5} strokeDasharray="8,4"/>
      )}
      {lineEnabled&&(lineDir==='h'
        ?<text x={8} y={Math.max(16,cy-linePos*SC-6)} fontSize={14} fill="#e11d48" fontWeight="bold">y={linePos}</text>
        :<text x={Math.min(cx+linePos*SC+6,W-44)} y={16} fontSize={14} fill="#e11d48" fontWeight="bold">x={linePos}</text>
      )}
      <circle cx={cx+h*SC} cy={cy-k*SC} r={r*SC} fill="rgba(20,184,166,0.1)" stroke="#0d9488" strokeWidth={2.5}/>
      <line x1={cx+h*SC} y1={cy-k*SC} x2={cx+(h+r)*SC} y2={cy-k*SC} stroke="#0d9488" strokeWidth={1.5} strokeDasharray="5,3"/>
      <text x={(cx+h*SC+cx+(h+r)*SC)/2} y={cy-k*SC-7} textAnchor="middle" fontSize={11} fill="#0d9488" fontWeight="bold">r={r}</text>
      <Dot sx={cx+h*SC} sy={cy-k*SC} color="#0d9488" onDown={dn} cx={cx} cy={cy} label={[h,k]}/>
    </svg>
  </div>);
}

function SymmetryModule({sz}){
  const{W,H,SC,panX=0,panY=0}=sz;const cx=W/2-panX*SC,cy=H/2+panY*SC;
  const[px,setPX]=useState(3),[py,setPY]=useState(2),[type,setType]=useState(null);
  const ref=useRef();
  const{dn,mv,up}=useDrag(ref,sz,([mx,my])=>{setPX(mx);setPY(my)});
  const{panStart,panMove,panEnd,panning}=usePan(sz);
  const{pinchStart,pinchMove,pinchEnd}=usePinch(ref,sz);
  const hXY=e=>e.touches?.length>0?[e.touches[0].clientX,e.touches[0].clientY]:[e.clientX,e.clientY];
  const hDn=e=>{if(e.touches?.length>=2){up();panEnd();pinchStart(e.touches);return;}const r=ref.current?.getBoundingClientRect();if(!r)return;const[ex,ey]=hXY(e);if(Math.hypot(ex-r.left-(cx+px*SC),ey-r.top-(cy-py*SC))>40)panStart(ex,ey)};
  const hMv=e=>{if(e.touches?.length>=2){pinchMove(e.touches);return;}const[ex,ey]=hXY(e);if(!panMove(ex,ey))mv(e)};
  const hUp=()=>{pinchEnd();panEnd();up()};
  
  const activeSym = SYM_LIST.find(s=>s.k===type);
  const[sx,sy] = activeSym ? activeSym.fn(px,py) : [px,py];
  
  const symLine = type==='x축' ? <line x1={0} y1={cy} x2={W} y2={cy} stroke="#f59e0b" strokeWidth={3} strokeDasharray="8,5"/> 
    : type==='y축' ? <line x1={cx} y1={0} x2={cx} y2={H} stroke="#f59e0b" strokeWidth={3} strokeDasharray="8,5"/> 
    : type==='y=x' ? <line x1={cx-12*SC} y1={cy+12*SC} x2={cx+12*SC} y2={cy-12*SC} stroke="#f59e0b" strokeWidth={3} strokeDasharray="8,5"/> 
    : type==='y=-x' ? <line x1={cx-12*SC} y1={cy-12*SC} x2={cx+12*SC} y2={cy+12*SC} stroke="#f59e0b" strokeWidth={3} strokeDasharray="8,5"/> 
    : null;

  return(<div className="space-y-3">
    <div className="flex flex-wrap gap-2 justify-center">
      {SYM_LIST.map(s=>(
        <button 
          key={s.k} 
          // 현재 켜진 버튼을 한 번 더 누르면 null이 되어 꺼지게(토글) 만듭니다.
          onClick={()=>setType(prev => prev === s.k ? null : s.k)} 
          className={`text-sm px-3 py-2 rounded-full border-2 font-bold transition-all ${type===s.k?'bg-amber-500 text-white border-amber-500':'bg-white text-amber-600 border-amber-300'}`}>
          {s.k} 대칭
        </button>
      ))}
    </div>
    
    <div className="text-center font-bold text-amber-700 bg-amber-50 rounded-2xl py-3 text-sm border border-amber-200">
      {/* 켜져 있으면 결과를 보여주고, 꺼져 있으면 유도 문구를 보여줍니다. */}
      {type ? `(${px}, ${py}) → ${type} 대칭 → (${sx}, ${sy})` : `점이 어디로 이동할지 상상해보고 버튼을 눌러보세요!`}
    </div>
    
    <svg ref={ref} width={W} height={H} {...SVG_PROPS} style={{...SVG_PROPS.style,cursor:panning?'grabbing':'crosshair'}}
      onMouseDown={hDn} onMouseMove={hMv} onMouseUp={hUp} onMouseLeave={hUp}
      onTouchStart={hDn} onTouchMove={hMv} onTouchEnd={hUp}>
      <Grid W={W} H={H} SC={SC} cx={cx} cy={cy}/>
      {symLine}
      
      {/* 버튼이 눌려있을 때(type이 있을 때)만 이동 후의 점과 점선을 그려줍니다. */}
      {type && (
        <>
          {/* 대칭이동 점선 (선 색상을 짙게(#94a3b8) 하고 굵기를 3으로 키움) */}
          <line x1={cx+px*SC} y1={cy-py*SC} x2={cx+sx*SC} y2={cy-sy*SC} stroke="#94a3b8" strokeWidth={3} strokeDasharray="6,4"/>
          
          <circle cx={cx+sx*SC} cy={cy-sy*SC} r={10} fill="#2563eb" stroke="white" strokeWidth={2.5}/>
          <text x={cx+sx*SC+14} y={cy-sy*SC+4} fontSize={16} fill="#2563eb" fontWeight="900" stroke="white" strokeWidth="3" paintOrder="stroke">({sx},{sy})</text>
        </>
      )}
      
      {/* 이동 전 원본 점 (항상 표시) */}
      <Dot sx={cx+px*SC} sy={cy-py*SC} color="#dc2626" onDown={dn} cx={cx} cy={cy} label={[px,py]}/>
    </svg>
  </div>);
}
